t7.lessons.push({
id:'l2',title:'Documentation: Making the System Legally Real',minutes:17,
objectives:['List the NFPA 72 documentation package: completion through ITM records','Explain the Record of Completion\'s role and contents','Connect commissioning records (FAT/SAT) to code documentation','Set up documentation that survives audits and lawsuits'],
simple:`<p>In the fire alarm world, undocumented work legally never happened. Documentation is not bureaucracy bolted onto the system — it IS part of the system, required by NFPA 72 Chapter 7 with the same "shall" as any circuit rule. The core package:</p>
<ul>
<li><strong>Record of Completion</strong> — the standardized form declaring what was installed, by whom, to which code editions, with what results. Signed. It is the system's birth certificate.</li>
<li><strong>Record drawings, calculations, and manuals</strong> — as-builts, battery and voltage-drop calcs, manufacturer instructions, and the site-specific software/program documentation.</li>
<li><strong>Test and inspection records</strong> — acceptance results and every periodic ITM event thereafter, retained (with the current and prior results available for comparison — trending is the point).</li>
<li><strong>Impairment records</strong> — when parts of the system are out of service: who knew, what mitigations (fire watch), when restored.</li>
</ul>`,
technical:`<p><strong>The commissioning bridge:</strong> your FAT and SAT world maps directly onto the code package. Factory acceptance testing establishes the equipment performs as configured; site acceptance testing proves the installed system performs in place; both generate signed, dated, witnessed records with per-device results. NFPA 3 (commissioning) and NFPA 4 (integrated testing) formalize this: NFPA 72 demands the documents exist; NFPA 3/4 describe the professional process that produces them. When you assemble a SAT package — scripts, results, punch items, retest evidence, final signatures — you are building the acceptance-documentation layer the AHJ and the Record of Completion rest on.</p>
<p><strong>What auditors and lawyers look for later:</strong> completeness (every device appears in acceptance records), traceability (results tie to device addresses and dates and named testers), configuration control (program version documented at acceptance = version running today, or a documented change trail), and continuity (periodic ITM unbroken since acceptance). Build the package so a stranger can reconstruct the system's history without you in the room — that is the standard.</p>`,
field:{
construction:'Closeout is where documentation debts come due: missing calcs, unsigned forms, and un-red-lined drawings stall turnover for weeks. Commissioning teams that track document deliverables from day one close projects months faster.',
commissioning:'Structure your SAT records so each line item cites its requirement (spec paragraph, NFPA 72 section, matrix row). Records that cite their basis are self-defending — in AHJ reviews and in disputes.',
amtrak:'A $1.6B rehabilitation generates documentation at industrial scale — and the operations organization inheriting the tunnels will live on those records for decades. The quality bar for turnover packages on infrastructure is: usable at 3 a.m., ten years from now, by someone who never met you.',
fire:'Impairment documentation is live safety practice, not paperwork: tunnel systems taken down for cutover nights need notification chains and mitigation (fire watch, procedural controls) recorded — the exact discipline NFPA 72 requires and incident investigations reconstruct.'},
terms:[['Record of Completion','NFPA 72\'s standardized closeout declaration of the installed system — signed by responsible parties'],['Acceptance test records','Per-device results from initial (100%) testing — the baseline all future ITM compares against'],['Impairment','A system or portion out of service — requires notification, mitigation, and records'],['FAT / SAT','Factory / Site Acceptance Testing — commissioning\'s staged proof, feeding the code documentation package'],['NFPA 3 / NFPA 4','Commissioning and integrated-testing standards — the process layer above NFPA 72\'s document requirements'],['Configuration control','Documented program versioning so the running system provably matches the accepted one']],
memory:['"No record, no system." The documentation IS a system component.','Package mnemonic R-C-T-I: Record of Completion, Calcs/drawings, Test records, Impairments.'],
examTips:['Know the Record of Completion by name and purpose — and that record drawings and ITM records are code requirements, not best practices.','Questions about "who keeps what, how long" point to Chapter 7 retention concepts: current + previous results available for comparison.'],
checks:[{q:'The standardized NFPA 72 document declaring the system as installed, tested, and compliant at closeout is the:',opts:['Certificate of Occupancy','Record of Completion','Sequence of Operations','Impairment log'],a:1,why:['The CO is the building official\'s document for the whole building, not the fire alarm form.','Correct — the Record of Completion is the fire alarm system\'s signed birth certificate under NFPA 72.','The SOO/matrix defines logic, not closeout declaration.','Impairment logs track out-of-service periods during the system\'s life.']}],
fieldNotes:'Look at an actual completed Record of Completion (your project or NFPA 72 Annex samples). Read every field once — the form itself is a syllabus of what the code thinks matters.',
summary:['Documentation is a code-required system component: completion, drawings/calcs, tests, impairments','FAT/SAT records are the acceptance layer the code package rests on (NFPA 3/4 formalize it)','Traceability + configuration control + continuity = audit-proof','Build records for the stranger at 3 a.m., ten years out']
});

{id:'q7-3',type:'scenario',q:'A contractor finishes installation but cannot produce battery calculations or record drawings. Per NFPA 72, the documentation package is:',opts:['Acceptable if the system tests clean','Incomplete — these are required documents','Optional extras for the owner to request','Only needed for high-rise buildings'],a:1,why:['Functional success does not waive documentation requirements — both are code "shalls."','Correct — calculations, record drawings, and completion documents are required deliverables; the package is deficient without them.','They are requirements, not courtesies.','The requirements apply to fire alarm systems generally, not one occupancy.'],ref:'Lesson 7.2'},

const t8=mkTopic('t8','Installation, Testing & Maintenance','Workmanship and site safety, acceptance testing, and the periodic ITM discipline of NFPA 72 Chapter 14');

t8.lessons.push({
id:'l1',title:'Installation, Workmanship & Site Safety',minutes:18,
objectives:['Apply core installation rules: mounting, boxes, protection, termination','Recognize workmanship standards inspectors enforce','Apply electrical and site safety practice to fire alarm work','Integrate LOTO and energized-work discipline into testing'],
simple:`<p>Good installation is invisible; bad installation is a time bomb with a warranty period. The rules exist because fire alarm equipment must work after years of neglect, vibration, moisture, and other trades' elbows:</p>
<ul>
<li><strong>Mounting:</strong> devices secured to boxes designed for them, plumb and at required heights — never supported by their conductors, never stuck to ceiling tiles that a maintenance visit will displace.</li>
<li><strong>Conductors:</strong> continuous runs, terminated on screw terminals or listed connectors, with polarity respected, labeled at both ends, and looped through devices (break the wire, land both ends — Topic 2's T-tap rule made physical).</li>
<li><strong>Protection:</strong> mechanical protection where subject to damage; proper support intervals; separation from incompatible circuits; firestopping restored at every penetration of rated construction — a fire alarm cable that breaches a fire barrier is a grim irony inspectors hunt for.</li>
<li><strong>Environment:</strong> devices listed for the conditions — wet locations, temperature extremes, corrosive or hazardous (classified) areas each demand appropriately listed equipment.</li>
</ul>`,
technical:`<p><strong>Site safety for fire alarm and commissioning work — the exam's safety content and your daily reality:</strong></p>
<ul>
<li><strong>Electrical safety:</strong> treat circuits as energized until verified — test-before-touch with a meter you have proven on a known source. 120 V primary connections are genuinely dangerous; even 24 V systems interconnect with motor controls and power circuits that are not.</li>
<li><strong>LOTO (lockout/tagout):</strong> when testing interfaces to fans, dampers, elevators, and pumps, the energy you control is not just electrical — rotating machinery, stored pressure, and automatic starts. Commissioning tests that intentionally start equipment need coordination discipline: who is clear, who confirms, who can stop it.</li>
<li><strong>Work at height:</strong> ladders and lifts for ceiling devices — tied off, rated, inspected; most detector work is height work.</li>
<li><strong>Impairment management:</strong> taking systems down for work means fire watch/mitigation planning (Lesson 7.2) — safety practice and code documentation are the same act here.</li>
<li><strong>Coordination:</strong> announcing tests (so a horn test is not mistaken for an evacuation, and an evacuation is never mistaken for a test), radio protocols, and stop-work authority — the human systems that keep integrated testing safe.</li>
</ul>`,
field:{
construction:'Walk any job and you can grade the installer in ten seconds: are conductors dressed and labeled, boxes secured, detectors still in their dust covers during dirty work? Workmanship correlates with everything else you cannot see.',
commissioning:'Dust covers deserve special attention: left ON, detectors cannot see smoke at acceptance (a test failure); taken off too EARLY, construction dust contaminates heads and breeds nuisance alarms for years. Sequencing their removal is a real commissioning coordination task.',
amtrak:'Tunnel work compounds every hazard: track safety and on-track protection, confined-space-like conditions, live traffic adjacencies, night work windows. Your fire alarm test plan is also a safety plan — the OSHA 510/CHST module later formalizes what you already practice.',
fire:'Announced-test discipline is life-critical in transit: an unannounced tunnel notification test could trigger real operational responses. Test notifications, monitoring-company standby, and rollback plans are part of professional practice.'},
terms:[['Workmanship','Installation quality per code, manufacturer instructions, and trade standards — enforceable, not aesthetic'],['Firestopping','Restoring fire-resistance at penetrations of rated construction'],['Test-before-touch','Verify de-energization with a proven meter before contact'],['LOTO','Lockout/tagout — controlling hazardous energy during work'],['Dust covers','Protective caps keeping construction contamination out of detectors — removal is a sequenced commissioning step'],['Classified (hazardous) location','Areas requiring specially listed equipment (flammable atmospheres, etc.)']],
memory:['"Secure, labeled, protected, listed" — the four adjectives of good installation.','"Prove the meter, then the circuit" — test-before-touch in five words.'],
examTips:['Manufacturer\'s published instructions are enforceable installation requirements (listings depend on them) — an answer choice dismissing them is wrong.','Safety questions reward the conservative procedural answer: verify, announce, isolate, then work.'],
checks:[{q:'Smoke detectors in an area of active drywall sanding should be:',opts:['Tested more frequently','Protected with covers (with the impairment managed) until dirty work ends','Replaced with heat detectors permanently','Left uncovered so protection continues'],a:1,why:['Testing does not prevent contamination.','Correct — covers protect the sensing chambers; because covered detectors cannot detect, the impairment must be managed (schedule, mitigation, removal before occupancy/acceptance).','A permanent design change is not a construction-phase dust response.','Uncovered detectors will load with dust — trading today\'s coverage for years of nuisance alarms and early failures.']}],
fieldNotes:'On your next walkdown, photograph one example of excellent conductor dressing and one poor one (for your own reference). Building a personal visual library of good vs bad is how inspection instinct forms.',
summary:['Install for the decade, not the inspection: secure, labeled, protected, environmentally listed','Firestopping and polarity are silent failure points','Safety = proven meters, LOTO, height discipline, impairment management, announced tests','Manufacturer instructions carry code force through the listing']
});

t8.lessons.push({
id:'l2',title:'Acceptance Testing: Proving the System',minutes:19,
objectives:['Explain 100% initial acceptance testing and who witnesses it','Use NFPA 72 Chapter 14 test methods for common devices','Define reacceptance testing triggers and scope','Map SAT practice onto code acceptance requirements'],
simple:`<p>Acceptance testing answers one question with witnesses: <strong>does the installed system actually do everything the approved design says, before anyone relies on it?</strong> The code's answer to "how much do we test?" at initial acceptance is blunt: <strong>everything — 100% of devices, circuits, and functions.</strong> Not a sample. Every detector fires, every pull is pulled, every horn sounds, every matrix row executes, every supervision path is faulted on purpose, primary power is failed on purpose. The test is scripted, the results are recorded per device, and the AHJ (and owner) witness per their requirements.</p>`,
technical:`<ul>
<li><strong>Test methods live in NFPA 72 Chapter 14 (Table 14.4.3.2)</strong> — per device type. The flavor to know at Level I: smoke detectors get functional smoke-entry tests (listed aerosol/smoke into the chamber — proving smoke CAN enter and alarm results, not just a magnet test) plus sensitivity verification within their listed range; restorable heat detectors get listed heat-source tests (never open flame); pull stations operate per their instructions; waterflow via inspector\'s test connection within 90 s; supervision proven by creating opens/grounds; batteries measured under load; NAC end-of-line voltages verified.</li>
<li><strong>Sensitivity testing:</strong> smoke detector sensitivity is verified after installation and periodically thereafter (panel analog reporting on addressable systems typically satisfies the method). Detectors outside listed sensitivity get cleaned/recalibrated or replaced — drift is the enemy.</li>
<li><strong>Reacceptance testing:</strong> after ANY change — added/deleted devices, program changes, repairs — affected components get retested. Program (software) changes additionally require testing a percentage of unmodified initiating devices (10%, up to 50) to prove the change broke nothing else. Version control + reacceptance = change discipline.</li>
<li><strong>Who tests:</strong> qualified personnel (this is literally what NICET certification evidences); the AHJ may witness; the owner\'s representative — you — ensures scope, method, and records meet both code and contract.</li>
</ul>`,
field:{
construction:'Contractors under schedule pressure propose sampling ("we tested that type already") — initial acceptance does not sample. Knowing this cold, with the code section behind it, is owner-side commissioning earning its fee.',
commissioning:'Your SAT is acceptance testing wearing project clothes: scripts sequence the matrix; per-device results become the code'+String.fromCharCode(8217)+'s test records; punch/retest cycles close deficiencies. FAT earlier de-risks it all by proving configuration before shipment — factory findings cost hours, field findings cost nights.',
amtrak:'Integrated tests — LHD zone to fan response to SCADA indication, witnessed end-to-end — are the crown of tunnel acceptance (NFPA 4 territory). Sequencing them into night windows without service impact is precisely the coordination expertise you are building at ERT.',
fire:'Magnet tests verify electronics respond; smoke-entry tests verify the DEVICE works. Knowing which proves what — and which the code requires when — separates technicians from test-button pushers.'},
terms:[['Initial acceptance testing','100% verification of devices, circuits, and functions before the system is relied upon'],['Table 14.4.3.2','NFPA 72\'s per-device test methods table — the how-to-test reference'],['Sensitivity testing','Verifying smoke detectors respond within listed obscuration range; drift detection'],['Reacceptance testing','Retesting after changes — affected components plus a sample of unaffected initiating devices after program changes'],['Functional (smoke-entry) test','Real smoke/aerosol into the chamber proving end-to-end detection — vs electronic simulation'],['Witnessing','AHJ/owner observation of testing per their requirements — the accountability layer']],
memory:['"Initial = everything. Reacceptance = what changed, plus a slice to prove nothing else did."','Program change sample: "ten percent, cap fifty."'],
examTips:['"What percentage of devices at initial acceptance?" → 100%. Every time.','Match method to device: smoke = smoke entry + sensitivity; restorable heat = listed heat source; fusible heat = never destructively tested in routine ITM; waterflow = inspector\'s test, ≤90 s.'],
checks:[{q:'After a panel program modification adding one new zone, reacceptance testing requires testing the new zone AND:',opts:['Nothing else','10% of unmodified initiating devices (max 50)','All devices in the building','Only the notification appliances'],a:1,why:['Software changes can have unintended reach — the code demands proof beyond the change.','Correct — the 10%-up-to-50 sample of unaffected initiating devices verifies the modification did not disturb the rest of the program.','100% is the INITIAL acceptance standard; reacceptance scales to the change.','Notification appliances are not the mandated sample — initiating devices are.']}],
fieldNotes:'Take one matrix row from a recent SAT and trace where each proof lives in the records: initiation evidence, output evidence, timestamps, signatures. If any link is missing, you have found the audit gap before an auditor does.',
summary:['Initial acceptance = 100%, scripted, recorded, witnessed','Chapter 14 methods are per-device: smoke entry, heat source, inspector\'s test, supervision faults','Reacceptance follows every change; program changes add the 10%/50 sample','FAT de-risks SAT; SAT records become the code\'s acceptance documentation']
});

t8.lessons.push({
id:'l3',title:'Periodic ITM & Systematic Troubleshooting',minutes:20,
objectives:['Navigate inspection vs testing frequencies in NFPA 72 Ch. 14','Know the flagship intervals: visual, functional, sensitivity, batteries','Apply the divide-and-conquer method to circuit faults','Use panel data (history, analog values) as diagnostic gold'],
simple:`<p>Systems degrade in silence — dust loads chambers, batteries fade, vibration loosens terminals. Periodic ITM is the code's scheduled skepticism: <strong>inspection</strong> (visual — is it there, undamaged, unobstructed?) and <strong>testing</strong> (functional — does it still work?) on defined frequencies from NFPA 72 Chapter 14's tables. The rhythm to internalize: most things get a <strong>periodic visual inspection</strong> (commonly semiannual) and an <strong>annual functional test</strong>; batteries and supervising-station transmission gear run tighter cycles; smoke sensitivity runs on its own multi-year cadence. Always answered from the tables — which is the exam skill: know the flagship numbers, know where the tables live.</p>`,
technical:`<p><strong>Flagship intervals (2022-era Ch. 14 — verify per edition):</strong></p>
<ul>
<li>Most initiating devices: <strong>annual functional test</strong>; visual inspections typically <strong>semiannual</strong>.</li>
<li><strong>Smoke sensitivity:</strong> verified within 1 year of installation, then every alternate year; after consecutive passes, extension permitted (up to 5-year intervals) — addressable analog reporting usually satisfies the method.</li>
<li><strong>Sealed lead-acid batteries:</strong> charger/voltage checks and load voltage tests on semiannual-or-tighter cycles; replacement per manufacturer (~4–5 years typical).</li>
<li><strong>Waterflow devices:</strong> semiannual testing is the traditional flagship (vane-type via inspector\'s test).</li>
</ul>
<p><strong>Systematic troubleshooting — the half-split method:</strong> a supervised circuit with a fault is a search problem. Do not walk it device by device from the panel: <strong>open the circuit at its midpoint</strong> and observe which half holds the fault (does the trouble clear? does the meter see the EOLR resistance or an open/short?). Then halve the faulted half. A 32-device loop localizes in 5 splits, not 32 visits. Supporting tools: the panel <strong>event history</strong> (when did it start? intermittent at night = temperature; after a storm = moisture ingress), <strong>analog values</strong> (a detector drifting toward threshold names itself), ground-fault isolation by disconnecting circuits one at a time at the panel, and resistance measurements against expected values (known EOLR = healthy Class B circuit reads it end-to-end).</p>`,
field:{
construction:'New systems inherit construction faults: crushed cable behind rework, moisture in exterior boxes, mis-lands from splice consolidation. The half-split method plus as-builts turns "somewhere in zone 4" into one junction box by lunch.',
commissioning:'Troubleshooting speed is commissioning credibility: when a SAT step fails at 2 a.m. in a work window, the specialist who can bisect a circuit efficiently saves the window — and the schedule. Method beats heroics.',
amtrak:'ITM frequencies become the operations organization\'s maintenance program — your commissioning turnover (asset lists, baseline values, test records) is what makes their program executable. LHD zones with documented baseline resistances and locations are maintainable; undocumented ones are archaeology.',
fire:'Panel history on intermittents is forensic evidence: a ground fault appearing during rain, on one circuit, narrows to that circuit\'s wet-exposed segments before anyone lifts a wire. Read history first; drive second.'},
terms:[['Inspection vs testing','Visual verification of condition vs functional verification of operation — separate frequencies'],['ITM','Inspection, Testing & Maintenance — the Chapter 14 lifecycle discipline'],['Sensitivity trending','Watching analog smoke values drift over time — predictive maintenance from panel data'],['Half-split (bisection)','Fault-finding by repeatedly opening the circuit midpoint — log2 speed instead of linear'],['Event history','The panel\'s timestamped log — first stop for any intermittent'],['Baseline values','Commissioning-recorded normals (resistances, analog values, voltages) that make later drift visible']],
memory:['"Look twice a year, prove once a year" — the visual/functional rhythm for most devices.','Troubleshooting order: "History, halves, hands" — read the log, split the circuit, then touch things.'],
examTips:['Frequency questions are table lookups — memorize the flagships (annual functional, semiannual visuals/waterflow/battery checks, sensitivity\'s alternate-year cadence) and recognize Chapter 14 as the source for the rest.','Troubleshooting questions reward the SYSTEMATIC option: check history/split the circuit beats replace parts or walk every device.'],
checks:[{q:'A Class B IDC shows trouble. Opening the circuit at its midpoint and metering toward the EOL reads the correct EOLR value. The fault is:',opts:['Between the midpoint and the EOL','Between the panel and the midpoint','In the EOL resistor','In the panel\'s power supply'],a:1,why:['The far half just proved itself — correct EOLR resistance end-to-end means that half is intact.','Correct — if the far half is healthy, the open must lie panel-side of your split. Halve that half next.','The EOLR read correctly — it is exonerated.','A power supply fault would not present as a single-circuit open with these readings.']}],
fieldNotes:'Next trouble event on site, resolve it on paper first: history, then a split plan, THEN walk. Count how many physical stops the method needed vs walking the whole circuit. The ratio is why professionals bisect.',
summary:['ITM = scheduled skepticism: visuals (semiannual-ish) + functional tests (annual-ish) + special cadences (sensitivity, batteries)','Chapter 14 tables answer frequency questions — carry the flagships in memory','Half-split turns fault-finding from linear to logarithmic','Panel history and baseline data are diagnostic instruments — use them first']
});

t8.quiz=[
{id:'q8-1',type:'mc',q:'At initial acceptance testing, the percentage of installed initiating devices that must be tested is:',opts:['10%','50%','100%','A representative sample chosen by the contractor'],a:2,why:['10% (max 50) is the reacceptance sample after program changes — a different situation.','No half-measures at birth.','Correct — initial acceptance is 100% of devices, circuits, and functions, recorded per device.','Sampling at initial acceptance is exactly what the code forbids.'],ref:'Lesson 8.2'},
{id:'q8-2',type:'mc',q:'The correct routine functional test for a restorable spot heat detector uses:',opts:['An open flame held below the detector','A listed/approved heat source','Replacing the detector annually','A magnet'],a:1,why:['Open flame on a ceiling device is a hazard and can damage the unit.','Correct — controlled listed heat sources prove response without damage; the device restores after cooling.','Replacement is the regime for NON-restorable (fusible) elements per schedule, not restorable ones.','Magnets exercise electronics on some devices — they do not prove thermal response.'],ref:'Lesson 8.2'},
{id:'q8-3',type:'trouble',q:'An intermittent ground fault appears on one circuit mainly during rainstorms. The most efficient FIRST diagnostic step is:',opts:['Replace the FACP','Review panel event history and correlate, then meter that circuit\'s wet-exposed segments','Re-terminate every device on the system','Disable ground fault detection'],a:1,why:['The panel is reporting the fault, not causing it.','Correct — history correlation (rain = moisture ingress) plus targeted metering of exterior/wet segments is the systematic path; the pattern has already localized the fault class for you.','Shotgun re-termination is linear search at maximum cost.','Disabling detection hides a real degradation that will become a second, disabling fault.'],ref:'Lesson 8.3'},
{id:'q8-4',type:'scenario',q:'During dirty construction phases, the correct handling of installed smoke detectors is:',opts:['Leave them active and uncovered for early warning','Protective covers with managed impairment, removed before acceptance testing','Remove and store all detectors off-site','Bag them permanently'],a:1,why:['Uncovered heads load with dust — buying nuisance alarms and early replacement.','Correct — covers plus impairment management (mitigation, tracking, sequenced removal) is the professional standard; acceptance requires clean, uncovered, functional devices.','Wholesale removal breaks circuits and supervision and loses devices.','Covers left at occupancy = detectors that cannot detect — a life-safety failure.'],ref:'Lesson 8.1'},
{id:'q8-5',type:'mc',q:'Smoke detector sensitivity outside its listed range must be:',opts:['Noted and rechecked in five years','Cleaned/recalibrated or replaced','Ignored if the detector passes a magnet test','Compensated by raising the alarm verification time'],a:1,why:['Out-of-range drift is a now problem — it means missed fires (insensitive) or nuisance alarms (oversensitive).','Correct — restore it to listed range (cleaning/recalibration) or replace it; those are the only compliant outcomes.','Magnet response does not verify sensitivity.','Verification timing is nuisance management, never a sensitivity fix.'],ref:'Lessons 8.2–8.3'},
{id:'q8-6',type:'calc',q:'Using half-splitting, the maximum number of circuit openings needed to isolate one open among 64 series-wired devices is about:',opts:['64','32','6','12'],a:2,why:['64 is the walk-every-device worst case the method exists to avoid.','32 is one split — you are just getting started.','Correct — each split halves the search: 64→32→16→8→4→2→1 is 6 splits (log2 of 64).','12 would imply a partial-split strategy — clean halving needs only 6.'],ref:'Lesson 8.3'},
];

const t9=mkTopic('t9','Code Navigation & Exam Mastery','Finding anything in NFPA 72 fast, and converting everything you\'ve learned into exam points');

t9.lessons.push({
id:'l1',title:'Navigating NFPA 72 at Speed',minutes:19,
objectives:['Recite the NFPA 72 chapter map from memory','Choose between index, TOC, and chapter-instinct lookup strategies','Use Annex A cross-references to decode intent','Hit sub-60-second lookups on drilled question types'],
simple:`<p>NFPA 72 is not a book, it is a database with a spine — and the exam (like the field) rewards those who query it fast. The master key is the chapter map. Say it until it is reflex:</p>
<ul>
<li><strong>1–3</strong> Administration · Referenced publications · <strong>Definitions</strong> (when in doubt, Chapter 3 first)</li>
<li><strong>7</strong> <strong>Documentation</strong> (Record of Completion lives here)</li>
<li><strong>10</strong> <strong>Fundamentals</strong> (power supplies, signal priority, personnel qualifications)</li>
<li><strong>12</strong> <strong>Circuits & pathways</strong> (Classes A/B/C/D/E/N/X, survivability)</li>
<li><strong>14</strong> <strong>Inspection, Testing & Maintenance</strong> (the tables)</li>
<li><strong>17</strong> <strong>Initiating devices</strong> (detectors, pulls, waterflow, spacing)</li>
<li><strong>18</strong> <strong>Notification appliances</strong> (dBA, candela, mounting)</li>

</ul>`,
technical:`<p><strong>Three lookup strategies, chosen per question:</strong></p>
<ol>
<li><strong>Chapter instinct</strong> (fastest): the question's subject names the chapter — a candela question is Chapter 18; a test-frequency question is 14; a definition is 3. Drill until the mapping is subconscious.</li>
<li><strong>Index</strong> (for cross-cutting terms): the index is alphabetic and deep — "batteries" or "smoke detector, spacing" lands you within a page. Practice flipping to the index in one motion.</li>
<li><strong>Table of contents scan</strong> (for structure questions): chapter openings list their sections — a 20-second scan beats a 3-minute page hunt when you know the chapter but not the section.</li>
</ol>
<p><strong>Annex A is the hidden manual:</strong> any paragraph marked with an asterisk has commentary in Annex A under the same number (A.17.7.x explains 17.7.x). Non-mandatory, but it explains WHY — which is how first-principles learners like you convert code text into permanent understanding. <strong>Reference-policy note:</strong> historically NICET fire alarm exams permitted approved code references at the testing center; current CBT policies vary — check YOUR exam notice. Train for both: memorized flagships (fast, no lookup) plus navigation speed (for whatever references the exam interface or center permits).</p>`,

simple:`<p>You will have ~78 seconds per question. The exam is a resource-allocation problem before it is a knowledge problem:</p>

<li><strong>Elimination first on scenarios:</strong> two options usually violate a fundamental you now own (an unsupervised path, a mixed-up signal category, a missing ×2 loop factor). Kill them, then choose between survivors — 50/50 beats 25/25 even when unsure.</li>
<li><strong>Calculation discipline:</strong> write the formula, then substitute, then compute. The distractors are pre-built from setup errors (skipped ×1.2, minutes-for-hours, forgotten return conductor) — the formula-first habit is your armor.</li>
<li><strong>Changed answers:</strong> only with a concrete reason (misread, computation error found). Vibes-based switching statistically hurts.</li>
</ul>`,
technical:`<p><strong>The final-3-weeks protocol:</strong></p>
<ol>
<li><strong>Week −3:</strong> full timed practice exam (this app\'s exam simulator). Score by topic; the two weakest topics get 60% of the week\'s hours. Re-drill their flashcards and redo their quizzes to 85%+.</li>
<li><strong>Week −2:</strong> second timed exam. Target: score above your Week −3 by closing weak areas, lookup drills under 60 s, calculation set (battery, voltage drop, spacing) at 100% twice through.</li>
<li><strong>Week −1:</strong> light review only — flashcards, flagged lessons\' summaries, one final calculation pass. Verify: admission email, ID requirements, center address (or OnVUE system check for online), permitted materials per YOUR exam notice. Sleep is a study strategy: two full nights before exam day.</li>
</ol>
<p><strong>Readiness gates (be honest):</strong> practice exams ≥80%, every topic quiz ≥75%, calculations at 100% under time, lookup drills under 60 s. Below gates → move the exam date, not the standard; NICET retake policies cost you months — one properly-prepared attempt beats two hopeful ones.</p>
<p><strong>Exam-day psychology:</strong> the first five questions calibrate nothing — hard ones early are randomization, not an omen. Bank your confidence on process: you have field-tested this knowledge in a tunnel under the East River; the exam is a quieter Tuesday than your job.</p>`,

<script>
/* =====================================================================
   ENGINE A — state, utilities, layout, router, dashboard
   ===================================================================== */
'use strict';

/* ---------- State (in-memory; persisted via Backup/Restore JSON) ---------- */
const DEFAULT_STATE = () => ({
  v:1,
  completedLessons:{}, checks:{}, quizBest:{}, quizHistory:[], practiceExams:[],
  hours:[], activity:{}, bookmarks:{}, notes:{}, confidence:{}, flashKnown:{},
  planner:{examDate:'', hoursPerWeek:7, days:[1,2,3,4,6], vacations:'', busy:''},
  certDates:{}, expStart:'', theme:'auto', doneCerts:{}
});
let S = Object.assign(DEFAULT_STATE(), window.SAVED_STATE||{});

/* ---------- Utilities ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=d=>{if(!d)return '—';const dt=(d instanceof Date)?d:new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});};
const fmtDateShort=d=>{const dt=(d instanceof Date)?d:new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});};
const addDays=(d,n)=>{const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt;};
const addMonths=(d,n)=>{const dt=new Date(d);dt.setMonth(dt.getMonth()+n);return dt;};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
function markActivity(mins){const d=todayStr();S.activity[d]=(S.activity[d]||0)+(mins||10);refreshTopStats();}

/* ---------- Icons ---------- */
const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-6-2V4l6 2 6-2 6 2v14l-6-2-6 2z"/><path d="M9 6v14M15 4v14"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 6V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  coach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>',
  bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  bookmarkFill:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 .2C15 8 18 9 18 13a6 6 0 1 1-12 0c0-5 5-6 6-11z"/></svg>',
  award:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg>',
  arrowR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  arrowL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
};

/* ---------- Curriculum helpers ---------- */
const CERT=id=>DATA.certs.find(c=>c.id===id);
const lessonKey=(c,t,l)=>c+'/'+t+'/'+l;
function allLessons(cert){const out=[];cert.topics.forEach(t=>t.lessons.forEach(l=>out.push({cert:cert.id,topic:t,lesson:l,key:lessonKey(cert.id,t.id,l.id)})));return out;}
function certProgress(cert){const ls=allLessons(cert);if(!ls.length)return{done:0,total:0,pct:0};const done=ls.filter(x=>S.completedLessons[x.key]).length;return{done,total:ls.length,pct:Math.round(done/ls.length*100)};}
function topicProgress(certId,t){const total=t.lessons.length;const done=t.lessons.filter(l=>S.completedLessons[lessonKey(certId,t.id,l.id)]).length;return{done,total,pct:total?Math.round(done/total*100):0};}
function quizStats(certId){const c=CERT(certId);let sum=0,n=0,weak=[],strong=[];c.topics.forEach(t=>{const b=S.quizBest[certId+'/'+t.id];if(b){sum+=b.pct;n++;if(b.pct<70)weak.push({t,pct:b.pct});else if(b.pct>=85)strong.push({t,pct:b.pct});}});return{avg:n?Math.round(sum/n):null,taken:n,weak,strong};}
function confidenceScore(certId){const c=CERT(certId);const vals=c.topics.map(t=>S.confidence[certId+'/'+t.id]).filter(v=>v);if(!vals.length)return null;return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*20);}
function readiness(certId){const p=certProgress(CERT(certId)).pct;const q=quizStats(certId);const pe=S.practiceExams.filter(e=>e.cert===certId);const peAvg=pe.length?pe.reduce((a,e)=>a+e.pct,0)/pe.length:null;const conf=confidenceScore(certId);let score=0.35*p;score+=0.35*(q.avg!=null?q.avg:p*0.5);score+=0.15*(peAvg!=null?peAvg:(q.avg!=null?q.avg*0.8:p*0.4));score+=0.15*(conf!=null?conf:50);return Math.round(clamp(score,0,100));}
function activeCert(){return DATA.certs.find(c=>!S.doneCerts[c.id])||DATA.certs[DATA.certs.length-1];}
function totalHours(){return S.hours.reduce((a,h)=>a+h.h,0);}
function weekHours(){const now=new Date();const start=addDays(now,-((now.getDay()+6)%7));start.setHours(0,0,0,0);return S.hours.filter(h=>new Date(h.date+'T12:00:00')>=start).reduce((a,h)=>a+h.h,0);}
function streak(){let n=0;let d=new Date();if(!S.activity[todayStr()]){d=addDays(d,-1);}for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(S.activity[k]){n++;d=addDays(d,-1);}else break;}return n;}
function nextLesson(certId){const c=CERT(certId||activeCert().id);for(const t of c.topics){for(const l of t.lessons){if(!S.completedLessons[lessonKey(c.id,t.id,l.id)])return{cert:c,topic:t,lesson:l};}}return null;}
function skillsLearned(){const out=[];DATA.certs.forEach(c=>{c.topics.forEach(t=>{const tp=topicProgress(c.id,t);if(tp.total&&tp.done===tp.total)out.push(t.name);});if(S.doneCerts[c.id])out.push(...(c.careerData.skills||[]));});return [...new Set(out)];}

/* ---------- Roadmap dates ---------- */
function roadmapDates(){const out=[];let cursor=new Date();DATA.certs.forEach(c=>{let target=S.certDates[c.id]?new Date(S.certDates[c.id]+'T12:00:00'):null;if(c.id===activeCert().id&&S.planner.examDate)target=new Date(S.planner.examDate+'T12:00:00');if(!target){target=addMonths(cursor,c.defaultMonths);}out.push({cert:c,date:target,done:!!S.doneCerts[c.id]});cursor=new Date(target);});return out;}

/* ---------- Layout ---------- */
function renderSidebar(){
  const route=(ROUTE||location.hash)||'#dashboard';
  const certLinks=DATA.certs.map(c=>{
    const p=certProgress(c);const active=route.startsWith('#cert/'+c.id)||route.startsWith('#lesson/'+c.id)||route.startsWith('#quiz/'+c.id);
    const badge=S.doneCerts[c.id]?'✓':(p.total?p.pct+'%':'');
    return '<button class="nav-item '+(active?'active':'')+'" onclick="go(\'#cert/'+c.id+'\')"><span class="nav-cert-dot" style="background:var('+c.colorVar+')"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.short)+'</span>'+(badge?'<span class="nv-badge">'+badge+'</span>':'')+'</button>';
  }).join('');
  const item=(hash,icon,label)=>'<button class="nav-item '+(route===hash||route.startsWith(hash+'/')?'active':'')+'" onclick="go(\''+hash+'\')">'+icon+'<span>'+label+'</span></button>';
  $('#sidebar').innerHTML=
  '<div class="brand"><div class="brand-logo">CA</div><div><div class="brand-name">Cert Academy</div><div class="brand-sub">Adeel · Cx Specialist</div></div></div>'
  +item('#dashboard',IC.home,'Dashboard')+item('#roadmap',IC.map,'Career Roadmap')
  +'<div class="nav-section">Certifications</div>'+certLinks
  +'<div class="nav-section">Study Tools</div>'
  +item('#planner',IC.cal,'Study Planner')+item('#flashcards',IC.cards,'Flashcards')+item('#notes',IC.note,'Notes')+item('#coach',IC.coach,'AI Coach')
  +'<div class="sidebar-foot">Progress lives in this session.<br><a href="#" onclick="openBackup();return false;">Backup / restore</a> to keep it.</div>';
}
function refreshTopStats(){$('#streakStat').textContent=streak()+(streak()===1?' day':' days');$('#hoursStat').textContent=totalHours().toFixed(1)+' h';}
function renderBottomNav(){
  const route=(ROUTE||location.hash)||'#dashboard';const ac=activeCert();
  const items=[['#dashboard',IC.home,'Home',h=>route==='#dashboard'||route===''],
    ['#cert/'+ac.id,IC.book,'Learn',h=>route.startsWith('#cert')||route.startsWith('#lesson')||route.startsWith('#quiz')||route.startsWith('#exam')],
    ['#planner',IC.cal,'Plan',h=>route.startsWith('#planner')],
    ['#flashcards',IC.cards,'Cards',h=>route.startsWith('#flashcards')],
    ['#coach',IC.coach,'Coach',h=>route.startsWith('#coach')||route.startsWith('#roadmap')||route.startsWith('#notes')]];
  $('#bottomnav').innerHTML=items.map(it=>'<button class="'+(it[3]()?'on':'')+'" onclick="go(\''+it[0]+'\')">'+it[1]+'<span>'+it[2]+'</span></button>').join('');
}

/* ---------- Router (sandbox-safe: works even where the viewer blocks URL changes) ---------- */
let ROUTE='';
function go(hash){
  ROUTE=hash;
  try{if(history.replaceState)history.replaceState(null,'',hash);else location.hash=hash;}
  catch(e){try{location.hash=hash;}catch(e2){/* URL locked by sandbox — ROUTE carries navigation */}}
  render();
}
window.addEventListener('hashchange',()=>{ROUTE=location.hash;render();});
function render(){
  const h=((ROUTE||location.hash)||'#dashboard').slice(1);
  const [view,...args]=h.split('/');
  $('#sidebar').classList.remove('open');
  const V={dashboard:vDashboard,roadmap:vRoadmap,cert:vCert,lesson:vLesson,quiz:vQuiz,exam:vExam,flashcards:vFlash,planner:vPlanner,notes:vNotes,coach:vCoach,search:vSearch};
  (V[view]||vDashboard)(...args.map(decodeURIComponent));
  renderSidebar();renderBottomNav();refreshTopStats();
  $('#view').scrollIntoView({block:'start'});window.scrollTo({top:0});
}

/* ---------- Shared UI bits ---------- */
function ring(pct,size,color){size=size||120;const r=(size-14)/2,c=2*Math.PI*r;const off=c*(1-clamp(pct,0,100)/100);
  return '<div class="ring-wrap"><svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="10"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(color||'var(--accent)')+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset .6s"/></svg><div class="ring-txt"><b>'+pct+'%</b><span>complete</span></div></div>';}
function pbar(pct,color){return '<div class="pbar"><div style="width:'+clamp(pct,0,100)+'%'+(color?';background:'+color:'')+'"></div></div>';}
function diffDots(n){let s='<span class="diff-dots">';for(let i=1;i<=5;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return s+'</span>';}

/* ---------- Dashboard ---------- */
function vDashboard(){
  const ac=activeCert(),p=certProgress(ac),qs=quizStats(ac.id),rd=readiness(ac.id);
  const nl=nextLesson(ac.id);const rm=roadmapDates();
  const doneCerts=DATA.certs.filter(c=>S.doneCerts[c.id]);
  const skills=skillsLearned();
  const conf=confidenceScore(ac.id);
  const plan=buildPlan();
  const todays=todaysTasks(plan);
  const wkGoal=(S.planner.hoursPerWeek||7);
  const wh=weekHours();
  const exp=expMonths();

  /* overall roadmap progress: weight each cert equally */
  const overall=Math.round(DATA.certs.reduce((a,c)=>a+(S.doneCerts[c.id]?100:certProgress(c).pct),0)/DATA.certs.length);

  /* timeline */
  const tl=rm.map((r,i)=>{const col='var('+r.cert.colorVar+')';const st=r.done?'<span style="color:var(--good-text)">✓ Earned</span>':(r.cert.id===ac.id?'<span style="color:var(--accent-ink)">● In progress</span>':'<span class="muted">Planned</span>');
    return '<div class="tl-item"><div class="tl-track"><div style="background:'+(r.done?col:'transparent')+';width:100%"></div><span class="tl-dot" style="background:'+col+'"></span></div><div class="tl-name">'+esc(r.cert.short)+'</div><div class="tl-date">'+(r.done?'Done':'target '+fmtDate(r.date))+'</div><div class="tl-status">'+st+'</div></div>';}).join('');

  /* heat strip: last 26 weeks? keep simple: last 182 days condensed → 26x7 too big; use last 26 days *? Use 12 weeks = 84 cells (26 cols x ~3?) — simpler: last 52 days in 26x2. Use last 78 days: 26 cols × 3 rows */
  let heat='';const days=78;for(let i=days-1;i>=0;i--){const d=addDays(new Date(),-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const m=S.activity[k]||0;const col=m===0?'var(--surface2)':m<20?'var(--seq1)':m<45?'var(--seq3)':m<90?'var(--seq4)':'var(--seq6)';heat+='<div class="heat-cell" style="background:'+col+'" title="'+k+(m?' · '+m+' min':'')+'"></div>';}

  /* quiz accuracy bars by topic */
  const bars=ac.topics.map(t=>{const b=S.quizBest[ac.id+'/'+t.id];const v=b?b.pct:0;const col=b?(b.pct<70?'var(--serious)':b.pct>=85?'var(--good)':'var(--accent)'):'var(--surface2)';
    return '<div class="bar-row"><div class="br-label" title="'+esc(t.name)+'">'+esc(t.name)+'</div><div class="br-track"><div class="br-fill" style="width:'+v+'%;background:'+col+'"></div></div><div class="br-val">'+(b?v+'%':'—')+'</div></div>';}).join('');

  const todayHtml=todays.length?todays.map((t,i)=>{const id='task'+i;const done=S.activity['task:'+todayStr()+':'+i];
    return '<div class="check-row '+(done?'done':'')+'"><div class="checkbox '+(done?'on':'')+'" onclick="toggleTask('+i+')">'+(done?IC.check:'')+'</div><div class="ck-label" style="flex:1">'+t.html+'</div></div>';}).join('')
    :'<div class="empty">Set an exam date in the <a href="#" onclick="go(\'#planner\');return false">Study Planner</a> to generate daily tasks — or just start the next lesson below.</div>';

  const milestones=plan?plan.milestones.slice(0,4).map(m=>'<div class="milestone"><b>'+esc(m.label)+'</b><div class="small muted">'+fmtDate(m.date)+'</div></div>').join(''):'<div class="empty small">Configure the planner to see milestones.</div>';

  $('#view').innerHTML=
  '<div class="row spread mb"><div><h1>Welcome back, Adeel</h1><p class="muted small">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+esc(dailyMotivation())+'</p></div>'
  +'<button class="btn btn-primary" onclick="go(\''+(nl?'#lesson/'+nl.cert.id+'/'+nl.topic.id+'/'+nl.lesson.id:'#cert/'+ac.id)+'\')">'+IC.play+' Continue: '+esc(nl?nl.lesson.title:'Review '+ac.short)+'</button></div>'

  +'<div class="grid grid-4 mb">'
  +'<div class="card stat-tile"><div class="st-label">'+IC.trend+' Overall roadmap</div><div class="st-value">'+overall+'%</div><div class="mt">'+pbar(overall)+'</div><div class="st-sub">'+doneCerts.length+' of '+DATA.certs.length+' certifications earned</div></div>'
  +'<div class="card stat-tile"><div class="st-label">'+IC.flame+' Study streak</div><div class="st-value">'+streak()+' <span style="font-size:1rem;font-weight:600">'+(streak()===1?'day':'days')+'</span></div><div class="st-sub">'+(S.activity[todayStr()]?'Active today — keep the chain':'Not yet today — 15 minutes protects it')+'</div></div>'
  +'<div class="card stat-tile"><div class="st-label">'+IC.clock+' Hours studied</div><div class="st-value">'+totalHours().toFixed(1)+'</div><div class="st-sub">'+wh.toFixed(1)+' / '+wkGoal+' h this week</div><div class="mt">'+pbar(wh/wkGoal*100)+'</div></div>'
  +'<div class="card stat-tile"><div class="st-label">'+IC.target+' Exam readiness</div><div class="st-value">'+rd+'%</div><div class="st-sub">'+esc(ac.short)+' · quiz avg '+(qs.avg!=null?qs.avg+'%':'—')+' · confidence '+(conf!=null?conf+'%':'—')+'</div></div>'
  +'</div>'

  +'<div class="card mb"><div class="card-title"><h2>'+IC.map+' Certification roadmap</h2><button class="btn btn-ghost btn-sm" onclick="go(\'#roadmap\')">Career view '+IC.arrowR+'</button></div><div class="timeline">'+tl+'</div></div>'

  +'<div class="grid grid-main mb">'
  +'<div style="display:grid;gap:18px">'
    +'<div class="card"><div class="card-title"><h2>'+IC.check+' Today’s tasks</h2><span class="badge blue">'+(plan?'Week '+plan.currentWeek+' of '+plan.weeks.length:'no plan yet')+'</span></div>'+todayHtml
    +'<div class="row mt"><button class="btn btn-soft btn-sm" onclick="logHoursPrompt()">'+IC.clock+' Log study time</button><button class="btn btn-ghost btn-sm" onclick="go(\'#planner\')">Open planner</button></div></div>'
    +'<div class="card"><div class="card-title"><h2>'+IC.trend+' Quiz accuracy by topic</h2><span class="small muted">'+esc(ac.short)+'</span></div><div class="bars">'+(qs.taken?bars:'<div class="empty">Take your first topic quiz to see accuracy here.</div>')+'</div>'
    +(qs.weak.length?'<div class="callout warn mt"><div class="co-head">Weak topics detected</div>'+qs.weak.map(w=>esc(w.t.name)+' ('+w.pct+'%)').join(' · ')+' — the Coach recommends re-drilling these before new material.</div>':'')+'</div>'
    +'<div class="card"><div class="card-title"><h2>'+IC.flame+' Consistency (last 78 days)</h2></div><div class="heat-strip">'+heat+'</div><div class="heat-legend">less <i style="background:var(--surface2)"></i><i style="background:var(--seq1)"></i><i style="background:var(--seq3)"></i><i style="background:var(--seq4)"></i><i style="background:var(--seq6)"></i> more</div></div>'
  +'</div>'
  +'<div style="display:grid;gap:18px;align-content:start">'
    +'<div class="card" style="text-align:center"><div class="card-title" style="justify-content:center"><h2>Current certification</h2></div>'+ring(p.pct,130,'var('+ac.colorVar+')')+'<h3 class="mt">'+esc(ac.short)+'</h3><div class="small muted">'+p.done+' of '+p.total+' lessons · '+esc(ac.tagline)+'</div><div class="row mt" style="justify-content:center"><button class="btn btn-primary btn-sm" onclick="go(\'#cert/'+ac.id+'\')">Open module</button><button class="btn btn-ghost btn-sm" onclick="go(\'#exam/'+ac.id+'\')">Practice exam</button></div></div>'
    +'<div class="card"><div class="card-title"><h2>'+IC.award+' Upcoming milestones</h2></div>'+milestones+'</div>'
    +'<div class="card"><div class="card-title"><h2>'+IC.cal+' Experience tracker</h2></div>'
      +'<div class="field"><label>Fire alarm experience start date</label><input type="date" value="'+esc(S.expStart)+'" onchange="S.expStart=this.value;render()"></div>'
      +(S.expStart?('<div class="small mb"><b>'+exp.toFixed(1)+' months</b> of documented experience</div>'
        +'<div class="small muted">NICET I (6 mo required)</div>'+pbar(exp/6*100,'var(--s1)')
        +'<div class="small muted mt">NICET II (24 mo required)</div>'+pbar(exp/24*100,'var(--s3)')
        +'<div class="small mt '+(exp>=24?'':'muted')+'">'+(exp>=24?'✓ Experience requirement met for NICET II':(24-exp).toFixed(1)+' months remaining for NICET II')+'</div>')
        :'<div class="small muted">Set the date your fire detection & signaling work began (your ERT role counts).</div>')+'</div>'
    +'<div class="card"><div class="card-title"><h2>'+IC.bolt+' Skills learned</h2></div>'+(skills.length?'<div class="row">'+skills.map(s=>'<span class="badge">'+esc(s)+'</span>').join('')+'</div>':'<div class="empty small">Complete topics to collect skills.</div>')+'</div>'
  +'</div></div>';
}
function expMonths(){if(!S.expStart)return 0;const ms=new Date()-new Date(S.expStart+'T12:00:00');return Math.max(0,ms/(1000*3600*24*30.44));}
function toggleTask(i){const k='task:'+todayStr()+':'+i;if(S.activity[k]){delete S.activity[k];}else{S.activity[k]=1;markActivity(5);toast('Task checked off');}render();}
function dailyMotivation(){const day=Math.floor(new Date()/(864e5));return DATA.motivation[day%DATA.motivation.length];}
function logHoursPrompt(){openModal('<h2>Log study time</h2><div class="field"><label>Minutes studied</label><input id="lhMin" type="number" min="5" step="5" value="30"></div><div class="field"><label>Note (optional)</label><input id="lhNote" placeholder="e.g., Topic 3 lessons + flashcards"></div><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doLogHours()">Log it</button></div>');}
function doLogHours(){const m=parseFloat($('#lhMin').value)||0;if(m>0){S.hours.push({date:todayStr(),h:+(m/60).toFixed(2),note:$('#lhNote').value});markActivity(m);toast(m+' minutes logged — streak protected');}closeModal();render();}

/* ---------- Roadmap / career view ---------- */
function vRoadmap(){
  const rm=roadmapDates();
  const ladder=DATA.careerLadder.map((s,i)=>'<tr><td style="white-space:nowrap">'+esc(s.stage)+'</td><td><b>'+esc(s.role)+'</b><div class="small muted">'+esc(s.note)+'</div></td></tr>').join('');
  const certRows=DATA.certs.map(c=>{const cd=c.careerData;
    return '<div class="card mb"><div class="row spread"><div class="row"><span class="nav-cert-dot" style="background:var('+c.colorVar+');width:12px;height:12px"></span><h2>'+esc(c.name)+'</h2></div>'+diffDots(Math.round(c.difficulty))+'</div>'
    +'<p class="small muted mt">'+esc(c.tagline)+' · ~'+c.estHours+' study hours · '+esc(c.examFee)+'</p>'
    +'<div class="grid grid-2 mt"><div><h3 class="small">Typical job titles</h3><div class="row mt">'+cd.titles.map(t=>'<span class="badge">'+esc(t)+'</span>').join('')+'</div>'
    +'<h3 class="small mt">Skills gained</h3><div class="row mt">'+cd.skills.map(t=>'<span class="badge outline">'+esc(t)+'</span>').join('')+'</div></div>'
    +'<div><table class="tbl kv-table"><tr><td>Commissioning</td><td>'+esc(cd.relates.cx)+'</td></tr><tr><td>Construction Mgmt</td><td>'+esc(cd.relates.cm)+'</td></tr><tr><td>Fire Protection</td><td>'+esc(cd.relates.fp)+'</td></tr><tr><td>Project Mgmt</td><td>'+esc(cd.relates.pm)+'</td></tr></table></div></div>'
    +'<div class="callout mt"><div class="co-head">Salary & value</div>'+esc(c.salary)+'</div></div>';}).join('');
  $('#view').innerHTML='<h1 class="mb">Career Roadmap</h1>'
  +'<div class="card mb"><div class="card-title"><h2>'+IC.trend+' Progression ladder</h2><span class="small muted">each credential stacks on the last</span></div><table class="tbl">'+ladder+'</table></div>'
  +'<div class="card mb"><div class="card-title"><h2>'+IC.cal+' Target dates</h2></div><table class="tbl"><tr><th>Certification</th><th>Target exam date</th><th>Status</th></tr>'
  +rm.map(r=>'<tr><td>'+esc(r.cert.short)+'</td><td><input type="date" value="'+(S.certDates[r.cert.id]||'')+'" onchange="S.certDates[\''+r.cert.id+'\']=this.value;render()"><span class="small muted"> '+(S.certDates[r.cert.id]?'':'auto: '+fmtDate(r.date))+'</span></td><td>'+(r.done?'<span class="badge good">Earned</span>':(r.cert.id===activeCert().id?'<span class="badge blue">In progress</span>':'<span class="badge">Queued</span>'))+'</td></tr>').join('')+'</table>'
  +'<p class="small muted mt">Dates cascade: certifications without a set date are estimated from the previous one plus a realistic study window.</p></div>'
  +certRows;
}
</script>
<script>
/* =====================================================================
   ENGINE B — planner, cert/lesson/quiz views, flashcards, coach, search
   ===================================================================== */
'use strict';

/* ---------- Study planner engine ---------- */
function parseList(s){return String(s||'').split(',').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));}
function buildPlan(){
  const ac=activeCert();if(!S.planner.examDate)return null;
  const exam=new Date(S.planner.examDate+'T12:00:00');const now=new Date();now.setHours(0,0,0,0);
  if(exam<=now)return null;
  const start=addDays(now,-((now.getDay()+6)%7));start.setHours(0,0,0,0);
  const nWeeks=Math.max(1,Math.ceil((exam-start)/(7*864e5)));
  const vac=parseList(S.planner.vacations),busy=parseList(S.planner.busy);
  const reserve=nWeeks>=6?3:nWeeks>=4?2:nWeeks>=2?1:0;

  const units=[];
  ac.topics.forEach(t=>{
    t.lessons.forEach(l=>{if(!S.completedLessons[lessonKey(ac.id,t.id,l.id)])units.push({type:'lesson',t,l,hrs:(l.minutes||18)/60+0.25,label:'Lesson: '+l.title,link:'#lesson/'+ac.id+'/'+t.id+'/'+l.id});});
    const b=S.quizBest[ac.id+'/'+t.id];
    if(t.quiz.length&&(!b||b.pct<75))units.push({type:'quiz',t,hrs:0.5,label:'Quiz: '+t.name+(b?' (retake — best '+b.pct+'%)':''),link:'#quiz/'+ac.id+'/'+t.id});
  });

  const weeks=[];let ui=0;
  for(let w=0;w<nWeeks;w++){
    const wk={n:w+1,start:addDays(start,w*7),tasks:[],type:'study',cap:S.planner.hoursPerWeek||7};
    if(vac.includes(w+1)){wk.type='vacation';wk.cap=0;}
    else if(busy.includes(w+1)){wk.type='busy';wk.cap=wk.cap/2;}
    const isReview=w>=nWeeks-reserve;
    if(wk.cap>0){
      if(isReview){
        wk.type=wk.type==='study'?'review':wk.type;
        const ri=nWeeks-w;
        if(ri===1){wk.tasks.push({label:'Taper week: flashcards + lesson summaries only',hrs:1.5,link:'#flashcards'},{label:'Final calculation pass (battery, voltage drop, spacing)',hrs:1,link:'#cert/'+ac.id},{label:'Verify exam logistics (admission, ID, reference policy)',hrs:0.5,link:'#cert/'+ac.id});}
        else{wk.tasks.push({label:'Timed practice exam '+(reserve-ri+1),hrs:1.5,link:'#exam/'+ac.id},{label:'Review every miss back to its lesson',hrs:1.5,link:'#cert/'+ac.id},{label:'Re-drill weakest topic quizzes to 85%+',hrs:1.5,link:'#cert/'+ac.id},{label:'Code navigation drill — 10 lookups under 60s each',hrs:0.5,link:'#cert/'+ac.id});}
      }else{
        let used=0;
        while(ui<units.length&&used+units[ui].hrs<=wk.cap-0.5){wk.tasks.push({label:units[ui].label,hrs:units[ui].hrs,link:units[ui].link,unit:units[ui]});used+=units[ui].hrs;ui++;}
        wk.tasks.push({label:'Flashcard + weak-topic review session',hrs:0.5,link:'#flashcards'});
      }
    }
    weeks.push(wk);
  }
  const overflow=ui<units.length;
  const milestones=[];
  const seen={};
  weeks.forEach(wk=>wk.tasks.forEach(tk=>{if(tk.unit&&tk.unit.type==='quiz'&&!seen[tk.unit.t.id]){seen[tk.unit.t.id]=1;milestones.push({label:tk.unit.t.name+' mastered',date:addDays(wk.start,6)});}}));
  weeks.forEach(wk=>{if(wk.type==='review'&&wk.tasks[0]&&wk.tasks[0].label.startsWith('Timed practice'))milestones.push({label:wk.tasks[0].label,date:addDays(wk.start,5)});});
  milestones.push({label:'EXAM DAY — '+activeCert().short,date:exam});
  const cw=clamp(Math.floor((now-start)/(7*864e5))+1,1,nWeeks);
  return{weeks,milestones:milestones.sort((a,b)=>a.date-b.date).filter(m=>m.date>=now),currentWeek:cw,overflow,exam};
}
function todaysTasks(plan){
  const ac=activeCert();
  if(!plan){const out=[];const nl=nextLesson(ac.id);if(nl)out.push({html:'<a href="#lesson/'+ac.id+'/'+nl.topic.id+'/'+nl.lesson.id+'">Next lesson: '+esc(nl.lesson.title)+'</a> <span class="muted small">('+nl.lesson.minutes+' min)</span>'});
    for(const t of ac.topics){const done=topicProgress(ac.id,t);const b=S.quizBest[ac.id+'/'+t.id];if(done.total&&done.done===done.total&&(!b||b.pct<75)){out.push({html:'<a href="#quiz/'+ac.id+'/'+t.id+'">Take the '+esc(t.name)+' quiz</a>'});break;}}
    if(out.length)out.push({html:'<a href="#flashcards">10 flashcards</a> to warm up before you start'});
    return out;}
  const wk=plan.weeks[plan.currentWeek-1];if(!wk||!wk.tasks.length)return[{html:'Vacation week — rest is part of the plan. Optional: <a href="#flashcards">5 flashcards</a> to keep the streak.'}];
  const days=(S.planner.days&&S.planner.days.length)?S.planner.days:[1,2,3,4,6];
  const today=new Date().getDay();
  if(!days.includes(today))return[{html:'Rest day per your plan. Optional: <a href="#flashcards">flashcards</a> or review yesterday’s summary to keep the streak alive.'}];
  const di=days.indexOf(today);const per=Math.ceil(wk.tasks.length/days.length);
  const slice=wk.tasks.slice(di*per,di*per+per);
  return (slice.length?slice:wk.tasks.slice(0,1)).map(t=>({html:'<a href="'+t.link+'">'+esc(t.label)+'</a> <span class="muted small">(~'+(Math.round(t.hrs*60))+' min)</span>'}));
}

function vPlanner(){
  const p=S.planner;const plan=buildPlan();
  const dayNames=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const dayBtns=dayNames.map((d,i)=>'<button class="'+((p.days||[]).includes(i)?'on':'')+'" onclick="togglePlanDay('+i+')">'+d+'</button>').join('');
  let planHtml='';
  if(plan){
    planHtml=plan.weeks.map(wk=>{
      const badge=wk.type==='vacation'?'<span class="badge">🏖 vacation</span>':wk.type==='busy'?'<span class="badge warn">busy — half load</span>':wk.type==='review'?'<span class="badge blue">review phase</span>':'';
      const cur=wk.n===plan.currentWeek?' style="border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)"':'';
      return '<div class="week-block"'+cur+'><div class="week-head"><b>Week '+wk.n+'</b><span class="muted small">'+fmtDateShort(wk.start)+' – '+fmtDateShort(addDays(wk.start,6))+'</span>'+badge+(wk.n===plan.currentWeek?'<span class="badge good">this week</span>':'')+'<span class="muted small" style="margin-left:auto">~'+wk.tasks.reduce((a,t)=>a+t.hrs,0).toFixed(1)+' h</span></div>'
      +(wk.tasks.length?'<div class="week-tasks">'+wk.tasks.map(t=>'<div class="check-row"><div style="width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px;flex-shrink:0"></div><div><a href="'+t.link+'">'+esc(t.label)+'</a> <span class="muted small">~'+Math.round(t.hrs*60)+' min</span></div></div>').join('')+'</div>':'<div class="week-tasks muted small" style="padding:12px 18px">No study scheduled.</div>');
    }).join('');
    if(plan.overflow)planHtml='<div class="callout warn mb"><div class="co-head">Plan overloaded</div>At '+p.hoursPerWeek+' h/week the curriculum does not fit before your exam date. Increase weekly hours, reduce vacation weeks, or move the exam date — the gates matter more than the date.</div>'+planHtml;
  }else{
    planHtml='<div class="empty">Set an exam date above and the planner will generate weekly tasks, review sessions, practice exam dates, and revision weeks automatically.</div>';
  }
  $('#view').innerHTML='<h1 class="mb">Study Planner</h1>'
  +'<div class="card mb"><div class="grid grid-3">'
  +'<div class="field"><label>Exam date — '+esc(activeCert().short)+'</label><input type="date" value="'+esc(p.examDate)+'" onchange="S.planner.examDate=this.value;S.certDates[activeCert().id]=this.value;render()"></div>'
  +'<div class="field"><label>Hours per week</label><input type="number" min="2" max="30" value="'+p.hoursPerWeek+'" onchange="S.planner.hoursPerWeek=parseFloat(this.value)||7;render()"></div>'
  +'<div class="field"><label>Study days</label><div class="day-picks">'+dayBtns+'</div></div>'
  +'<div class="field"><label>Vacation weeks (numbers, comma-sep)</label><input placeholder="e.g., 6, 11" value="'+esc(p.vacations)+'" onchange="S.planner.vacations=this.value;render()"></div>'
  +'<div class="field"><label>Busy weeks — half load</label><input placeholder="e.g., 4, 9" value="'+esc(p.busy)+'" onchange="S.planner.busy=this.value;render()"></div>'
  +'<div class="field"><label>&nbsp;</label><button class="btn btn-primary" onclick="render()">Regenerate plan</button></div>'
  +'</div><p class="small muted">The plan schedules every remaining lesson and quiz, reserves the final weeks for timed practice exams and revision, respects vacation and busy weeks, and rebuilds itself as you complete work.</p></div>'

/* ---------- Quiz runner (topic quizzes + practice exams) ---------- */
let QZ=null;
function vQuiz(cid,tid){
  const c=CERT(cid);const t=c.topics.find(x=>x.id===tid);
  if(!QZ||QZ.key!==cid+'/'+tid||QZ.mode!=='topic'){QZ={key:cid+'/'+tid,mode:'topic',qs:t.quiz,i:0,answers:{},started:false,finished:false};}
  renderQuiz(c,t);
}
function vExam(cid){
  const c=CERT(cid);
  if(!QZ||QZ.mode!=='exam'||QZ.key!==cid){
    const pool=[];c.topics.forEach(t=>t.quiz.forEach(q=>pool.push({...q,topicName:t.name,topicId:t.id})));
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    const qs=pool.slice(0,Math.min(25,pool.length));
    QZ={key:cid,mode:'exam',qs,i:0,answers:{},started:false,finished:false,secs:Math.round(qs.length*78),timer:null};
  }
  renderQuiz(c,null);
}
function renderQuiz(c,t){
  const title=QZ.mode==='exam'?'Timed practice exam — '+c.short:'Quiz — '+t.name;
  if(!QZ.started){
    $('#view').innerHTML='<div class="lesson-shell"><div class="crumbs"><a href="#cert/'+c.id+'">'+esc(c.short)+'</a> › '+esc(title)+'</div>'
    +'<div class="card pad-lg" style="text-align:center"><h1>'+esc(title)+'</h1><p class="muted mt">'+QZ.qs.length+' questions'+(QZ.mode==='exam'?' · '+Math.round(QZ.secs/60)+' minutes · ~78 seconds per question, exactly like the real exam pace':' · untimed · every answer fully explained')+'</p>'
    +'<p class="small muted mt">Question types: multiple choice, true/false, scenarios, calculations, code lookup, troubleshooting.</p>'
    +'<button class="btn btn-primary mt" onclick="QZ.started=true;'+(QZ.mode==='exam'?'startExamTimer();':'')+'render()">'+IC.play+' Begin</button></div></div>';
    return;
  }
  if(QZ.finished){renderQuizResults(c,t);return;}
  const q=QZ.qs[QZ.i];const answered=QZ.answers[QZ.i];
  const typeNames={mc:'Multiple choice',tf:'True / False',scenario:'Scenario',calc:'Calculation',code:'Code lookup',trouble:'Troubleshooting'};
  $('#view').innerHTML='<div class="lesson-shell">'
  +'<div class="quiz-progress"><div style="flex:1">'+pbar((QZ.i)/QZ.qs.length*100)+'</div><span class="small muted">'+(QZ.i+1)+' / '+QZ.qs.length+'</span>'+(QZ.mode==='exam'?'<span class="badge '+(QZ.secs<120?'warn':'')+'" id="examClock">'+fmtClock(QZ.secs)+'</span>':'')+'</div>'
  +'<div class="q-card"><div class="q-type"><span>'+(typeNames[q.type]||'Question')+(q.topicName?' · '+esc(q.topicName):'')+'</span></div><div class="q-text">'+esc(q.q)+'</div>'
  +q.opts.map((o,oi)=>{let cls='q-opt';
    if(QZ.mode==='topic'&&answered!=null){if(oi===q.a)cls+=' correct';else if(oi===answered)cls+=' wrong';}
    else if(answered===oi)cls+=' sel';
    return '<button class="'+cls+'" '+(QZ.mode==='topic'&&answered!=null?'disabled':'')+' onclick="answerQ('+oi+')"><span class="q-letter">'+String.fromCharCode(65+oi)+'</span><span>'+esc(o)+'</span></button>';}).join('')
  +(QZ.mode==='topic'&&answered!=null?'<div class="q-why">'+q.why.map((w,wi)=>'<div class="why-row"><b class="'+(wi===q.a?'ok':'no')+'">'+String.fromCharCode(65+wi)+(wi===q.a?' ✓ correct':' ✗')+'</b> — '+esc(w)+'</div>').join('')+'</div>'+(q.ref?'<div class="q-ref">Reference: '+esc(q.ref)+'</div>':''):'')
  +'</div>'
  +'<div class="row spread"><button class="btn btn-ghost" '+(QZ.i===0?'disabled':'')+' onclick="QZ.i--;render()">'+IC.arrowL+' Back</button>'
  +(QZ.i<QZ.qs.length-1?'<button class="btn btn-primary" '+(answered==null?'disabled':'')+' onclick="QZ.i++;render()">Next '+IC.arrowR+'</button>':'<button class="btn btn-primary" '+(answered==null?'disabled':'')+' onclick="finishQuiz()">Finish '+IC.check+'</button>')+'</div></div>';
}
function fmtClock(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function startExamTimer(){clearInterval(QZ.timer);QZ.timer=setInterval(()=>{QZ.secs--;const el=$('#examClock');if(el)el.textContent=fmtClock(QZ.secs);if(QZ.secs<=0){finishQuiz();}},1000);}
function answerQ(oi){if(QZ.mode==='topic'&&QZ.answers[QZ.i]!=null)return;QZ.answers[QZ.i]=oi;render();}
function finishQuiz(){clearInterval(QZ.timer);QZ.finished=true;
  const right=QZ.qs.filter((q,i)=>QZ.answers[i]===q.a).length;
  const pct=Math.round(right/QZ.qs.length*100);
  if(QZ.mode==='topic'){const prev=S.quizBest[QZ.key];if(!prev||pct>prev.pct)S.quizBest[QZ.key]={pct,right,total:QZ.qs.length,date:todayStr()};S.quizHistory.push({key:QZ.key,pct,date:todayStr()});markActivity(QZ.qs.length*2);}
  else{S.practiceExams.push({cert:QZ.key,pct,n:QZ.qs.length,date:todayStr()});markActivity(30);}
  render();
}
function renderQuizResults(c,t){
  const right=QZ.qs.filter((q,i)=>QZ.answers[i]===q.a).length;const pct=Math.round(right/QZ.qs.length*100);
  const grade=pct>=85?['Excellent — mastery level','var(--good-text)']:pct>=75?['Solid pass — meets the gate','var(--accent-ink)']:pct>=60?['Getting there — review the misses below','var(--serious)']:['Re-study this topic before retaking','var(--crit)'];
  const review=QZ.qs.map((q,i)=>{const ok=QZ.answers[i]===q.a;
    return '<div class="q-card"><div class="q-type"><span>'+(ok?'✓ Correct':'✗ Missed')+(q.topicName?' · '+esc(q.topicName):'')+'</span></div><div class="q-text">'+esc(q.q)+'</div>'
    +'<div class="q-why">'+q.why.map((w,wi)=>'<div class="why-row"><b class="'+(wi===q.a?'ok':'no')+'">'+String.fromCharCode(65+wi)+(wi===q.a?' ✓':(QZ.answers[i]===wi?' ✗ your answer':' ✗'))+'</b> — '+esc(w)+'</div>').join('')+'</div>'+(q.ref?'<div class="q-ref">Reference: '+esc(q.ref)+'</div>':'')+'</div>';}).join('');
  $('#view').innerHTML='<div class="lesson-shell">'
  +'<div class="card result-hero mb"><div class="rh-score" style="color:'+grade[1]+'">'+pct+'%</div><p><b>'+right+' of '+QZ.qs.length+'</b> — '+grade[0]+'</p>'
  +'<div class="row mt" style="justify-content:center"><button class="btn btn-primary" onclick="QZ=null;'+(QZ.mode==='exam'?'go(\'#exam/'+c.id+'\')':'go(\'#quiz/'+c.id+'/'+(t?t.id:'')+'\')')+'">Retake</button><button class="btn btn-ghost" onclick="QZ=null;go(\'#cert/'+c.id+'\')">Back to module</button></div></div>'
  +'<h2 class="mb">Answer review — why each option is right or wrong</h2>'+review+'</div>';
}

function flashDeck(){const c=CERT('nicet1');const deck=[];c.topics.forEach(t=>{if(FC.topic!=='all'&&FC.topic!==t.id)return;t.lessons.forEach(l=>l.terms.forEach(x=>deck.push({term:x[0],def:x[1],topic:t.name})));});return deck;}
