<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Adeel's Certification Academy</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --surface2:#f3f2ef;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-soft:#e4eefb; --accent-ink:#1c5cab;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 16px rgba(11,11,11,.05);
  --shadow-lg:0 4px 12px rgba(11,11,11,.08),0 12px 40px rgba(11,11,11,.10);
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --surface:#1a1a19; --surface2:#232322;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:#12233a; --accent-ink:#86b6ef;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good:#0ca30c; --good-text:#0ca30c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --surface2:#232322;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --line:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --accent-soft:#12233a; --accent-ink:#86b6ef;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good:#0ca30c; --good-text:#0ca30c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
a{color:var(--accent-ink);text-decoration:none}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:650;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:650}
::selection{background:var(--accent-soft)}

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
  padding:18px 12px;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--s1),var(--accent-ink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.brand-name{font-weight:700;font-size:.95rem;line-height:1.25}
.brand-sub{font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.nav-section{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500;font-size:.9rem;
  transition:background .15s,color .15s;margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nav-item .nv-badge{margin-left:auto;font-size:.68rem;font-weight:700;background:var(--surface2);color:var(--muted);border-radius:20px;padding:1px 8px}
.nav-item.active .nv-badge{background:var(--accent);color:#fff}
.nav-cert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sidebar-foot{margin-top:auto;padding:10px;font-size:.72rem;color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 26px;
}
.hamburger{display:none;padding:6px}
.searchbox{position:relative;flex:1;max-width:430px}
.searchbox input{width:100%;padding:8px 12px 8px 36px;border-radius:22px;background:var(--surface)}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.top-stat{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--ink2);padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--border);white-space:nowrap}
.top-stat svg{width:15px;height:15px}
.streak-flame{color:var(--s2)}
.icon-btn{padding:8px;border-radius:10px;color:var(--ink2);display:flex;transition:background .15s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:18px;height:18px}
.content{padding:26px;max-width:1180px;width:100%;margin:0 auto}

/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.pad-lg{padding:26px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-title h2{display:flex;align-items:center;gap:9px}
.card-title h2 svg{width:18px;height:18px;color:var(--muted)}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-main{grid-template-columns:2fr 1fr}
@media(max-width:1020px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.grid-main{grid-template-columns:1fr}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.stat-tile .st-label{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat-tile .st-label svg{width:14px;height:14px}
.stat-tile .st-value{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.stat-tile .st-sub{font-size:.8rem;color:var(--ink2);margin-top:2px}
.st-delta{font-size:.78rem;font-weight:600;color:var(--good-text)}

.pbar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.pbar>div{height:100%;border-radius:6px;background:var(--accent);transition:width .5s ease}
.pbar.thin{height:5px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:650;padding:2px 10px;border-radius:20px;background:var(--surface2);color:var(--ink2)}
.badge.blue{background:var(--accent-soft);color:var(--accent-ink)}
.badge.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good-text)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--ink)}
.badge.outline{background:transparent;border:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:.88rem;padding:9px 18px;border-radius:10px;transition:all .15s;border:1px solid transparent}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface2)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-soft:hover{filter:brightness(.96)}
.btn-sm{padding:5px 12px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-wrap .ring-txt{position:absolute;text-align:center}
.ring-txt b{font-size:1.35rem;font-weight:700;display:block;line-height:1.1}
.ring-txt span{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
.check-row:last-child{border-bottom:none}
.checkbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;margin-top:2px}
.checkbox.on{background:var(--good);border-color:var(--good)}
.checkbox.on svg{color:#fff;width:12px;height:12px}
.check-row.done .ck-label{text-decoration:line-through;color:var(--muted)}

table.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
table.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td:first-child{font-weight:600}
.tbl-num{font-variant-numeric:tabular-nums}

/* Timeline */
.timeline{display:flex;gap:0;overflow-x:auto;padding:8px 0 4px}
.tl-item{flex:1;min-width:150px;position:relative;padding:0 8px}
.tl-track{height:4px;background:var(--surface2);border-radius:3px;position:relative;margin-bottom:12px}
.tl-track>div{position:absolute;inset:0;border-radius:3px}
.tl-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);position:absolute;top:-5px;left:0;box-shadow:0 0 0 1px var(--border)}
.tl-name{font-weight:650;font-size:.84rem;line-height:1.3}
.tl-date{font-size:.75rem;color:var(--muted);margin-top:2px}
.tl-status{font-size:.7rem;font-weight:700;margin-top:5px}

/* Module / lesson lists */
.topic-card{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:14px;box-shadow:var(--shadow)}
.topic-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;transition:background .15s}
.topic-head:hover{background:var(--surface2)}
.topic-num{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.92rem;flex-shrink:0}
.topic-meta{flex:1;min-width:0}
.topic-meta h3{margin-bottom:2px}
.topic-meta .tm-sub{font-size:.78rem;color:var(--muted)}
.topic-body{border-top:1px solid var(--grid);display:none}
.topic-card.open .topic-body{display:block}
.topic-card.open .chev{transform:rotate(180deg)}
.chev{transition:transform .2s;color:var(--muted);flex-shrink:0}
.lesson-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--grid);cursor:pointer;transition:background .12s}
.lesson-row:hover{background:var(--surface2)}
.lesson-row:last-child{border-bottom:none}
.lr-state{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);color:transparent}
.lr-state.done{background:var(--good);border-color:var(--good);color:#fff}
.lr-state svg{width:13px;height:13px}
.lr-title{flex:1;font-weight:550;font-size:.9rem}
.lr-min{font-size:.75rem;color:var(--muted);white-space:nowrap}
.bk-btn{color:var(--muted);padding:4px;border-radius:6px}
.bk-btn:hover{background:var(--surface2)}
.bk-btn.on{color:var(--s4)}
.bk-btn svg{width:16px;height:16px}

/* Lesson view */
.lesson-shell{max-width:820px;margin:0 auto}
.crumbs{font-size:.8rem;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--accent-ink)}
.lesson-sec{margin:26px 0}
.sec-tag{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);padding:3px 12px;border-radius:20px;margin-bottom:10px}
.lesson-sec p{margin:10px 0;color:var(--ink);}
.lesson-sec ul,.lesson-sec ol{margin:10px 0 10px 22px}
.lesson-sec li{margin:5px 0}
.lesson-sec strong{font-weight:650}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:13px 16px;margin:14px 0;font-size:.92rem}
.callout.site{border-color:var(--s2);background:color-mix(in srgb,var(--s2) 9%,var(--surface))}
.callout.warn{border-color:var(--serious);background:color-mix(in srgb,var(--serious) 10%,var(--surface))}
.callout .co-head{font-weight:700;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:6px;align-items:center;margin-bottom:5px}
.diagram{background:var(--surface2);border:1px solid var(--grid);border-radius:var(--r);padding:18px;margin:14px 0;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}
.diagram .dg-cap{text-align:center;font-size:.78rem;color:var(--muted);margin-top:10px}
.term-grid{display:grid;grid-template-columns:1fr;gap:8px}
.term{background:var(--surface2);border-radius:var(--r-sm);padding:10px 14px;font-size:.88rem}
.term b{color:var(--accent-ink)}
.kv-table td:first-child{color:var(--ink2);width:40%}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin:34px 0 10px;flex-wrap:wrap}
.complete-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-top:30px;box-shadow:var(--shadow)}

/* Quiz */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.q-type{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px}
.q-text{font-weight:600;font-size:.97rem;margin-bottom:14px}
.q-opt{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;transition:all .13s;font-size:.9rem;width:100%;text-align:left}
.q-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.q-opt .q-letter{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;color:var(--ink2)}
.q-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.q-opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.q-opt.correct .q-letter{background:var(--good);color:#fff}
.q-opt.wrong{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,var(--surface))}
.q-opt.wrong .q-letter{background:var(--crit);color:#fff}
.q-opt:disabled{cursor:default}
.q-why{border-radius:var(--r-sm);padding:12px 15px;margin-top:10px;font-size:.87rem;background:var(--surface2)}
.q-why .why-row{padding:6px 0;border-bottom:1px solid var(--grid)}
.q-why .why-row:last-child{border-bottom:none}
.q-why b.ok{color:var(--good-text)}
.q-why b.no{color:var(--crit)}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.q-ref{font-size:.76rem;color:var(--muted);margin-top:8px;font-style:italic}

/* Flashcards */
.flash-stage{perspective:1200px;max-width:560px;margin:22px auto}
.flash-card{position:relative;width:100%;min-height:280px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flash-card.flip{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;text-align:center}
.flash-face.back{transform:rotateY(180deg)}
.flash-face .ff-tag{position:absolute;top:16px;left:20px;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.flash-term{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.flash-def{font-size:.98rem;color:var(--ink);line-height:1.65}
.flash-controls{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}

/* Planner */
.week-block{border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:var(--surface)}
.week-head{display:flex;align-items:center;gap:12px;padding:13px 18px;background:var(--surface2);font-weight:600;font-size:.88rem;flex-wrap:wrap}
.week-tasks{padding:8px 18px}
.milestone{border-left:3px solid var(--s4);padding:2px 0 2px 12px;margin:10px 0;font-size:.88rem}

/* Coach */
.coach-msg{display:flex;gap:14px;margin-bottom:16px}
.coach-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--s3),var(--s1));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-weight:800;font-size:.85rem}
.coach-bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:14px 18px;box-shadow:var(--shadow);font-size:.92rem;flex:1}
.coach-bubble h3{margin-bottom:6px}

/* Heat strip */
.heat-strip{display:grid;grid-template-columns:repeat(26,1fr);gap:3px}
.heat-cell{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.heat-legend{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);margin-top:8px;justify-content:flex-end}
.heat-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Bar chart */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:10px;font-size:.82rem}
.bar-row .br-label{color:var(--ink2);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .br-track{height:14px;background:var(--surface2);border-radius:4px;position:relative}
.bar-row .br-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);min-width:2px}
.bar-row .br-val{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right;font-weight:600}

/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-scrim.open{display:flex}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px}
.modal h2{margin-bottom:14px}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:12px;font-size:.88rem;font-weight:600;opacity:0;transition:all .3s;z-index:200;box-shadow:var(--shadow-lg);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Misc */
.muted{color:var(--muted)}.small{font-size:.8rem}.mt{margin-top:14px}.mb{margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.pill-tabs{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.pill-tabs button{padding:6px 15px;border-radius:9px;font-size:.83rem;font-weight:600;color:var(--ink2)}
.pill-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:.9rem}
.diff-dots{display:inline-flex;gap:3px}
.diff-dots i{width:8px;height:8px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.diff-dots i.on{background:var(--s2);border-color:var(--s2)}
.note-area{width:100%;min-height:110px;resize:vertical;line-height:1.55}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:650;margin-bottom:5px;color:var(--ink2)}
.day-picks{display:flex;gap:6px;flex-wrap:wrap}
.day-picks button{width:42px;height:34px;border-radius:9px;border:1.5px solid var(--line);font-size:.78rem;font-weight:650;color:var(--ink2)}
.day-picks button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.conf-slider{width:100%}
.result-hero{text-align:center;padding:26px}
.result-hero .rh-score{font-size:3rem;font-weight:800;letter-spacing:-.03em}
kbd{background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:.78rem;font-family:inherit}

/* ============ MOBILE ============ */
.bottomnav{display:none}
@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;transition:left .25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{left:0}
  .hamburger{display:flex}
  .content{padding:18px 14px 100px}
  .topbar{padding:8px 10px;gap:8px}
  .top-stat.hide-sm{display:none}
  .bar-row{grid-template-columns:96px 1fr 42px}
  .heat-strip{grid-template-columns:repeat(13,1fr)}
  .bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:60;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:650;color:var(--muted);padding:5px 2px;border-radius:10px;-webkit-tap-highlight-color:transparent}
  .bottomnav button svg{width:20px;height:20px}
  .bottomnav button.on{color:var(--accent-ink)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:640px){
  body{font-size:14.5px}
  h1{font-size:1.3rem}
  h2{font-size:1.08rem}
  .stat-tile .st-value{font-size:1.55rem}
  .content{padding:14px 12px 100px}
  .card{padding:16px}.card.pad-lg{padding:18px}
  .grid{gap:12px}
  .searchbox input{padding:8px 10px 8px 34px;font-size:.85rem}
  #timerBtn:not(.running) span{display:none}
  #timerBtn{padding:9px 12px}
  table.tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .lesson-nav{flex-direction:column}
  .lesson-nav .btn{width:100%;justify-content:center;white-space:normal;text-align:center}
  .complete-bar{flex-wrap:wrap}
  .topic-head{padding:13px 14px;gap:10px}
  .lesson-row{padding:11px 14px;gap:9px}
  .topic-head>div[style*="width:90px"]{display:none}
  .flash-term{font-size:1.2rem}
  .flash-card{min-height:240px}
  .q-opt{padding:11px 12px}
  .modal{padding:18px}
  .pill-tabs button{padding:6px 11px;font-size:.78rem}
  .timeline .tl-item{min-width:128px}
}
@media print{.sidebar,.topbar,.bottomnav{display:none}}

DATA.certs.push({
  id:'nicet1', name:'NICET Fire Alarm Systems — Level I', short:'NICET I',

  requirements:[
    ['Exam','Pass the Level I exam — 85 questions, 110 minutes, computer-based at Pearson VUE (Level I can also be taken online with remote proctoring)'],
    ['Experience','Minimum 6 months of fire detection & signaling systems experience (your ERT commissioning work counts — document it)'],

    ['Fee','$230 exam fee (verify current fee at nicet.org)'],

  eligibility:`You already meet the experience bar: your fire alarm commissioning, FACP testing, LHD and VESDA work on the ERT project is exactly the "fire detection and signaling systems" experience NICET wants. Ask your supervisor early about verifying performance measures — paperwork, not knowledge, is what delays most candidates.`,
  examBreakdown:{
    format:[['Questions','85'],['Time','110 minutes (~78 seconds/question)'],['Delivery','CBT at Pearson VUE, or online (OnVUE) for Level I'],['Calculator','Built into the exam interface'],['Code basis','2022 edition of NFPA 72 (2025-edition exams expected ~mid-2027)'],['References','Check your exam notice for the current reference policy before test day']],
    areas:[
      ['Basic electricity & electronics','Ohm’s law, series/parallel, power, meters, conductors'],
      ['Fire alarm system & device types','Initiating devices, notification appliances, FACP, circuit types'],
      ['Codes & standards','Finding and applying NFPA 72 and NFPA 70 (Art. 760) requirements'],
      ['Installation & wiring methods','Mounting, cabling, supervision, workmanship'],
      ['Testing, inspection & documentation','Acceptance testing, periodic ITM, records'],
      ['Safety','Job-site and electrical safety practice'],
    ],
    note:'Area weightings vary by exam form — download the official Level I content outline from nicet.org and check each box against these modules.'
  },
  books:[
    ['NFPA 72 (2022), National Fire Alarm and Signaling Code','THE reference. Buy the handbook edition if you can — the commentary teaches the "why".'],
    ['NFPA 70 (NEC), Article 760','Fire alarm circuit wiring rules — power-limited vs non-power-limited.'],
    ['NTC Brown Book (Fire Alarm Certification Study Guide)','The classic NICET prep book, organized by level.'],
    ['Manufacturer literature','FACP, VESDA and LHD manuals you already use on site are legitimate study material.'],

  refs:['NFPA 72-2022','NFPA 70-2023 Art. 760','NICET Level I content outline (nicet.org)','NFPA 170 (symbols)'],
  weeklySchedule:`With ~7 hrs/week: 2 lessons on weeknights (40 min each), a 1-hr weekend review with flashcards, 1 topic quiz, plus 30 min of pure NFPA 72 navigation drills. Protect the drills — code lookup speed is a trainable skill and a huge exam advantage.`,
  mistakes:[
    'Memorizing answers instead of learning where requirements live in NFPA 72 — the exam rewards navigation and understanding.',
    'Ignoring basic electricity because "I’m not an electrician" — Ohm’s law and battery calcs are guaranteed points.',
    'Confusing trouble vs. supervisory vs. alarm signals (a classic exam trap and a real field mistake).',
    'Skipping the performance-measure paperwork until after the exam — start supervisor verification now.',
    'Studying only smoke detection and neglecting notification, power, and ITM chapters.',
  ],
  strategy:[
    'Pace: 85 questions in 110 min. First pass, answer everything you know cold; flag calculation and lookup questions for pass two.',
    'For code questions, learn the chapter map of NFPA 72 (Module 9) so you can locate any requirement in under 60 seconds.',
    'For calculations, write the formula before touching the on-screen calculator — most errors are setup errors, not math errors.',

    'SCADA integration: supervising station concepts (Module 1) frame how tunnel alarms report upstream.',
    'Punch lists: Modules 7–8 turn "the inspector flagged it" into "I can cite why".',
  ],
  careerValue:`NICET I is the credential gate for fire alarm work on most public infrastructure specs. It converts your on-the-job knowledge into a portable, recognized qualification, and it is the mandatory first step to NICET II — which many specs require for lead technicians and which strengthens your owner-side commissioning authority when you challenge contractor test results.`,
  salary:`Fire alarm technicians with NICET I typically earn about $55–75k in the NYC market; the bigger effect for you is credibility and eligibility — it protects your seat on certified commissioning scopes and sets up NICET II, where pay and lead roles move meaningfully (verify current figures for your market).`,

  mistakes:['Underestimating it because Level I felt manageable — the time pressure is real at 110 questions.','Weak spacing/placement geometry — draw the ceiling every time.','Not practicing battery calculations to full fluency.','Letting experience documentation lag behind exam readiness.'],

t1.lessons.push({
id:'l1',title:'What a Fire Alarm System Really Is',minutes:18,
objectives:['Explain the detect → decide → notify → control chain','Describe the four stages of fire development','State the two missions: life safety and property protection','Map each function to equipment you commission on the ERT project'],
simple:`<p>Strip away every panel, wire, and code section and a fire alarm system is a <strong>nervous system for a building</strong>. It has senses (detectors), a brain (the control panel), a voice (horns, strobes, speakers), and reflexes (shutting dampers, recalling elevators, starting fans). Its one job: <strong>turn a fire that nobody has noticed into a fire that everybody — occupants, responders, and other building systems — is reacting to, as early as possible.</strong></p>
<p>Why does it exist? Because fire grows exponentially, not linearly. A wastebasket fire can flash over a room in 3–5 minutes. Humans are terrible early detectors — asleep, absent, or assuming someone else called it in. The system exists to beat the growth curve.</p>`,
technical:`<p>NFPA 72 defines a <strong>fire alarm system</strong> as a system or portion of a combination system that consists of components and circuits arranged to monitor and annunciate the status of fire alarm or supervisory signal-initiating devices and to initiate the appropriate response to those signals.</p>
<p>Decompose that into the four functional blocks every question on the exam ultimately touches:</p>
<ul>
<li><strong>Initiation</strong> — devices that detect fire signatures (smoke, heat, flame, gas) or human action (pull stations) or system status (waterflow, valve tamper). Covered by NFPA 72 Chapter 17.</li>
<li><strong>Processing</strong> — the fire alarm control unit (FACU/FACP) receives signals, applies logic, decides what they mean, and drives outputs. Chapters 10 and 23.</li>
<li><strong>Notification</strong> — audible and visible appliances that tell occupants to act. Chapter 18.</li>
<li><strong>Emergency control</strong> — interfaces that make other systems react: elevator recall, HVAC shutdown, damper closure, door release, fan starts. Chapter 21.</li>
</ul>
<p>Fire itself develops in four stages: <strong>incipient</strong> (invisible products of combustion, no visible smoke — where aspirating systems like VESDA live), <strong>smoldering</strong> (visible smoke, little heat — photoelectric territory), <strong>flame</strong> (open burning — ionization and flame detectors), and <strong>high heat</strong> (fully developed — heat detectors and sprinklers). Every detection technology is a bet on which stage you need to catch, traded against cost and false-alarm risk.</p>`,
diagram:{svg:`<svg viewBox="0 0 640 180" width="640" height="180" font-family="system-ui" font-size="12">
<defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

<rect x="175" y="55" width="130" height="56" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="240" y="78" fill="var(--ink)" font-weight="600">PROCESSING</text><text x="240" y="96" fill="var(--ink2)" font-size="10">FACP logic + power</text>
<rect x="340" y="12" width="130" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="405" y="33" fill="var(--ink)" font-weight="600">NOTIFICATION</text><text x="405" y="50" fill="var(--ink2)" font-size="10">horns · strobes · voice</text>
<rect x="340" y="104" width="130" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="405" y="125" fill="var(--ink)" font-weight="600">EMERG. CONTROL</text><text x="405" y="142" fill="var(--ink2)" font-size="10">fans · dampers · elevators</text>
<rect x="505" y="55" width="125" height="56" rx="10" fill="none" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="567" y="78" fill="var(--ink)" font-weight="600">SUPERVISING</text><text x="567" y="96" fill="var(--ink2)" font-size="10">station / SCADA</text>
</g>
<g stroke="var(--muted)" stroke-width="1.6" fill="none">
<path d="M140 83 H173" marker-end="url(#ar1)"/><path d="M305 76 L338 42" marker-end="url(#ar1)"/><path d="M305 92 L338 126" marker-end="url(#ar1)"/><path d="M240 55 V30 H503 v0" stroke-dasharray="4 3" marker-end="url(#ar1)" transform="translate(0,0)"/>
</g></svg>`,cap:'The signal chain: every fire alarm concept on the exam lives in one of these blocks.'},
field:{
construction:'On any construction site, temporary fire watch and phased system activation exist because this chain is broken during construction — detection may be in, but notification zones or emergency control functions are not yet commissioned.',
commissioning:'Your SAT scripts are organized around this chain: verify each initiating device signals the FACP, the FACP processes it correctly (right zone, right event type), the right outputs fire, and the supervising path reports it. If a test step ever feels arbitrary, place it in this chain and its purpose appears.',
amtrak:'In the East River Tunnels the "occupants" include train passengers, crews, and maintenance workers with long egress paths, and "emergency control" means big things: tunnel ventilation fans driving smoke management, and alarms propagating to dispatch via SCADA. Same four blocks — higher stakes, which is why rail tunnels layer NFPA 130 on top of NFPA 72.',
fire:'A FACP in alarm from an LHD zone that also starts fan sequences is running the entire chain in one event — detection (LHD), processing (FACP cause-and-effect), notification (tunnel signals), emergency control (ventilation), transmission (SCADA to dispatch).'},
terms:[['Fire alarm system','Arrangement of components and circuits that monitors initiating devices and initiates responses to their signals'],['Initiating device','A component that originates an alarm, supervisory, or trouble input to the system (detector, pull station, waterflow switch)'],['FACU / FACP','Fire Alarm Control Unit (code term) / Fire Alarm Control Panel (field term) — the processing brain'],['Notification appliance','Device that alerts occupants — horn, strobe, speaker, chime'],['Emergency control function','An action another building system takes because the fire alarm told it to (fan start, damper close, elevator recall)'],['Incipient stage','Earliest fire stage — invisible combustion products, detectable by aspirating (air-sampling) detection']],
memory:['The chain: "Sense it, Think it, Say it, Do it" — Initiation, Processing, Notification, Control.','Fire stages I-S-F-H: "I Smell Fires Heating" — Incipient, Smoldering, Flame, High heat.'],
examTips:['When a question asks the PURPOSE of a system or device, answer in terms of the chain: e.g., a waterflow switch is an initiating device — its purpose is to initiate an alarm, not to control water.','Know that NFPA 72 covers signaling — it does NOT tell you when a building must have a fire alarm system. Occupancy codes (like NFPA 101 or the building code) decide IF; NFPA 72 decides HOW.'],
checks:[{q:'A duct smoke detector shuts down an air handler when it senses smoke. In the signal chain, the shutdown itself is:',opts:['An initiating function','A notification function','An emergency control function','A supervisory signal'],a:2,why:['The DETECTION of smoke is initiation — but the question asks about the shutdown action.','Notification alerts humans; shutting down an AHU commands equipment.','Correct — an action taken by another building system on the fire alarm system\'s command is an emergency control function (NFPA 72 Ch. 21).','Supervisory signals indicate the status of supervised systems (like a closed valve), not control actions.']}],
fieldNotes:'When you walk the tunnel or a fan plant this week, mentally tag every fire alarm component you pass with its block: initiation, processing, notification, or emergency control. This habit makes drawings, SATs, and exam questions all read faster.',
summary:['A fire alarm system is a detect → decide → notify → control chain','Fire grows exponentially; systems exist to beat the growth curve','Detection technologies map to fire stages (incipient → high heat)','NFPA 72 chapters mirror the chain: 17 initiation, 10/23 processing, 18 notification, 21 emergency control']
});

t1.lessons.push({
id:'l2',title:'System Types & Architectures',minutes:19,
objectives:['Distinguish protected premises, supervising station, and household systems','Name the three supervising station types','Explain releasing service and emergency communications systems','Identify which architectures exist on your project'],
simple:`<p>All fire alarm systems answer two questions: <strong>who is being protected</strong>, and <strong>who finds out when something happens</strong>. A system that only rings bells inside the building protects occupants. A system that also calls out — to a monitoring company or an owner's own control center — protects the property even when nobody is home. NFPA 72 names each of these arrangements, and the exam expects you to match name to description.</p>`,
technical:`<ul>
<li><strong>Protected premises (local) system</strong> — serves one property; signals annunciate at the premises. The base case (NFPA 72 Ch. 23).</li>
<li><strong>Supervising station systems</strong> (Ch. 26) add off-premises monitoring. Three flavors:
<ul><li><strong>Central station</strong> — a listed, third-party facility contractually obligated to specific response actions (retransmission, runner service, record keeping). Most rigorous; UL-listed service.</li>
<li><strong>Proprietary</strong> — the property owner runs its own supervising station for its own properties (a railroad's operations control center monitoring its tunnels and stations is the classic example).</li>
<li><strong>Remote</strong> — signals go to a remote location (often fire department or answering service) without central-station-level obligations.</li></ul></li>
<li><strong>Household systems</strong> (Ch. 29) — dwelling unit protection, including single/multiple-station smoke alarms. Know the difference: a smoke <strong>alarm</strong> has the sounder built in and works alone; a smoke <strong>detector</strong> only initiates — it needs a system.</li>
<li><strong>Releasing service</strong> — a fire alarm control unit that discharges an extinguishing system (pre-action sprinklers, clean agent). Extra rules because a false release costs real money and a failed release costs everything.</li>
<li><strong>Emergency communications systems (ECS)</strong> (Ch. 24) — one-way (voice evacuation, mass notification) and two-way (firefighter telephones, area of refuge call boxes, and radio coverage — ERCES/BDA systems).</li>
</ul>`,
field:{
construction:'On a commercial job the spec might call a central station connection; on owner-operated infrastructure you will usually see proprietary supervision instead — the owner watches its own systems around the clock.',
commissioning:'Commissioning must test the WHOLE reporting path, not just the local panel: alarm at device → FACP → transmitter → supervising station operator actually sees it with the right point description. End-to-end verification is a classic SAT line item and a classic place to find database mismatches.',
amtrak:'Amtrak monitoring its own tunnel fire alarm systems through its operations/SCADA infrastructure is proprietary supervising station architecture in NFPA 72 terms. Firefighter phones, blue light stations, and radio coverage in the tunnels are two-way emergency communications concepts.',
fire:'A pre-action sprinkler system in a comms/signal equipment room needs a releasing panel: detection (often cross-zoned) opens the pre-action valve. You are commissioning both a fire alarm function and a suppression function in one cabinet.'},
terms:[['Protected premises system','Fire alarm system serving only the property where it is installed'],['Central station','Listed third-party supervising station with contractual response obligations'],['Proprietary supervising station','Owner-operated supervising station monitoring the owner\'s own properties'],['Remote supervising station','Off-premises monitoring location without central station obligations'],['Smoke alarm vs smoke detector','Alarm = self-contained sensor + sounder; detector = sensor that initiates on a system'],['ECS','Emergency communications system — one-way (voice/mass notification) or two-way (firefighter phones, ERCES)']],
memory:['Supervising stations "CPR": Central (Contract), Proprietary (Property owner), Remote (Relay only).','Alarm = All-in-one. Detector = Depends on a panel.'],
examTips:['If the question says the monitoring facility is owned by the protected property\'s owner — answer proprietary, even if it monitors many buildings.','"Runner service" and listed contractual obligations are central station fingerprints.'],
checks:[{q:'A railroad operates a 24/7 control center that monitors fire alarm systems in its own tunnels, stations, and shops. This is a:',opts:['Central station system','Proprietary supervising station system','Remote supervising station system','Protected premises system only'],a:1,why:['Central station means a listed third party under contract — not the owner itself.','Correct — owner-operated monitoring of the owner\'s own properties is the definition of proprietary supervision.','Remote stations are typically third-party locations without central-station obligations — and this one is owner-run.','The systems DO report off-premises, so they are more than local protected premises systems.']}],
fieldNotes:'Find out (or confirm) how each system you commission reports upstream: what transmits, over what path, to whom, and what the operator sees. Exam questions and field debugging both hinge on that path.',
summary:['Architecture = who is protected + who finds out','Central / Proprietary / Remote differ by ownership and obligations','Smoke alarm (self-contained) ≠ smoke detector (system device)','Releasing service and ECS carry extra requirements']
});

t1.lessons.push({
id:'l3',title:'Codes, Standards & the Approval Chain',minutes:18,
objectives:['Differentiate codes, standards, and listings','Explain the roles of NFPA 72, NFPA 70, and NFPA 101','Define AHJ, approved, and listed as NFPA uses them','Describe how editions get adopted and why it matters'],
simple:`<p>The fire alarm world runs on a division of labor. <strong>The building/occupancy codes decide IF and WHERE</strong> you need systems and devices. <strong>NFPA 72 decides HOW</strong> those systems must perform, be installed, and be tested. <strong>NFPA 70 (the NEC) decides HOW THE WIRING</strong> must be done. <strong>Listing laboratories (like UL)</strong> verify products actually work as claimed. And a human — the <strong>AHJ</strong> — has final say on acceptance. Understand who owns which question and half your code-lookup confusion disappears.</p>`,
technical:`<ul>
<li><strong>Code vs standard:</strong> a code says where/when something is required (adoptable as law); a standard says how to do it. NFPA 72 is titled a code but functions as the how-to for signaling; it explicitly does NOT determine which buildings need fire alarm systems.</li>
<li><strong>NFPA 72</strong> — National Fire Alarm and Signaling Code: application, installation, performance, ITM of fire alarm and signaling systems.</li>
<li><strong>NFPA 70</strong> — National Electrical Code. Article 760 governs fire alarm circuit wiring: power-limited (PLFA) vs non-power-limited (NPLFA) circuits, cable types FPL / FPLR (riser) / FPLP (plenum), separation from other conductors.</li>
<li><strong>NFPA 101 / building codes</strong> — occupancy requirements: which occupancies need systems, occupant notification, egress.</li>
<li><strong>NFPA 130</strong> — fixed guideway transit and passenger rail systems: the overlay standard for your tunnel world (stations, trainways, vehicles, emergency ventilation).</li>
<li><strong>Definitions that appear on every exam:</strong> <em>Approved</em> = acceptable to the AHJ. <em>Listed</em> = equipment in a list published by a testing organization (UL, FM) confirming it meets standards. <em>Shall</em> = mandatory. <em>Should</em> = advisory (annex language).</li>
<li><strong>Editions:</strong> jurisdictions adopt specific editions (your current NICET exams reference NFPA 72-2022). A project is governed by the edition adopted by its jurisdiction/contract — which is why commissioning documents name editions explicitly.</li>
<li><strong>Annex material</strong> (letters A, B…) explains and advises but is not enforceable unless specifically adopted. Annex A notes are keyed to code paragraphs — gold for understanding intent.</li>
</ul>`,
field:{
construction:'Submittal reviews live here: the reviewer checks that proposed equipment is listed for its use and that the design cites the contract-specified code editions. Wrong-edition designs are a real and expensive submittal failure.',

t1.quiz=[
{id:'q1-1',type:'mc',q:'Which sequence best describes the fire alarm signal chain?',opts:['Notification → initiation → control → processing','Initiation → processing → notification → emergency control','Processing → initiation → notification → supervision','Initiation → notification → processing → control'],a:1,why:['Notification cannot precede detection and processing.','Correct — devices initiate, the FACP processes and decides, occupants are notified, and building systems respond.','The panel cannot process a signal that has not been initiated.','The panel must process the signal before any notification occurs.'],ref:'Lesson 1.1'},
{id:'q1-2',type:'tf',q:'True or False: NFPA 72 determines which buildings are required to have a fire alarm system.',opts:['True','False'],a:1,why:['NFPA 72 explicitly leaves that decision to other codes.','Correct — occupancy/building codes (e.g., NFPA 101, IBC, NFPA 130 for rail) decide IF a system is required; NFPA 72 governs how it must perform, be installed, and be maintained.'],ref:'Lesson 1.3'},
{id:'q1-3',type:'scenario',q:'An aspirating smoke detection system (like VESDA) protecting a signal equipment room is selected primarily to detect fire at which stage?',opts:['High heat stage','Flame stage','Incipient stage','Smoldering stage only'],a:2,why:['Heat detection covers the high heat stage — far too late for sensitive electronics.','Flame detectors target open burning — also late for this application.','Correct — air-sampling detection exists to catch the incipient stage, when combustion products are invisible and damage is still minimal. That is exactly why it protects high-value electronics.','It detects smoldering too, but its selling point — and the exam answer — is very early warning at the incipient stage.'],ref:'Lesson 1.1'},
{id:'q1-4',type:'mc',q:'A supervising station operated by a listed third party with contractual obligations for runner service and record-keeping is a:',opts:['Proprietary supervising station','Remote supervising station','Central station','Protected premises system'],a:2,why:['Proprietary means owner-operated.','Remote stations lack the listed contractual service obligations.','Correct — the contract, listing, and prescribed services (retransmission, runner service, records) define central station service.','A protected premises system alone has no off-premises supervision.'],ref:'Lesson 1.2'},
{id:'q1-5',type:'mc',q:'Which document governs the wiring methods and cable types (FPL, FPLR, FPLP) for fire alarm circuits?',opts:['NFPA 72','NFPA 70, Article 760','NFPA 101','NFPA 130'],a:1,why:['NFPA 72 governs system performance, installation and ITM — it points to the NEC for wiring methods.','Correct — NEC Article 760 defines fire alarm circuit types (PLFA/NPLFA) and cable listings.','NFPA 101 is the Life Safety Code — occupancy requirements.','NFPA 130 is the rail transit standard — it overlays requirements but does not define cable types.'],ref:'Lesson 1.3'},

t2.lessons.push({
id:'l1',title:'Electricity from First Principles',minutes:20,
objectives:['Define voltage, current, resistance, and power from physical intuition','Apply Ohm\'s law and the power equation to fire alarm numbers','Analyze simple series and parallel circuits','Use these tools on real device circuits'],
simple:`<p>Electricity is charge in motion. Three quantities describe everything you will ever meter on a fire alarm system:</p>
<ul><li><strong>Voltage (V, volts)</strong> — the push. Electrical pressure difference between two points. A 24 V panel supply means 24 units of push available.</li>
<li><strong>Current (I, amperes)</strong> — the flow. How much charge actually moves per second. Your notification appliances draw current.</li>
<li><strong>Resistance (R, ohms)</strong> — the opposition. Everything resists flow a little (wire) or a lot (an end-of-line resistor).</li></ul>
<p>They are locked together by <strong>Ohm's law: V = I × R</strong>. Push equals flow times opposition. Know any two, you know the third. Add <strong>power: P = V × I</strong> (watts — the rate energy is used) and you can solve every Level I electrical question.</p>
<p>The water analogy earns its keep here: voltage is water pressure, current is flow rate, resistance is pipe narrowness. A tall tank (high voltage) pushes more water (current) through the same pipe. Pinch the pipe (raise resistance) and flow drops. It breaks down for advanced topics — but for DC circuit intuition it is reliable.</p>`,
technical:`<p><strong>Series circuits</strong> (one path): current is the same everywhere; voltages divide across components; resistances add. R<sub>T</sub> = R1 + R2 + …</p>
<p><strong>Parallel circuits</strong> (multiple paths): voltage is the same across each branch; currents add; total resistance is less than the smallest branch. For two resistors R<sub>T</sub> = (R1×R2)/(R1+R2).</p>
<p><strong>Worked example (memorize the method, not the numbers):</strong> A 24 V NAC drives two horns in parallel, each drawing 0.05 A, through wire with 2 Ω total resistance.</p>
<ul><li>Total appliance current: 0.05 + 0.05 = 0.10 A (parallel currents add)</li>
<li>Voltage lost in the wire: V = I × R = 0.10 × 2 = 0.2 V</li>
<li>Voltage at the appliances: 24 − 0.2 = 23.8 V</li>
<li>Power drawn by appliances: P = V × I ≈ 23.8 × 0.10 ≈ 2.4 W</li></ul>
<p>This tiny calculation IS voltage drop analysis — Lesson 5.2 just scales it up. Notification appliances are wired in parallel precisely so each one sees full system voltage and keeps working if another is removed; detection circuits exploit series behavior for supervision (Lesson 2.3).</p>
<p><strong>DC vs AC:</strong> fire alarm system circuits are overwhelmingly 24 VDC (filtered, regulated); primary power arrives as 120 VAC and is rectified. DC has polarity — reversed polarity is a classic field failure that supervision is designed to catch.</p>`,

field:{
construction:'Electricians think in these terms constantly — sharing their language (voltage drop, load, resistance-to-ground) is what lets a commissioning specialist have credible technical conversations at the panel.',
commissioning:'During SAT you meter these quantities directly: standby voltage at the panel, current draw on activated NACs, resistance of unterminated circuits. Knowing the expected value before you meter is the difference between testing and guessing.',
amtrak:'Long tunnel wire runs mean wire resistance actually matters. A circuit that works fine in a lab fails at the far end of a few thousand feet of conductor — the physics in this lesson is why cable sizing on tunnel projects gets engineered attention.',
fire:'Every device data sheet you handle states operating voltage range and current draw in standby and alarm. Those four numbers plus Ohm\'s law generate battery calcs, voltage drop calcs, and circuit loading limits — the three big Level I calculations.'},
terms:[['Voltage (V)','Electrical pressure difference between two points; the push. Measured in volts'],['Current (I)','Rate of charge flow; measured in amperes (A). Fire alarm devices draw milliamps to amps'],['Resistance (R)','Opposition to current flow; measured in ohms (Ω)'],['Ohm\'s law','V = I × R — the relationship binding push, flow, and opposition'],['Power (P)','Rate of energy use; P = V × I, measured in watts'],['Series / Parallel','One path, current shared / multiple paths, voltage shared']],
memory:['Ohm\'s triangle: cover the one you want — V on top, I and R below. Cover V → I×R; cover I → V/R; cover R → V/I.','"Series Shares current, Parallel shares Pressure (voltage)."'],

checks:[{q:'A 24 V circuit has a total resistance of 1,200 Ω. What current flows?',opts:['0.02 A (20 mA)','0.5 A','50 A','2 A'],a:0,why:['Correct — I = V/R = 24/1200 = 0.02 A = 20 mA. (This is roughly the arithmetic of a supervision current through an EOL resistor.)','0.5 A would require R = 48 Ω.','50 A would require R = 0.48 Ω — near a dead short.','2 A would require R = 12 Ω.']},{q:'Notification appliances are connected in parallel on a NAC primarily so that:',opts:['Total resistance is higher','Each appliance receives full circuit voltage','Current through each appliance is identical','Less wire is needed'],a:1,why:['Parallel connection LOWERS total resistance.','Correct — parallel branches all see the supply voltage, so every horn/strobe gets its rated voltage regardless of the others.','Appliance currents depend on each device; parallel means voltages match, not currents.','Wiring topology is about function, not conductor savings.']}],

summary:['V = I × R and P = V × I solve Level I electrical questions','Series: current shared, voltage divides. Parallel: voltage shared, currents add','Fire alarm circuits are ~24 VDC with polarity that matters','Voltage drop, battery calcs, and loading are all this lesson at scale']

t2.lessons.push({
id:'l2',title:'Fire Alarm Circuits & Conductors (NEC 760)',minutes:18,
objectives:['Distinguish power-limited (PLFA) from non-power-limited (NPLFA) circuits','Select the right cable listing: FPL, FPLR, FPLP, and circuit integrity options','Apply separation, identification, and protection rules','Recognize wiring violations during inspections'],
simple:`<p>Fire alarm wiring gets its own NEC article (760) because it must keep working during the exact emergency that destroys ordinary wiring — while also not becoming a fire hazard itself. The article answers three questions: <strong>how much energy is allowed on the circuit</strong> (power-limited or not), <strong>what cable is allowed where</strong> (listings for riser, plenum, general use), and <strong>how fire alarm conductors coexist with everything else</strong> (separation and identification).</p>`,
technical:`<ul>
<li><strong>PLFA vs NPLFA:</strong> Power-limited fire alarm circuits are fed by listed power-limited sources (most modern FACP circuits — typically 24 VDC). Non-power-limited circuits can run up to 600 V and follow rules closer to ordinary building wiring. Power limitation buys relaxed wiring methods; in exchange, PLFA conductors must generally stay separated from electric light/power conductors (no sharing raceways except as specifically permitted).</li>
<li><strong>Cable hierarchy (substitutions go UP, never down):</strong>
<ul><li><strong>FPL</strong> — general purpose fire alarm cable</li>
<li><strong>FPLR</strong> — riser rated: fire-resistance to stop vertical floor-to-floor flame spread</li>
<li><strong>FPLP</strong> — plenum rated: low smoke, used in environmental air spaces</li>
<li><strong>CI (circuit integrity) / fire-rated cable systems</strong> — maintains circuit function during fire exposure (2-hour ratings); specified where survivability is required (Lesson 4.2 pathway survivability)</li></ul></li>
<li><strong>Identification:</strong> fire alarm circuits must be identified at terminal and junction locations; red is the conventional (and often spec-required) color for boxes and covers, though the NEC requirement is identification, not specifically red paint.</li>
<li><strong>Mechanical protection:</strong> conductors need protection where subject to physical damage — a huge theme in tunnels, where everything gets conduit or armored construction.</li>
<li><strong>Grounding & ground faults:</strong> fire alarm systems monitor for ground faults because a single ground may not stop operation, but a second one can disable circuits — the panel reports the first so it gets fixed before the second arrives.</li></ul>`,

construction:'Cable substitution errors are a classic install deficiency: FPL run up a riser shaft, or non-plenum cable above a return-air ceiling. Catching it at rough-in costs one pull; catching it at acceptance costs a re-pull.',
commissioning:'Your pre-test inspections should confirm cable markings against drawings — the printed legend on the jacket tells you the listing. A perfect functional test on wrong cable is still a failed installation.',
amtrak:'Tunnel environments push wiring to the harsh end: moisture, brake dust, rodents, and mechanical damage risk mean conduit-heavy design, and life-safety circuits that must survive fire conditions use circuit-integrity-rated cable or protected raceway — NFPA 130 survivability expectations reinforce it.',
fire:'The LHD interface and NAC circuits you test all ride on NEC 760-compliant wiring. When a megger or continuity check finds an anomaly, the wiring rules tell you what "right" was supposed to look like.'},
terms:[['PLFA / NPLFA','Power-limited / non-power-limited fire alarm circuits — energy limitation determines wiring rules'],['FPL / FPLR / FPLP','Fire alarm cable listings: general / riser / plenum'],['Circuit integrity (CI) cable','Cable listed to maintain operation during fire exposure (e.g., 2-hour)'],['Plenum','Space used for environmental air movement (like above certain ceilings) — demands low-smoke cable'],['Ground fault','Unintended connection between a circuit conductor and ground — monitored and annunciated as trouble']],
memory:['Cable ladder "P over R over nothing": FPLP (Plenum, top) can substitute for FPLR (Riser), which can substitute for FPL. Never downward.','"760" — remember it as the fire alarm article the way 250 is grounding.'],
examTips:['Substitution direction is a favorite question: a higher-rated cable may replace a lower-rated one, never the reverse.','If a question mixes fire alarm conductors with power conductors in one raceway, the safe answer is that separation is required for power-limited circuits (limited exceptions exist).'],

summary:['NEC Article 760 owns fire alarm wiring','Power limitation trades energy limits for flexible wiring methods, with separation rules','Cable listings ladder: FPL → FPLR → FPLP (substitute upward only); CI cable for survivability','Identification, protection from damage, and ground fault monitoring round out the rules']

t2.lessons.push({
id:'l3',title:'Supervision & End-of-Line Resistors',minutes:19,
objectives:['Explain WHY fire alarm circuits monitor their own integrity','Describe how an EOL resistor creates a supervisory current window','Predict panel response to opens, shorts, and grounds','Apply supervision logic to real troubleshooting'],
simple:`<p>Here is the problem supervision solves: a burglar alarm that is broken tells you nothing — and you find out the hard way. A fire alarm circuit might sit quietly for ten years before the one night it matters. <strong>How do you know, every minute of those ten years, that the wire is still intact?</strong></p>
<p>The answer is beautifully simple: <strong>never let the circuit be truly quiet.</strong> Put a resistor at the far end of the circuit (the end-of-line resistor, EOLR) and let a small current flow through the entire loop constantly. The panel watches that current like a pulse:</p>
<ul><li><strong>Normal pulse</strong> (small current through the EOLR) → circuit healthy.</li>
<li><strong>Pulse stops</strong> (no current — a wire broke somewhere) → <strong>TROUBLE</strong> signal.</li>
<li><strong>Pulse floods</strong> (large current — something shorted the line, e.g., a device activated) → <strong>ALARM</strong>.</li></ul>
<p>One resistor turns an invisible failure into an audible trouble signal within seconds. This is the single most important idea in conventional fire alarm circuitry.</p>`,
technical:`<p>On a conventional initiating device circuit (IDC), the panel applies voltage; the EOLR (a panel-specified value, e.g., 4.7 kΩ) sets a known supervisory current — Ohm's law again: 24 V across 4.7 kΩ ≈ 5 mA. The panel classifies what it senses:</p>
<ul><li><strong>Current ≈ supervisory value</strong> → NORMAL</li>
<li><strong>Current ≈ 0 (open circuit)</strong> → TROUBLE — break between panel and EOLR</li>
<li><strong>Current high (low resistance path)</strong> → ALARM — a contact device closed across the line, or a short</li>
<li><strong>Path to ground detected</strong> → GROUND FAULT trouble (separate detection circuit)</li></ul>
<p><strong>Critical consequence — device placement:</strong> supervision only proves the wire UP TO the EOLR. That is why the EOLR must live at the electrically farthest point, and why conventional devices must be wired IN the supervised loop (break the run, land on terminals) — never T-tapped. A T-tap branch is invisible to supervision: a break in the branch disables its devices with no trouble signal. This is also why NACs are supervised with polarity reversal: appliances are wired across the line through polarized elements (they block supervisory current in the reverse direction; the panel reverses polarity to drive them in alarm).</p>
<p><strong>Signal taxonomy (memorize cold):</strong> <em>Alarm</em> = fire condition, immediate response. <em>Supervisory</em> = a supervised system is off-normal (sprinkler valve closed, low air pressure) — needs attention, not evacuation. <em>Trouble</em> = the fire alarm system itself has a fault (open, ground, power loss). Three different sounds, lights, and response procedures.</p>`,

<g fill="none" stroke="var(--ink2)" stroke-width="1.8">
<rect x="20" y="60" width="90" height="70" rx="8" stroke="var(--accent)"/><text x="65" y="90" text-anchor="middle" fill="var(--ink)" font-weight="600">FACP</text><text x="65" y="107" text-anchor="middle" fill="var(--ink2)" font-size="10">senses current</text>
<path d="M110 75 H540 M110 115 H540"/>
<circle cx="200" cy="75" r="7" fill="var(--surface)" stroke="var(--s2)"/><circle cx="320" cy="75" r="7" fill="var(--surface)" stroke="var(--s2)"/><circle cx="440" cy="75" r="7" fill="var(--surface)" stroke="var(--s2)"/>
<text x="200" y="58" text-anchor="middle" fill="var(--ink2)" font-size="10">device</text><text x="320" y="58" text-anchor="middle" fill="var(--ink2)" font-size="10">device</text><text x="440" y="58" text-anchor="middle" fill="var(--ink2)" font-size="10">device</text>
<rect x="540" y="75" width="16" height="40" stroke="var(--s3)"/><text x="590" y="99" fill="var(--ink)" font-weight="600" font-size="11">EOLR</text>

<text x="20" y="180" fill="var(--ink2)" font-size="11">current normal = OK &#160;·&#160; current zero = TROUBLE (open) &#160;·&#160; current high = ALARM (short/contact closed)</text></svg>`,cap:'One resistor at the far end lets the panel verify the entire loop, every second, forever.'},
field:{
construction:'When an installer asks why they cannot T-tap "just this one detector," this lesson is the answer you give — the branch would be electrically invisible until the day it fails silently.',
commissioning:'Circuit supervision tests are standard SAT steps: lift a wire → verify trouble annunciates within the required window; restore → verify auto-restoration. Now you know exactly what the panel is sensing when you do it.',
amtrak:'LHD is supervised exactly this way — the linear cable terminates in an EOL device, so the panel continuously proves thousands of feet of tunnel detection cable. A trouble on an LHD zone localizes to "somewhere between panel and EOL," and Lesson 8.3 shows how to bisect from there.',
fire:'Trouble vs supervisory vs alarm response discipline matters operationally: a sprinkler tamper (supervisory) must never be treated as a nuisance trouble — it means part of the suppression system may be impaired.'},
terms:[['Supervision (monitoring for integrity)','Continuous automatic monitoring of circuit condition so that faults annunciate as trouble'],['EOLR','End-of-line resistor — sets the known supervisory current at the electrically farthest point'],['Trouble signal','Indication of a fault in the system itself (open, ground, power failure)'],['Supervisory signal','Indication that a monitored system (e.g., sprinkler valve) is off-normal'],['T-tap','Branch splice off a supervised 2-wire circuit — prohibited on conventional IDCs/NACs because branches escape supervision'],['Polarity reversal','How NACs work: supervisory current flows one way through the EOLR; the panel reverses polarity to activate polarized appliances']],
memory:['"The panel takes the circuit\'s pulse through the EOLR."','Signal severity ladder: Alarm = Act now. Supervisory = Something\'s off-normal. Trouble = The system itself is sick. (A-S-T: Act / Something / Sick)'],
examTips:['Open circuit → trouble; shorted IDC → alarm; ground → ground-fault trouble. Questions permute these endlessly — reason it out with the current model rather than memorizing cases.','Where must the EOLR be? At the end of the circuit — electrically last, so all wiring is proven. A panel-mounted "EOL" defeats supervision (unless the panel is genuinely the last point).'],
checks:[{q:'A conventional IDC shows normal at the panel, yet a detector on a T-tapped branch has a broken wire. What does the panel report?',opts:['Trouble','Alarm','Nothing — the fault is invisible','Ground fault'],a:2,why:['Trouble requires the supervisory current to be interrupted — the EOLR path is intact.','No low-resistance path was created.','Correct — and this is exactly why T-taps are prohibited: the supervisory current still flows through the untouched main loop and EOLR, so the dead branch is invisible.','No path to ground was created.']},{q:'A sprinkler control valve is closed for maintenance. The fire alarm system should indicate:',opts:['Alarm','Supervisory','Trouble','Pre-alarm'],a:1,why:['No fire condition exists — an alarm would trigger evacuation and dispatch.','Correct — an off-normal condition of a monitored suppression system is precisely what supervisory signals exist for.','Trouble means the fire alarm system itself has a fault — the system is fine; the valve is off-normal.','Pre-alarm relates to early detection thresholds, not valve position.']}],
fieldNotes:'Next circuit-supervision SAT step you run, narrate the physics to yourself: which current changed, what the panel sensed, why the annunciation is correct. Teaching it silently to yourself is rehearsal for teaching it to juniors — and for the exam.',
summary:['Supervision = never let the circuit be quiet; monitor a constant current through an EOLR','Open → trouble; short/contact → alarm; ground → ground fault','EOLR lives at the electrically farthest point; T-taps defeat supervision','Alarm / supervisory / trouble are three distinct signals with distinct responses']
});

{id:'q2-1',type:'calc',q:'A NAC supplies 24 V to appliances drawing a total of 0.75 A through wiring with 1.6 Ω total resistance. What voltage reaches the last appliance (approximately)?',opts:['22.8 V','24 V','21.2 V','23.4 V'],a:0,why:['Correct — drop = I×R = 0.75 × 1.6 = 1.2 V; 24 − 1.2 = 22.8 V.','24 V ignores wire resistance entirely — the exam is testing that you do not.','21.2 V would be a 2.8 V drop (I×R of 1.75 A × 1.6 Ω) — check the multiplication.','23.4 V assumes only 0.375 A — half the stated load.'],ref:'Lesson 2.1'},
{id:'q2-2',type:'mc',q:'In a series circuit, which quantity is the same through every component?',opts:['Voltage','Current','Power','Resistance'],a:1,why:['Voltage divides across series components.','Correct — with only one path, the same current passes through everything.','Power depends on each component\'s voltage and shared current — it differs.','Resistances add; they are properties of each component.'],ref:'Lesson 2.1'},
{id:'q2-3',type:'mc',q:'Which cable is listed for use in a plenum air-handling space?',opts:['FPL','FPLR','FPLP','THHN'],a:2,why:['General-purpose FPL lacks the low-smoke plenum listing.','Riser cable resists vertical flame spread but is not plenum-listed.','Correct — the final P is plenum: low smoke and flame characteristics for environmental air spaces.','THHN is a building-wire insulation type, not a fire alarm cable listing.'],ref:'Lesson 2.2'},
{id:'q2-4',type:'trouble',q:'A conventional smoke detector circuit reads 0 mA supervisory current at the panel and displays trouble. The most likely condition is:',opts:['A detector in alarm','An open circuit between the panel and the EOLR','A short circuit across the loop','Normal condition'],a:1,why:['Alarm creates HIGH current (low-resistance path), not zero.','Correct — zero current means the supervisory path through the EOLR is broken: an open conductor or lifted connection.','A short produces high current and an alarm response.','Normal shows the designed supervisory current (a few mA), never zero.'],ref:'Lesson 2.3'},
{id:'q2-5',type:'tf',q:'True or False: T-tapping devices onto a conventional Class B initiating device circuit is acceptable if wire nuts are properly used.',opts:['True','False'],a:1,why:['Workmanship does not fix the physics — the branch still escapes supervision.','Correct — branches off a supervised 2-wire circuit are not monitored by the EOLR current path; a break in the branch would silently disable devices. Devices must be wired in-line through their terminals.'],ref:'Lesson 2.3'},
{id:'q2-6',type:'scenario',q:'During SAT, lifting one conductor at a duct detector produces a trouble at the FACP within seconds. This demonstrates:',opts:['Ground fault detection','Circuit integrity (survivability)','Monitoring for integrity (supervision)','Alarm verification'],a:2,why:['No ground path was introduced — a conductor was opened.','Survivability is about operating DURING a fire (pathway ratings), not fault annunciation.','Correct — annunciating an open within the required time is exactly what supervision (monitoring for integrity) means and how it is tested.','Alarm verification is a smoke-detector nuisance-reduction feature, unrelated.'],ref:'Lesson 2.3'},
];

t3.lessons.push({
id:'l1',title:'Smoke Detection: Physics First',minutes:20,
objectives:['Explain ionization, photoelectric, beam, and aspirating detection from operating physics','Match each technology to the fires and spaces it suits','Explain VESDA-style air sampling and its sensitivity classes','Choose detection rationally, not by habit'],
simple:`<p>All smoke detection answers one question: <strong>"is there something in this air that should not be here?"</strong> The technologies differ only in how they interrogate the air:</p>
<ul>
<li><strong>Ionization</strong> — a tiny radioactive source keeps a small current flowing through ionized air. Smoke particles latch onto ions and the current drops. Best at sensing the small, fast particles of <em>flaming</em> fires.</li>
<li><strong>Photoelectric (light scatter)</strong> — a chamber hides an LED and a light sensor at an angle where the sensor normally sees darkness. Smoke entering the chamber scatters light onto the sensor. Best at the large particles of <em>smoldering</em> fires — the couch fire at 2 a.m.</li>
<li><strong>Projected beam</strong> — a transmitter fires light across a large space to a receiver; smoke anywhere along the path obscures the beam. One device protects an atrium, hangar, or trainshed.</li>
<li><strong>Aspirating (air sampling, e.g., VESDA)</strong> — a fan actively pulls air through a pipe network with sampling holes into a central laser chamber that can detect obscuration hundreds of times fainter than a spot detector. Very early warning for high-value or hard-to-access spaces.</li>
</ul>`,
technical:`<p><strong>Sensitivity</strong> is measured in percent obscuration per foot (%/ft) — how much a foot of smoky air dims light. Spot photoelectric detectors typically alarm around 1–4 %/ft. Aspirating detectors reach down to thousandths of a %/ft, which is why they catch the incipient stage. They typically provide multiple staged thresholds (e.g., Alert → Action → Fire 1 → Fire 2), letting operators investigate before alarm response — invaluable where an unnecessary evacuation or discharge is very costly.</p>
<p><strong>Where each fits:</strong> spot photoelectric is the general-purpose workhorse; ionization has declined (nuisance-prone near kitchens/dust, and many jurisdictions favor photoelectric); beams own large volumes where spot spacing is impractical; aspirating owns dirty, cold, inaccessible, or high-airflow spaces — equipment rooms, cold storage, shafts, tunnels' ancillary spaces — because the pipe samples the environment while the sensitive electronics sit somewhere maintainable, with filters handling contamination.</p>
<p><strong>Environmental limits (exam staple):</strong> spot smoke detectors are listed for ranges commonly around 32–100°F and limited humidity/velocity — outside those, choose heat detection or aspirating with conditioning. High airflow dilutes and diverts smoke: that is why duct detection uses sampling tubes spanning the duct and why high-velocity spaces need engineered approaches.</p>
<p><strong>Duct smoke detectors</strong> exist to stop HVAC from spreading smoke (shutdown/damper control), NOT to substitute for open-area protection — a distinction the exam tests directly.</p>`,

commissioning:'Aspirating systems add commissioning steps spot detectors never need: pipe integrity/flow verification (transport time from farthest hole), airflow fault thresholds, and staged threshold verification. Your VESDA transport-time tests are exactly this.',
amtrak:'Fan plants and ancillary equipment rooms are hostile to spot detection — airflow, dust, and access issues. That is why air-sampling detection earns its cost there: maintainable centrally, sensitive enough for early intervention before smoke reaches a running fan system.',
