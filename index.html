  const c=CERT('nicet1');const deck=flashDeck();
  if(!FC.order.length||FC.order.length!==deck.length){FC.order=deck.map((_,i)=>i);FC.i=0;FC.flip=false;}
  const cur=deck[FC.order[FC.i]||0];
  const known=Object.keys(S.flashKnown).length;
  $('#view').innerHTML='<h1 class="mb">Flashcards</h1>'
  +'<div class="row spread mb"><div class="pill-tabs"><button class="'+(FC.topic==='all'?'on':'')+'" onclick="FC.topic=\'all\';FC.order=[];render()">All topics</button>'+c.topics.map(t=>'<button class="'+(FC.topic===t.id?'on':'')+'" onclick="FC.topic=\''+t.id+'\';FC.order=[];render()">'+esc(t.name.split(' ')[0].replace(',',''))+'</button>').join('')+'</div>'
  +'<span class="small muted">'+known+' marked known · '+deck.length+' cards in deck</span></div>'
  +(deck.length?'<div class="flash-stage"><div class="flash-card'+(FC.flip?' flip':'')+'" onclick="FC.flip=!FC.flip;render()">'
  +'<div class="flash-face"><span class="ff-tag">'+esc(cur.topic)+' · term</span><div class="flash-term">'+esc(cur.term)+'</div><p class="small muted mt">tap to reveal</p></div>'
  +'<div class="flash-face back"><span class="ff-tag">definition</span><div class="flash-def">'+esc(cur.def)+'</div></div></div>'
  +'<div class="flash-controls"><button class="btn btn-ghost" onclick="flashNext(false)">Still learning</button><button class="btn btn-primary" onclick="flashNext(true)">Got it ✓</button><button class="btn btn-ghost btn-sm" onclick="flashShuffle()">Shuffle</button></div>'
  +'<p class="small muted mt" style="text-align:center">Card '+(FC.i+1)+' of '+deck.length+(S.flashKnown[cur.term]?' · previously known':'')+'</p></div>':'<div class="empty">No cards in this filter.</div>');
}
function flashNext(known){const deck=flashDeck();const cur=deck[FC.order[FC.i]];if(known){S.flashKnown[cur.term]=1;}else delete S.flashKnown[cur.term];FC.flip=false;FC.i=(FC.i+1)%FC.order.length;markActivity(1);render();}
function flashShuffle(){for(let i=FC.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[FC.order[i],FC.order[j]]=[FC.order[j],FC.order[i]];}FC.i=0;FC.flip=false;render();toast('Deck shuffled');}

/* ---------- Notes ---------- */
function vNotes(){
  const lessonNotes=Object.entries(S.notes).filter(([k])=>k!=='general'&&S.notes[k]);
  const items=lessonNotes.map(([k,v])=>{const [cid,tid,lid]=k.split('/');const c=CERT(cid);const t=c&&c.topics.find(x=>x.id===tid);const l=t&&t.lessons.find(x=>x.id===lid);if(!l)return'';
    return '<div class="card mb"><div class="row spread"><h3><a href="#lesson/'+k+'">'+esc(l.title)+'</a></h3><span class="small muted">'+esc(t.name)+'</span></div><p class="small mt" style="white-space:pre-wrap">'+esc(v)+'</p></div>';}).join('');
  $('#view').innerHTML='<h1 class="mb">Notes</h1>'
  +'<div class="card mb"><div class="card-title"><h2>'+IC.note+' General notebook</h2></div><textarea class="note-area" style="min-height:160px" placeholder="Questions for your commissioning lead, code sections to revisit, exam admin to-dos…" onchange="S.notes.general=this.value;toast(\'Saved\')">'+esc(S.notes.general||'')+'</textarea></div>'
  +'<h2 class="mb">Lesson notes</h2>'+(items||'<div class="empty">Notes you write inside lessons appear here automatically.</div>');
}

/* ---------- AI Coach ---------- */
function vCoach(){
  const ac=activeCert();const qs=quizStats(ac.id);const p=certProgress(ac);const st=streak();const nl=nextLesson(ac.id);
  const day=Math.floor(new Date()/(864e5));
  const wh=weekHours();const goal=S.planner.hoursPerWeek||7;
  const pe=S.practiceExams.filter(e=>e.cert===ac.id);
  const msgs=[];
  const bubble=(title,body)=>'<div class="coach-msg"><div class="coach-avatar">AI</div><div class="coach-bubble"><h3>'+title+'</h3>'+body+'</div></div>';
  msgs.push(bubble('Today’s push','<p>'+esc(dailyMotivation())+'</p>'));
  /* weekly review */
  const wkLessons=Object.values(S.completedLessons).filter(d=>new Date(d+'T12:00:00')>=addDays(new Date(),-7)).length;
  msgs.push(bubble('Weekly review','<p>This week: <b>'+wh.toFixed(1)+' h</b> of a '+goal+' h goal ('+Math.round(wh/goal*100)+'%), <b>'+wkLessons+'</b> lessons completed, streak at <b>'+st+' days</b>.</p>'
    +(wh>=goal?'<p>Goal met — protect the habit, not just the number. Consider banking 30 extra minutes on your strongest day.</p>':wh>=goal*0.5?'<p>Past halfway — two focused evening sessions close the gap. Schedule them now, not "later."</p>':'<p>Light week so far. Do not chase the deficit in one heroic session — schedule three 30-minute blocks and rebuild momentum instead.</p>')));
  /* weak areas */
  if(qs.weak.length){msgs.push(bubble('Weak area detected','<p>'+qs.weak.map(w=>'<b>'+esc(w.t.name)+'</b> ('+w.pct+'%)').join(', ')+' below the 70% line. Recommendation: re-read those lesson summaries, redo flashcards for the topic, then retake the quiz. Points hide in weak topics — polishing strengths feels better and scores worse.</p>'));}
  else if(qs.taken)msgs.push(bubble('Quiz health','<p>No topic below 70% — strong position. Push your best topics to 85%+ (mastery gate) and keep moving forward.</p>'));
  /* next best lesson */
  if(nl)msgs.push(bubble('Next best lesson','<p><a href="#lesson/'+ac.id+'/'+nl.topic.id+'/'+nl.lesson.id+'"><b>'+esc(nl.lesson.title)+'</b></a> ('+nl.lesson.minutes+' min, '+esc(nl.topic.name)+'). It is next in the first-principles sequence — each lesson assumes the ones before it.</p>'));
  else if(p.total&&p.done===p.total)msgs.push(bubble('Curriculum complete','<p>All '+p.total+' lessons done. Now the cycle is: practice exams → miss review → weak-topic drills → repeat until the 80% gate holds. '+(pe.length?'Latest practice exam: <b>'+pe[pe.length-1].pct+'%</b>.':'Take your first timed practice exam today.')+'</p>'));
  /* readiness + exam */
  const rd=readiness(ac.id);
  msgs.push(bubble('Readiness estimate','<p><b>'+rd+'%</b> for '+esc(ac.short)+' (lessons '+p.pct+'%, quiz avg '+(qs.avg!=null?qs.avg+'%':'—')+', practice exams '+(pe.length?Math.round(pe.reduce((a,e)=>a+e.pct,0)/pe.length)+'%':'—')+', confidence '+(confidenceScore(ac.id)!=null?confidenceScore(ac.id)+'%':'—')+').</p>'
    +(S.planner.examDate?'<p>Exam '+fmtDate(S.planner.examDate)+'. '+(rd>=80?'You are tracking to the gate — hold the routine.':'Below the 80% gate for now — the planner has already reserved your final weeks for practice exams and revision; trust the sequence.')+'</p>':'<p>No exam date set. Booking a real date is the single highest-leverage motivational move available to you — do it in the <a href="#planner">planner</a>.</p>')));
  /* efficiency */
  msgs.push(bubble('Study efficiency tip','<p>'+esc(DATA.efficiencyTips[day%DATA.efficiencyTips.length])+'</p>'));
  /* career */
  msgs.push(bubble('Career coaching','<p>Your stack-in-progress — NICET + safety + CCM + CCP/CxA on top of a CS degree and $1.6B-project commissioning experience — is rare. Most fire alarm techs never touch owner-side commissioning; most CMs never master a technical trade; almost nobody bridges construction and software. Every lesson here compounds that moat.</p><p>This month\'s move: keep a running log of your ERT responsibilities as responsible-in-charge (RIC) experience — role, decision authority, non-overlapping months, and two references who can verify it. It becomes your CCM application AND your CCP project documentation later. Two future applications, one habit.</p>'));
  if(st===0)msgs.push(bubble('Streak rescue','<p>The chain is broken — which matters less than what happens next. One 15-minute session today restarts it. The professionals are not the ones who never miss; they are the ones who never miss twice.</p>'));
  msgs.push(bubble('Housekeeping','<p>Progress lives in this session\'s memory. <a href="#" onclick="openBackup();return false">Export a backup</a> after each study session, and re-import it next time — 10 seconds that protects everything.</p>'));
  $('#view').innerHTML='<h1 class="mb">AI Coach</h1><p class="muted small mb">Advice generated from your actual progress data — updated every time you study.</p>'+msgs.join('');
}

/* ---------- Search ---------- */
function vSearch(q){
  q=(q||'').toLowerCase().trim();
  const res=[];
  DATA.certs.forEach(c=>{
    c.topics.forEach(t=>{
      t.lessons.forEach(l=>{
        let score=0,why='';
        if(l.title.toLowerCase().includes(q))score+=5,why='title';
        (l.terms||[]).forEach(x=>{if(x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q)){score+=3;why=why||('term: '+x[0]);}});
        (l.summary||[]).forEach(s=>{if(s.toLowerCase().includes(q))score+=1,why=why||'summary';});
        if((l.simple+l.technical).toLowerCase().includes(q))score+=1,why=why||'content';
        if(score)res.push({score,why,c,t,l});
      });
    });
  });
  res.sort((a,b)=>b.score-a.score);
  $('#view').innerHTML='<h1 class="mb">Search: “'+esc(q)+'”</h1>'
  +(res.length?res.slice(0,30).map(r=>'<div class="card mb"><div class="row spread"><h3><a href="#lesson/'+r.c.id+'/'+r.t.id+'/'+r.l.id+'">'+esc(r.l.title)+'</a></h3><span class="badge">'+esc(r.why)+'</span></div><div class="small muted">'+esc(r.c.short)+' › '+esc(r.t.name)+' · '+r.l.minutes+' min</div></div>').join('')
  :'<div class="empty">No matches. Try a code term ("EOLR", "candela", "Class A") or a topic ("battery", "VESDA", "spacing").</div>');
}

/* ---------- Study timer ---------- */
let TIMER={running:false,start:0,iv:null};
function toggleTimer(){
  if(!TIMER.running){TIMER.running=true;TIMER.start=Date.now();$('#timerBtn').classList.remove('btn-primary');$('#timerBtn').classList.add('btn-ghost','running');
    TIMER.iv=setInterval(()=>{const s=Math.floor((Date.now()-TIMER.start)/1000);$('#timerLabel').textContent=fmtClock(s)+' — stop & log';},1000);
    toast('Session timer running — go study');}
  else{clearInterval(TIMER.iv);const mins=Math.max(1,Math.round((Date.now()-TIMER.start)/60000));TIMER.running=false;
    $('#timerLabel').textContent='Study session';$('#timerBtn').classList.add('btn-primary');$('#timerBtn').classList.remove('btn-ghost','running');
    S.hours.push({date:todayStr(),h:+(mins/60).toFixed(2),note:'Timed session'});markActivity(mins);toast(mins+' min logged. Streak: '+streak()+' days');render();}
}

/* ---------- Backup / restore ---------- */
function openModal(html){$('#modalBody').innerHTML=html;$('#modalScrim').classList.add('open');}
function closeModal(){$('#modalScrim').classList.remove('open');}
function openBackup(){
  const json=JSON.stringify(S);
  openModal('<h2>Backup & restore</h2><p class="small muted">This app stores progress in memory only. Export before closing; import to restore. Keep the file anywhere (notes app, cloud drive).</p>'
  +'<div class="field mt"><label>Your progress data (copy this)</label><textarea class="note-area" id="bkOut" style="min-height:90px;font-size:.75rem" readonly>'+esc(json)+'</textarea></div>'
  +'<div class="row"><button class="btn btn-primary btn-sm" onclick="copyBackup()">Copy to clipboard</button><button class="btn btn-ghost btn-sm" onclick="downloadBackup()">Download .json</button></div>'
  +'<div class="field mt"><label>Restore: import a downloaded backup file</label><input type="file" id="bkFile" accept="application/json,.json" onchange="importBackupFile(this)"></div>'
  +'<div class="field"><label>…or paste previous backup here</label><textarea class="note-area" id="bkIn" style="min-height:70px;font-size:.75rem" placeholder="Paste backup JSON…"></textarea></div>'
  +'<div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="restoreBackup()">Import</button></div>');
}
function copyBackup(){const ta=$('#bkOut');ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied — paste it somewhere safe'));}catch(e){document.execCommand('copy');toast('Copied');}}
function downloadBackup(){const blob=new Blob([$('#bkOut').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cert-academy-progress-'+todayStr()+'.json';a.click();}
function importBackupFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bkIn').value=r.result;restoreBackup();};r.readAsText(f);}
function restoreBackup(){try{const data=JSON.parse($('#bkIn').value);if(!data||typeof data!=='object'||!('completedLessons' in data))throw 0;S=Object.assign(DEFAULT_STATE(),data);closeModal();applyTheme();render();toast('Progress restored ✓');}catch(e){toast('Could not read that backup — check the JSON');}}

/* ---------- Theme ---------- */
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme||'auto');}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const isDark=cur==='dark'||(cur!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=isDark?'light':'dark';applyTheme();}

/* ---------- Init ---------- */
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();$('#sidebar').classList.toggle('open');});
document.addEventListener('click',e=>{const sb=$('#sidebar');if(sb.classList.contains('open')&&!sb.contains(e.target))sb.classList.remove('open');});
$('#themeBtn').addEventListener('click',toggleTheme);
$('#backupBtn').addEventListener('click',openBackup);
$('#timerBtn').addEventListener('click',toggleTimer);
$('#modalScrim').addEventListener('click',e=>{if(e.target.id==='modalScrim')closeModal();});
$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())go('#search/'+encodeURIComponent(e.target.value.trim()));});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#searchInput').focus();}});
/* Route all in-app anchor links through the sandbox-safe router */
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(a){const h=a.getAttribute('href');if(h&&h.length>1){e.preventDefault();go(h);}}});
applyTheme();render();
window.__booted=true;
if(window.SAVED_STATE)setTimeout(()=>toast('Progress loaded — snapshot from '+fmtDate(window.SAVED_STATE_DATE)),700);
</script>
<script>
/* ============ WEB (SELF-HOSTED) EDITION: automatic saving ============
   Runs only where browser storage exists (your own hosted copy / Safari / Chrome).
   Falls back silently to memory-only elsewhere. */
(function(){
  var STORE=null;try{var t='__probe';localStorage.setItem(t,'1');localStorage.removeItem(t);STORE=localStorage;}catch(e){}
  if(!STORE)return;
  var KEY='certAcademyStateV1';
  try{var saved=STORE.getItem(KEY);if(saved){var d=JSON.parse(saved);if(d&&d.completedLessons){S=Object.assign(DEFAULT_STATE(),d);applyTheme();}}}catch(e){}
  var _render=render;
  render=function(){_render();try{STORE.setItem(KEY,JSON.stringify(S));}catch(e){}};
  window.addEventListener('beforeunload',function(){try{STORE.setItem(KEY,JSON.stringify(S));}catch(e){}});
  render();
  setTimeout(function(){toast('Auto-save is ON — progress lives in this browser');},1400);
})();
</script>
