t3.lessons.push({
id:'l2',title:'Heat Detection & Linear Heat (LHD)',minutes:19,
objectives:['Explain fixed-temperature, rate-of-rise, and rate-compensated operation','Distinguish restorable vs non-restorable devices','Describe digital and analog linear heat detection and why tunnels use it','Apply temperature classification and listed spacing concepts'],
simple:`<p>Heat detection is the reliable workhorse: slower than smoke detection (heat means the fire is established) but nearly immune to the dust, humidity, exhaust and steam that make smoke detectors cry wolf. Three ways to decide "this is fire-hot":</p>
<ul>
<li><strong>Fixed temperature</strong> — alarm at a set point (commonly 135°F or 190°F ordinary/intermediate). Simple: a fusible element melts or a bimetal snaps at the rating.</li>
<li><strong>Rate-of-rise (ROR)</strong> — alarm if temperature climbs faster than about 12–15°F per minute, regardless of the absolute value. Catches fast fires early even in cold spaces; a slow-building fire can sneak past it — which is why ROR is usually combined with a fixed element.</li>
<li><strong>Rate-compensated</strong> — a cleverer fixed-temp device that responds at its rating quickly regardless of how fast the air heated, eliminating thermal lag without false-tripping on rate alone.</li>
</ul>
<p><strong>Restorable vs non-restorable:</strong> a fusible-element (melting) device is destroyed by activation — one-shot. Bimetal and pneumatic devices restore when they cool. This drives testing rules: you functionally heat-test restorable devices; non-restorable ones you never destroy in routine testing.</p>`,
technical:`<p><strong>Linear heat detection (LHD)</strong> turns the sensor into a cable, detecting heat anywhere along its length — made for tunnels, cable trays, conveyors, and other long assets:</p>
<ul>
<li><strong>Digital (switch-type) LHD:</strong> two spring-steel conductors twisted under tension, each insulated by heat-sensitive polymer. At the rated temperature the polymer yields and the conductors touch — a short = alarm, at whatever point got hot. Simple, robust, non-restorable at the activated spot (the section must be replaced). Locating modules can compute the distance to the short.</li>
<li><strong>Analog / sensing LHD:</strong> the cable's electrical properties (resistance/capacitance) vary with temperature, or fiber-optic DTS (distributed temperature sensing) lasers read temperature continuously along a fiber — giving actual temperature profiles, adjustable thresholds, rate detection, and precise location. Restorable, more capable, more cost.</li>
</ul>
<p><strong>Why tunnels choose LHD:</strong> continuous coverage of a linear asset with no maintenance points overhead, tolerance of the brutal environment (moisture, dust, washdowns, piston-effect winds), and location reporting so ventilation responses can be zone-appropriate. Smoke detection in a trainway would be nuisance-alarm chaos; LHD waits for real heat.</p>
<p><strong>Classification & spacing:</strong> heat detectors carry temperature classifications with color codes (e.g., ordinary 135°F/uncoded or untinted, intermediate 190°F/white — learn the table in NFPA 72 Ch. 17). Select a rating comfortably above the highest expected ambient (rule of practice: at least ~20°F above max ambient). Spot heat detectors are listed with a spacing (e.g., 50 ft) established by test — Lesson 3.4 covers how geometry modifies it. LHD is treated as a line of spot detectors per its listed spacing off the protected surface.</p>`,
field:{
construction:'Heat detector ratings must be checked against real ambients: above unit heaters, in attics, near exhaust — a 135°F device in a space that hits 120°F on a summer afternoon is a nuisance alarm on a schedule.',
commissioning:'Functional heat tests use listed heat sources on restorable devices; digital LHD is typically verified by circuit tests plus manufacturer-approved methods rather than melting good cable. Confirm test methods against the manufacturer instructions your SAT references.',
amtrak:'Your tunnel LHD is the textbook application: continuous detection over miles of trainway, zone-mapped so an alarm drives the correct ventilation and emergency response for that segment. Supervision (Topic 2) proves cable integrity; locating features turn "somewhere in the tunnel" into a chainage.',
fire:'LHD zones typically interface to the FACP via monitor modules or dedicated controllers — meaning the alarm the FACP sees is only as good as the zone mapping database. Point-to-chainage verification belongs in commissioning records.'},
terms:[['Fixed-temperature detector','Alarms at a rated temperature (e.g., 135°F ordinary, 190°F intermediate)'],['Rate-of-rise (ROR)','Alarms on rapid temperature climb (~12–15°F/min) regardless of absolute temperature'],['Rate-compensated','Responds at rated temperature without thermal lag, regardless of heating rate'],['Restorable / non-restorable','Whether the sensing element survives activation (bimetal yes, fusible no)'],['Digital LHD','Twisted-pair cable that shorts at rated temperature — alarm anywhere along its length'],['Fiber-optic DTS','Distributed temperature sensing — laser-interrogated fiber giving a continuous temperature profile with location']],
memory:['"Fixed = a thermostat with one job. ROR = a speedometer for temperature. Rate-compensated = fixed, minus the lag."','LHD: "the detector IS the wire."'],
examTips:['Heat detection is property protection speed, not life safety speed — questions asking for earliest warning never answer "heat detector."','Know ordinary (135°F) vs intermediate (190°F) classes and that selection sits safely above max ambient; the color-code table is a lookup question waiting to happen.'],
checks:[{q:'A digital (switch-type) linear heat detection cable alarms when:',opts:['Its resistance drifts with average temperature','Heat-sensitive insulation yields and the twisted conductors short together','Infrared radiation strikes a sensor','The cable\'s fiber refracts laser light differently'],a:1,why:['Averaging/analog LHD behaves that way — digital LHD is a go/no-go switch.','Correct — the polymer holds spring-tensioned conductors apart until rated temperature, then they touch: a supervised short = alarm at that point.','That describes flame detection, a different technology.','That describes fiber-optic DTS — the other LHD family.']}],
fieldNotes:'Find one LHD zone map on your project and trace it: cable run → interface module/controller → FACP point → SCADA display text. Any mismatch you find in that chain is exactly the kind of finding owner commissioning exists to catch.',
summary:['Heat detection trades speed for reliability in harsh environments','Fixed / ROR / rate-compensated; restorable vs non-restorable drives test methods','Digital LHD = heat-triggered short anywhere along a cable; analog/fiber gives temperature + location','Tunnels use LHD for continuous, robust, locatable trainway detection']
});

t3.lessons.push({
id:'l3',title:'Manual Stations & Sprinkler Monitoring',minutes:17,
objectives:['State placement rules for manual pull stations','Explain single vs double action stations','Describe waterflow detection and retard timing','Classify valve tamper, pressure, and level signals correctly'],
simple:`<p>Two families of "initiation without smoke or heat sensing":</p>
<p><strong>Manual fire alarm boxes (pull stations)</strong> put a human in the detection loop — the person who sees the fire before any sensor does. Because their entire value is being findable in panic, the code pins them down precisely: at exits, mounted in the natural hand zone, red and obvious. <strong>Single-action</strong> = one motion (pull). <strong>Double-action</strong> = two motions (lift flap then pull, or push then pull) to reduce malicious/accidental alarms — common in schools and public spaces.</p>
<p><strong>Sprinkler monitoring</strong> makes the fire alarm system the sprinkler system's messenger. Water moving = fire (alarm). Valve closed, pressure off, tank low = the sprinkler system is impaired (supervisory). The fire alarm system doesn't control any water — it just tells the truth about what the water systems are doing.</p>`,
technical:`<ul>
<li><strong>Pull station placement (NFPA 72 Ch. 17):</strong> operable part between <strong>42 and 48 inches</strong> above floor; within <strong>5 ft of each exit doorway</strong> on each floor; positioned so travel distance to the nearest station does not exceed <strong>200 ft</strong>. Unobstructed, conspicuous, red.</li>
<li><strong>Waterflow switches:</strong> a paddle in the pipe (vane type) deflects when water flows to an open sprinkler. Surges cause momentary paddle bumps, so a <strong>retard</strong> (delay) is built in — but flow must alarm within <strong>90 seconds</strong> of sustained flow. Waterflow = ALARM signal, always.</li>
<li><strong>Valve supervisory (tamper) switches:</strong> report a control valve moving off fully-open. Off-normal within two revolutions of the handwheel or one-fifth of travel = SUPERVISORY signal. Never wired to look like an alarm — the responses differ completely.</li>
<li><strong>Other sprinkler supervision:</strong> low/high air pressure (dry-pipe systems), fire pump status (running, power failure, phase reversal), water tank level and temperature — all SUPERVISORY category signals to keep the suppression system honest.</li>
</ul>`,
field:{
construction:'Pull station height and exit proximity get field-verified with a tape measure at acceptance — trim carpentry and late door relocations are how compliant drawings become non-compliant installations.',
commissioning:'Waterflow tests are timed: open the inspector\'s test connection (which simulates one sprinkler head flowing) and verify alarm within 90 seconds, plus correct address/zone text at the panel and supervising station. Tamper tests verify supervisory-not-alarm classification — a wiring error here is a big finding.',
amtrak:'Standpipe and suppression interfaces in tunnel and station facilities report through the same discipline: flow = alarm, valve/tamper/pressure = supervisory, and every point must annunciate with location text an operator can act on at 3 a.m.',
fire:'The alarm/supervisory distinction is operational: flow dispatches response; a tamper dispatches a maintenance investigation and possibly a fire watch. Mixing them up in programming causes either dangerous complacency or repeated false dispatches.'},
terms:[['Manual fire alarm box','Code term for a pull station — a manually actuated initiating device'],['Single/double action','One motion vs two deliberate motions to activate'],['Waterflow switch (vane type)','Paddle device detecting water movement to an open sprinkler — initiates an alarm'],['Retard','Built-in delay preventing surge-induced false waterflow alarms (alarm still required within 90 s of sustained flow)'],['Valve supervisory switch','Tamper switch signaling a sprinkler control valve off its normal (open) position — a supervisory signal'],['Inspector\'s test connection','A valved outlet simulating a single flowing sprinkler for waterflow testing']],
memory:['Pull stations: "42–48 high, 5 ft from the door, 200 ft max walk."','"Flow = Fire. Valve = Vigilance." (Alarm vs supervisory.)'],
examTips:['The 42–48 in / 5 ft / 200 ft trio is among the most-tested numbers at Level I.','Any question wiring a tamper switch into an alarm-initiating role is describing a violation — signals must annunciate distinctively.'],
checks:[{q:'A sprinkler waterflow switch activates from sustained flow. The system must annunciate:',opts:['A supervisory signal within 200 seconds','An alarm within 90 seconds','A trouble within 90 seconds','An alarm within 5 minutes'],a:1,why:['Waterflow is never supervisory — moving water means an open head, which means fire until proven otherwise.','Correct — retard time is permitted, but sustained flow must produce an ALARM within 90 seconds.','Trouble indicates a system fault; nothing is faulted here.','Five minutes would defeat the purpose of automatic detection.']}],
fieldNotes:'Next time you pass a pull station on site, eyeball the height and door distance, then check the as-builts. Thirty seconds of practice per station builds the inspector\'s eye that Level II and real punch lists demand.',
summary:['Pull stations: 42–48 in operable height, ≤5 ft from exits, ≤200 ft travel distance','Single vs double action trades speed for nuisance resistance','Waterflow (with retard) = ALARM within 90 s; valve tamper and pressures = SUPERVISORY','The fire alarm system is the honest messenger of the suppression systems']
});

t3.lessons.push({
id:'l4',title:'Detector Spacing & Placement',minutes:20,
objectives:['Apply smooth-ceiling spacing rules for spot smoke and heat detectors','Adjust for walls, corners, and the dead air concept','Recognize when beams, joists, and high ceilings modify spacing','Read a placement drawing critically'],
simple:`<p>Why does spacing exist at all? Because smoke and heat do not teleport to detectors — they ride the <strong>ceiling jet</strong>. A fire's plume rises, hits the ceiling, and spreads radially in a shallow layer. A detector responds when that layer reaches it with enough concentration or temperature. Spacing rules are the code's answer to: <em>"how far apart can detectors be so that no fire burns too long before its ceiling jet finds one?"</em></p>
<p>Heat detectors are tested to earn a <strong>listed spacing</strong> (commonly 50 ft). Spot smoke detectors use <strong>30 ft nominal spacing</strong> on smooth ceilings as the standard starting point. Everything else in this lesson is geometry: what happens when real ceilings interrupt that radial spread.</p>`,
technical:`<ul>
<li><strong>The 0.7 rule:</strong> a detector on a grid of spacing S actually protects a circle of radius 0.7 × S. For 30 ft smoke spacing → 21 ft radius. This is how you handle corridors and irregular rooms: every point on the ceiling must be within 0.7S of a detector. A 10 ft corridor can legally stretch detectors beyond 30 ft apart because the narrow width keeps all points inside the circles (up to ~41 ft in a 10 ft corridor).</li>
<li><strong>Walls and half-spacing:</strong> detectors within half the spacing (15 ft for smoke at 30 ft spacing) of every wall — the jet reflected into corners still gets coverage.</li>
<li><strong>Dead air & mounting:</strong> the classic teaching: heat detectors on the ceiling stay at least 4 in from sidewalls; wall-mounted, the top of the device sits 4–12 in below the ceiling — avoiding the stagnant corner pocket. (Editions have relaxed the rule for smoke detectors — wall-mounted smokes within 12 in of the ceiling — but the 4 in sidewall setback for ceiling-mounted heat remains a tested number. Verify against the code edition you are examined on.)</li>
<li><strong>Beams and joists:</strong> downstand beams dam the ceiling jet. Rules of thumb the exam draws on: shallow obstructions get ignored, deeper beams force spacing reductions perpendicular to the beams or treating bays as separate areas (deep beams/pockets = each pocket its own space). Solid joists always require reduced spacing for heat detection.</li>
<li><strong>High ceilings:</strong> plume dilution and stratification (smoke cooling to ambient temperature and spreading BELOW the ceiling) degrade spot detection — heat detector spacing reduces on a schedule with height; very high spaces move to beams (possibly at multiple levels) or aspirating sampling points.</li>
<li><strong>Sloped ceilings:</strong> hot layers pool at the peak — detectors concentrate there per specific rules.</li>
</ul>`,

field:{
construction:'Ceiling changes are the silent spacing killer: added ductwork, new soffits, or revised structure invalidate a compliant layout. Placement review belongs in every ceiling-change RFI touching protected spaces.',
commissioning:'Walkdown skill: carry the reflected ceiling plan and check reality against it — added obstructions near detectors, devices relocated by trades, dead-air violations. These findings are cheap before ceiling close-in and expensive after.',
amtrak:'Stations, plant rooms, and ancillary buildings all present the classic complications: high bays, beam pockets, airflow. And trainway stratification is exactly why tunnel detection went to LHD at the crown rather than spot smoke detection.',
fire:'When reviewing a device layout submittal, do the 0.7S sanity check on the worst-looking room and measure the corridor spacing claims. Reviewers who check geometry catch what reviewers who count symbols miss.'},
terms:[['Ceiling jet','The shallow, fast layer of hot gas spreading radially where the plume meets the ceiling'],['Listed spacing','The spacing a heat detector earned in listing tests (commonly 50 ft); the basis all adjustments modify'],['Nominal 30 ft spacing','Standard spot smoke detector spacing basis on smooth ceilings'],['0.7 rule','A detector protects a circle of radius 0.7 × spacing — the tool for corridors and odd shapes'],['Dead air space','Stagnant pocket where ceiling meets wall that delays detection — drives the 4 in / 4–12 in mounting geometry'],['Stratification','Smoke cooling to ambient and spreading below ceiling level — defeats ceiling detection in tall spaces']],
memory:['"Point seven covers heaven" — 0.7 × S is the protected radius.','Numbers to carry: smoke 30 ft nominal · heat 50 ft typical listed · half-spacing to walls · 4 in sidewall setback.'],
examTips:['Corridor questions are 0.7-rule questions in disguise — compute the radius, then geometry.','If a question mentions beams deeper than a few inches, expect the answer to involve reduced spacing or treating bays separately — never "no effect."'],
checks:[{q:'Spot smoke detectors at 30 ft listed-basis spacing protect a circular area with radius of approximately:',opts:['30 ft','15 ft','21 ft','42 ft'],a:2,why:['30 ft is the grid spacing, not the coverage radius.','15 ft is the half-spacing wall distance — a different rule.','Correct — 0.7 × 30 = 21 ft protected radius, the basis for corridor and irregular-area layouts.','42 ft is the diameter, not the radius.']}],
fieldNotes:'Pick one mechanical room, measure detector-to-wall and detector-to-detector distances, and verify them against the reflected ceiling plan. Doing this once teaches more than reading the chapter twice.',
summary:['Spacing = ceiling-jet physics codified','0.7S coverage circles; half-spacing to walls; 4 in dead-air setback (heat)','Beams, joists, slopes, and height all reduce or reshape spacing','High spaces stratify — beams and aspirating detection answer what spot detection cannot']
});

t3.quiz=[
{id:'q3-1',type:'mc',q:'Which detector type responds EARLIEST to a slow smoldering cable fire in a ventilated equipment room?',opts:['Fixed-temperature heat detector','Aspirating smoke detection','Ionization spot detector','Rate-of-rise heat detector'],a:1,why:['Heat detection responds long after smoldering begins.','Correct — active air sampling at very high sensitivity is designed for exactly this: early smoldering products in moving air.','Ionization favors flaming fires and struggles with diluted, aged smoke in airflow.','ROR needs a rapid temperature climb — smoldering provides none.'],ref:'Lessons 3.1–3.2'},
{id:'q3-2',type:'mc',q:'A fusible-element fixed-temperature heat detector that has operated must be:',opts:['Reset at the panel','Re-tested with a heat source','Replaced — it is non-restorable','Cleaned and returned to service'],a:2,why:['The panel reset clears the signal, not the melted element.','You cannot re-test a destroyed element — and routine testing must never destroy it in the first place.','Correct — fusible elements are one-shot devices; activation (or a functional melt test) consumes them.','Cleaning does not restore a melted alloy.'],ref:'Lesson 3.2'},
{id:'q3-3',type:'scenario',q:'In a rail tunnel, linear heat detection is preferred over spot smoke detection primarily because:',opts:['LHD is cheaper per foot','LHD provides continuous, locatable detection and tolerates the harsh environment','Smoke detectors cannot be wired that far','Codes prohibit smoke detection underground'],a:1,why:['Cost is not the driver — suitability is.','Correct — a trainway is dusty, wet, windy and long; LHD covers every foot, survives the environment, resists nuisance sources, and reports location for zoned ventilation response.','Wiring distance is an engineering matter, not the constraint.','No such prohibition exists — smoke detection is simply unsuited to trainway conditions.'],ref:'Lesson 3.2'},
{id:'q3-4',type:'code',q:'The operable part of a manual fire alarm box must be mounted between:',opts:['36 and 42 inches above floor','42 and 48 inches above floor','48 and 54 inches above floor','40 and 46 inches above floor'],a:1,why:['Too low — below the code band.','Correct — 42–48 in above floor level, one of the most reliably tested numbers at Level I.','Too high.','A made-up band — the code says 42–48.'],ref:'NFPA 72 Ch. 17'},
{id:'q3-5',type:'calc',q:'Using the 0.7 rule, a heat detector with a 50 ft listed spacing protects a circle of radius:',opts:['50 ft','25 ft','35 ft','70 ft'],a:2,why:['That is the grid spacing itself.','25 ft is half-spacing (the wall rule), not coverage radius.','Correct — 0.7 × 50 = 35 ft.','70 ft would be the diameter.'],ref:'Lesson 3.4'},
{id:'q3-6',type:'tf',q:'True or False: A valve tamper switch on a sprinkler control valve should initiate an alarm signal so the building evacuates.',opts:['True','False'],a:1,why:['Evacuating a building because a valve moved would train occupants to ignore alarms — and misrepresents the condition.','Correct — valve off-normal is a SUPERVISORY condition: the suppression system is impaired and needs attention, but there is no fire indication. Distinctive signals are mandatory.'],ref:'Lesson 3.3'},
{id:'q3-7',type:'scenario',q:'Smoke from a small fire in a very tall atrium cools and spreads out 15 ft below the ceiling, never reaching ceiling-mounted spot detectors. This phenomenon is:',opts:['The ceiling jet','Stratification','Obscuration','Thermal lag'],a:1,why:['The ceiling jet is what happens when the plume DOES reach the ceiling.','Correct — smoke losing buoyancy and layering below the ceiling is stratification, the classic tall-space detection failure, answered by beams at multiple levels or aspirating points.','Obscuration is the measurement of smoke density, not a plume behavior.','Thermal lag is a heat-detector response delay, unrelated.'],ref:'Lesson 3.4'},
];
})();
</script>
<script>
/* ============ NICET LEVEL I — TOPICS 4–6 (lessons + quizzes) ============ */
(function(){
const C = DATA.certs.find(c=>c.id==='nicet1');
const mkTopic=(id,name,desc)=>{const t={id,name,desc,lessons:[],quiz:[]};C.topics.push(t);return t;};

/* ---------------- TOPIC 4 : CONTROL PANELS & CIRCUITS ---------------- */
const t4=mkTopic('t4','Control Panels & Circuits','FACP anatomy, circuit classes and pathways, conventional vs addressable — the system\'s brain and nervous system');

t4.lessons.push({
id:'l1',title:'FACP Anatomy: Inside the Brain',minutes:19,
objectives:['Identify the functional blocks inside any fire alarm control unit','Explain zones, annunciation, and cause-and-effect logic','Describe resettable vs latching behavior and the reset/silence discipline','Navigate an unfamiliar panel confidently'],
simple:`<p>Open any FACP — a small conventional box or a networked tunnel panel — and you will find the same five functional blocks:</p>
<ul>
<li><strong>Inputs</strong> — the circuits that listen: initiating device circuits or addressable loops bringing in alarms, supervisories, troubles, and monitor points.</li>
<li><strong>Logic</strong> — the decision-maker. In a conventional panel, hardwired relationships (zone 1 → all horns). In addressable panels, a programmable <strong>cause-and-effect matrix</strong> (this detector → these outputs, that LHD zone → those fans).</li>
<li><strong>Outputs</strong> — notification circuits, relays, and control modules that make things happen.</li>
<li><strong>Power</strong> — primary (AC) supply, charger, and standby batteries (Topic 6).</li>
<li><strong>Interface</strong> — display, LEDs, keys and switches for acknowledging, silencing, and resetting; plus communication to annunciators, networks, and supervising stations.</li>
</ul>
<p>Every button on the front is part of a discipline: <strong>Acknowledge</strong> (I have seen it — quiets the local buzzer), <strong>Signal Silence</strong> (occupant notification off, event still active), <strong>Reset</strong> (attempt to return to normal — only succeeds if inputs have cleared). Alarms <strong>latch</strong>: a smoke detector that alarmed stays in alarm at the panel until reset, even if the smoke cleared — because the panel's job is to preserve the event, not tidy it away.</p>`,
technical:`<p><strong>Zones vs points:</strong> a zone is a defined area or grouping for annunciation and response. Conventional panels only know zones (whatever shares a circuit); addressable panels know individual points but still organize them into logical zones for response and display. Zoning is a design decision with operational consequences — responders navigate by the zone text.</p>
<p><strong>Annunciation:</strong> the panel (and remote annunciators, typically at the fire command center or main entrance) must show distinct visible and audible indication for alarm, supervisory, and trouble — and identify the location. Custom label text quality is a commissioning deliverable: an operator at 3 a.m. acts on what the display says, not on what the drawings intended.</p>
<p><strong>Programmed logic to know at Level I:</strong> <em>alarm verification</em> (panel waits/confirms a smoke detector before alarming — nuisance control, max delays apply), <em>positive alarm sequence</em> (trained staff get a short investigation window before general alarm), <em>cross zoning</em> (two detectors/zones required before an action — used for releasing), and <em>time delays</em> on specific functions. Each trades response speed for false-activation resistance and carries code limits.</p>
<p><strong>Physical discipline:</strong> panels are listed assemblies — field modifications must follow the manufacturer's documentation; circuits land on designated terminals with designated supervision; and the program (the site-specific software configuration) is a controlled document that belongs in commissioning records with version identification.</p>`,
field:{
construction:'A panel that powers up clean on day one is rare — expect grounds from construction damage, missing EOLs on unfinished circuits, and placeholder programming. The trades finish the system around the panel; commissioning proves the panel truly reflects the finished system.',
commissioning:'Your FACP SATs walk this anatomy: verify every input annunciates correctly (device → point → label text), every output operates on command, logic executes the approved cause-and-effect matrix, and power transfers cleanly. Keep the approved matrix beside you — the test IS the matrix, row by row.',
amtrak:'Tunnel cause-and-effect matrices are serious engineering: an LHD zone alarm may drive specific fan combinations, damper states, and SCADA notifications that differ by tunnel section and scenario. Matrix verification — every cause, every effect, witnessed — is among the highest-value work owner commissioning does.',
fire:'Silence vs reset discipline matters in the field: silencing during testing is routine, but a reset wipes latched context — never reset a panel with an unexplained alarm before the cause is identified and recorded.'},
terms:[['FACU/FACP','The listed control unit: inputs, logic, outputs, power, interface'],['Zone','A defined area or grouping used for annunciation and response'],['Cause-and-effect matrix','The documented input→output logic map the panel must execute (also: sequence of operations)'],['Latching','Alarms remain indicated until manually reset, preserving the event'],['Alarm verification','Listed feature delaying/confirming smoke alarms briefly to reject transients'],['Positive alarm sequence','Staff investigation window before general alarm, under strict time limits'],['Cross zoning','Requiring two independent detections before an action (common for releasing service)']],
memory:['Panel blocks: "I-L-O-P-I: In, Logic, Out, Power, Interface."','Button order on arrival: "Ack, then think" — acknowledge silences the buzzer; reset is a decision, not a reflex.'],
examTips:['Know silence vs reset behavior and that alarms latch — scenario questions probe whether resetting "fixes" anything (it does not; it clears indication only if the input cleared).','Alarm verification applies to smoke detectors, not pull stations — a manual alarm is never delayed by verification.'],
checks:[{q:'A pull station is activated and then restored to normal. The FACP will:',opts:['Return to normal automatically','Remain in alarm until manually reset','Switch the event to supervisory','Silence its own NACs after 60 seconds'],a:1,why:['Automatic restoration would erase the record of an alarm event.','Correct — alarm conditions latch at the panel until an authorized manual reset, and reset only completes because the station was restored first.','Signal categories never migrate — an alarm stays an alarm.','Notification continues until silenced or reset by an operator per the programmed discipline.']}],
fieldNotes:'On your next panel session, find and read the version/revision identifier of the site program, and confirm it matches the commissioning record. Configuration control on panel software is a habit that separates professional commissioning from box-checking.',
summary:['Every panel = inputs, logic, outputs, power, interface','Zones organize response; label text is operational safety','Ack / silence / reset are distinct acts; alarms latch','Verification, positive alarm sequence and cross zoning trade speed for certainty, under code limits']
});

t4.lessons.push({
id:'l2',title:'Circuit Classes & Pathway Survivability',minutes:20,
objectives:['Explain what circuit class designations actually promise','Contrast Class B and Class A behavior under a single open','Describe Classes C, D, E, N, and X at recognition level','Connect pathway survivability levels to real designs'],
simple:`<p>Wire fails. The class system is NFPA 72's honest vocabulary for <strong>what a circuit still does after one failure</strong>. The two you will handle constantly:</p>
<ul>
<li><strong>Class B</strong> — one path out to the EOL. A single open splits the circuit: devices before the break still work, everything past it is lost — but supervision annunciates a trouble so the impairment is known. The economical default.</li>
<li><strong>Class A</strong> — the circuit loops back to the panel on a separate return path. A single open? The panel feeds both ends and <strong>every device keeps operating</strong>, plus a trouble reports the break. Redundancy bought with extra conductor and routing rules.</li>
</ul>
<p>The routing rule that makes Class A honest: the return path must be physically separated from the outgoing path — a loop whose supply and return share the same conduit dies together in one conduit strike, making the "redundancy" a fiction.</p>`,
technical:`<p>Full class vocabulary (2022-era NFPA 72 Ch. 12 — learn A and B deeply, recognize the rest):</p>
<ul>
<li><strong>Class A</strong> — redundant path; operates during a single open; ground conditions annunciate.</li>
<li><strong>Class B</strong> — no redundant path; single open = partial loss with trouble annunciation.</li>
<li><strong>Class C</strong> — end-to-end communication is verified rather than the conductor itself (think IP/network paths, cellular communicators): loss of the communication channel annunciates.</li>
<li><strong>Class D</strong> — fail-safe: on failure, the intended function still occurs (like a door holder releasing on power loss).</li>
<li><strong>Class E</strong> — not monitored for integrity (permitted only where allowed).</li>
<li><strong>Class N</strong> — engineered network pathways (Ethernet-style infrastructures) with defined redundancy and monitoring.</li>
<li><strong>Class X</strong> — the premium tier: redundant path that keeps operating through a single open <em>or</em> a single short circuit (descendant of the old Style 7 SLC).</li>
</ul>
<p><strong>Legacy note:</strong> older documents speak in "styles" (Style 4, 6, 7); styles were retired from the code but persist in specs and the field — Style 6 ≈ Class A, Style 7 ≈ Class X.</p>
<p><strong>Pathway survivability</strong> is the second axis: not "what happens after an electrical fault" but "does the pathway survive fire attack" — Levels 0 through 3, where higher levels demand 2-hour circuit integrity cable, 2-hour rated enclosures, or sprinkler-protected routing. Mass notification and high-rise voice systems, and analogous critical infrastructure circuits, are where survivability requirements bite: the system must keep talking to zones not yet involved in fire while another zone burns.</p>`,
diagram:{svg:`<svg viewBox="0 0 640 210" width="640" height="210" font-family="system-ui" font-size="11">
<g fill="none" stroke="var(--ink2)" stroke-width="1.8">
<rect x="15" y="30" width="70" height="50" rx="7" stroke="var(--accent)"/><text x="50" y="60" text-anchor="middle" fill="var(--ink)" font-weight="600">FACP</text>
<path d="M85 45 H300"/><circle cx="140" cy="45" r="6" fill="var(--surface)" stroke="var(--s2)"/><circle cx="200" cy="45" r="6" fill="var(--surface)" stroke="var(--s2)"/><circle cx="260" cy="45" r="6" fill="var(--surface)" stroke="var(--s2)"/>
<rect x="300" y="36" width="12" height="20" stroke="var(--s3)"/>
<path d="M228 38 l12 14 M240 38 l-12 14" stroke="var(--crit)" stroke-width="2.2"/>
<text x="180" y="20" fill="var(--ink)" font-weight="600">CLASS B</text><text x="330" y="49" fill="var(--muted)">EOLR</text>
<text x="15" y="100" fill="var(--muted)">open ✕ → devices past the break are lost (trouble annunciates)</text>
</g>
<g fill="none" stroke="var(--ink2)" stroke-width="1.8" transform="translate(0,115)">
<rect x="15" y="15" width="70" height="50" rx="7" stroke="var(--accent)"/><text x="50" y="45" text-anchor="middle" fill="var(--ink)" font-weight="600">FACP</text>
<path d="M85 28 H560 M85 52 H430 M560 28 V80 H85 M430 52 V52"/>
<path d="M85 52 H430 M430 52 C470 52 470 80 430 80 L85 80" stroke="var(--ink2)"/>
<circle cx="180" cy="28" r="6" fill="var(--surface)" stroke="var(--s2)"/><circle cx="320" cy="28" r="6" fill="var(--surface)" stroke="var(--s2)"/><circle cx="460" cy="28" r="6" fill="var(--surface)" stroke="var(--s2)"/>
<path d="M244 21 l12 14 M256 21 l-12 14" stroke="var(--crit)" stroke-width="2.2"/>
<text x="140" y="8" fill="var(--ink)" font-weight="600">CLASS A</text>
<text x="240" y="100" fill="var(--muted)">open ✕ → panel feeds BOTH ends; all devices still operate</text>
</g></svg>`,cap:'Class B annunciates a single open; Class A operates through it via the separately-routed return loop.'},
field:{
construction:'Class A conduit separation is designed on paper and violated in the field wherever a pull was inconvenient — supply and return nestled in one tray defeats the class. Verifying physical route separation is inspection work, not panel work.',
commissioning:'Class A verification is a specific SAT act: open the loop at a point, confirm ALL devices still respond from both feeds, confirm trouble annunciates, restore. If your script only checks the trouble, it has tested half the promise.',
amtrak:'Life-safety circuits in tunnel infrastructure lean on Class A/X pathways and survivability-rated routing because the fire the system must survive is IN the space the cable crosses. NFPA 130 emergency-function thinking and NFPA 72 survivability levels arrive at the same instinct: the path must outlive the event it reports.',
fire:'When a networked panel system connects buildings or fan plants, those interconnections are pathways with their own class designations — ask what class the network claims, then ask what test demonstrates it.'},
terms:[['Class B','Single path with supervision; an open loses downstream devices but annunciates trouble'],['Class A','Redundant return path, physically separated; operates through a single open'],['Class X','Redundant path operating through a single open OR short'],['Class C','Integrity verified end-to-end (communications paths) rather than by conductor supervision'],['Class D','Fail-safe — failure produces the intended function'],['Class N','Engineered network pathways with defined monitoring/redundancy'],['Pathway survivability','Levels 0–3 — the pathway\'s resistance to fire attack (CI cable, rated enclosure, sprinklered routing)']],
memory:['"B = Breaks and tells. A = Alternate route. X = eXtra — opens AND shorts."','Survivability question: "does the wire outlive the fire?" Classes = electrical faults; survivability = fire attack.'],
examTips:['A favorite trap: Class A tolerates a single OPEN — a short circuit still disables a standard Class A circuit (that is what Class X exists for).','Physical separation of outgoing/return routing is part of what makes Class A legitimate — expect a question where shared conduit is the flaw.'],
checks:[{q:'A single open occurs mid-loop on a properly installed Class A IDC. The result is:',opts:['All devices remain operable and a trouble annunciates','Devices beyond the open stop working','The circuit goes into alarm','Nothing — Class A hides faults'],a:0,why:['Correct — the panel drives both ends of the loop, so every device stays in service, and the break itself reports as trouble.','That is Class B behavior — the redundancy exists precisely to prevent it.','An open cannot create the low-resistance path an alarm requires.','Class A never hides faults; annunciation is mandatory. Redundancy without annunciation would rot silently.']}],
fieldNotes:'Pick one Class A loop on your project and trace the return path routing on drawings: is the separation real (different conduits, different routes) or cosmetic? Bring the answer to your next design review — it is a high-value question either way.',
summary:['Classes answer: what does the circuit still do after one fault?','B = tells; A = survives an open (with separated return); X = survives open or short','C/D/E/N cover communications, fail-safe, unmonitored, and network cases','Survivability (Levels 0–3) is a separate axis: surviving fire attack, via CI cable or protected routing']
});

t4.lessons.push({
id:'l3',title:'Conventional vs Addressable Systems',minutes:18,
objectives:['Contrast zone-based and point-based identification','Explain SLC polling and how one pair of wires carries many conversations','Describe monitor, control, and relay modules','Choose the right architecture and defend the choice'],
simple:`<p><strong>Conventional:</strong> the panel knows its circuits, not its devices. "Zone 3 is in alarm" means <em>something</em> on that pair of wires activated — walk the zone to find out what. Detection is a current change (Topic 2); identity is geographic.</p>
<p><strong>Addressable:</strong> every device carries a unique address and talks digitally with the panel over a <strong>signaling line circuit (SLC)</strong>. "Smoke detector 2-047, Fan Plant B corridor" — identity is individual. The panel polls devices continuously, so a device that stops answering is itself a supervision event (a missing/no-answer trouble by address).</p>
<p>The trade: conventional is simple, cheap for small buildings, and coarse. Addressable costs more per point but buys pinpoint annunciation, per-device diagnostics (dirty detector warnings before nuisance alarms), flexible software zoning, and dramatically faster troubleshooting on large systems. At tunnel scale, addressable is the only sane architecture.</p>`,
technical:`<ul>
<li><strong>SLC mechanics:</strong> the panel digitally interrogates addresses in rotation (or devices report on protocol schedules). Data and power typically share the pair. Response verification replaces the EOLR concept — supervision is conversational, not resistive.</li>
<li><strong>Modules bridge worlds:</strong> <em>monitor modules</em> give an address to conventional contacts (a waterflow switch, a pull station, an LHD interface); <em>control/relay modules</em> give the panel an addressable output (fan start relay, damper, door release); <em>isolator modules</em> segment the SLC so a short circuit only removes one segment — how a Class A/X SLC honors its promises on long loops.</li>
<li><strong>Analog/intelligent detection:</strong> addressable smoke detectors commonly report an analog sensitivity value the panel evaluates — enabling drift compensation, maintenance alerts, and day/night sensitivity — the panel becomes the calibration supervisor.</li>
<li><strong>Design consequences:</strong> device counts per loop are listed limits; loop layout, isolator placement, and spare capacity are design decisions you will see argued in submittals. Software zone changes need configuration control (the program is the system).</li>
</ul>`,
field:{
construction:'Addressing errors are the classic startup snag: devices installed with duplicate or wrong addresses, or the as-built address schedule diverging from the program. The fix is process: a controlled address schedule updated with every change.',
commissioning:'Point-to-point verification IS commissioning an addressable system: activate every device, confirm the right address, right label, right response — no sampling. On large projects that discipline is weeks of work and worth every hour.',
amtrak:'Your LHD and VESDA connect through interface/monitor modules — meaning what the FACP "knows" about the tunnel is mediated by the address and label database. Database integrity (point text matching physical chainage/rooms) is a deliverable your SATs implicitly certify.',
fire:'Dirty-detector reports from analog detection turn maintenance from schedule-based to condition-based — read those reports during warranty walk-downs; they predict where nuisance alarms would have come from.'},
terms:[['Conventional system','Zone-based: identity = which circuit changed current'],['Addressable system','Point-based: devices carry unique addresses and communicate digitally'],['SLC','Signaling line circuit — the polled data+power pathway addressable devices share'],['Monitor module','Gives an address to a conventional contact input'],['Control/relay module','Addressable output commanding external equipment'],['Isolator module','Confines an SLC short to one segment, preserving the rest of the loop'],['Drift compensation','Intelligent detector/panel adjustment for dust accumulation, with maintenance alerts before nuisance thresholds']],
memory:['"Conventional knows WHERE (zone). Addressable knows WHO (device)."','Modules: Monitor = Mouth for dumb inputs; Control = Command to the world; Isolator = firebreak for shorts.'],
examTips:['A no-answer device on an SLC = trouble by address — polling IS the supervision. Expect a question contrasting this with EOLR supervision.','Isolator modules relate to SHORT circuits on SLCs — pairing them with Class X claims is a favorite exam construction.'],
checks:[{q:'On an addressable SLC, supervision of an individual device is achieved by:',opts:['An end-of-line resistor at each device','The panel\'s polling — a device that fails to respond generates a trouble','A dedicated supervisory wire pair per device','Measuring loop voltage drop'],a:1,why:['EOLRs supervise conventional current loops — the SLC replaces that mechanism.','Correct — conversational supervision: every address must answer; silence is annunciated as a trouble for that point.','Dedicated pairs per device would defeat the entire point of a shared SLC.','Voltage drop matters for capacity, but it is not the supervision mechanism.']}],
fieldNotes:'Ask for (or export) the current SLC device report from one panel: addresses, types, labels, analog values. Twenty minutes reading it will teach you the real-world texture of the database your project runs on — including the mislabels waiting to be found.',
summary:['Conventional = zones by current change; addressable = points by digital polling','Modules adapt contacts and controls into the address world; isolators contain shorts','Analog detection enables drift compensation and predictive maintenance','At infrastructure scale, database integrity is system integrity']
});

t4.quiz=[
{id:'q4-1',type:'mc',q:'Pressing RESET on an FACP during an active alarm whose initiating device is still in alarm will:',opts:['Return the system to normal','Fail to clear the alarm — the panel re-alarms from the active input','Convert the alarm to a trouble','Silence the notification appliances permanently'],a:1,why:['Reset cannot erase an input that still exists.','Correct — reset drops latched states, re-scans inputs, and immediately re-enters alarm from any input still active. Clear the device first, then reset.','Signal categories never convert.','Silencing is a separate function, and re-alarm typically re-sounds appliances.'],ref:'Lesson 4.1'},
{id:'q4-2',type:'mc',q:'Which class designation promises continued operation of all devices during a single open circuit?',opts:['Class B','Class A','Class E','Class C'],a:1,why:['Class B loses devices downstream of the open (with trouble annunciation).','Correct — the separately-routed return path lets the panel feed both sides of the break.','Class E is not even monitored for integrity.','Class C verifies end-to-end communications — a different mechanism entirely.'],ref:'Lesson 4.2'},
{id:'q4-3',type:'scenario',q:'A short circuit occurs on a Class A signaling line circuit without isolator modules. The most likely result is:',opts:['Only one device is lost','The entire loop is disabled until the short is cleared','Nothing — Class A survives shorts','The panel automatically converts to Class B'],a:1,why:['Without isolation, a short is not confined to one device.','Correct — Class A survives a single OPEN; a short collapses the shared pair unless isolator modules segment it (or the circuit is Class X with short-circuit tolerance).','Surviving shorts is Class X\'s promise, not Class A\'s.','No such automatic conversion exists.'],ref:'Lessons 4.2–4.3'},
{id:'q4-4',type:'mc',q:'A waterflow switch (dry contact) is connected to an addressable system through a:',opts:['Control module','Isolator module','Monitor module','NAC extender'],a:2,why:['Control modules are outputs — they command equipment.','Isolators segment SLC shorts.','Correct — monitor modules give conventional contact devices an address and a supervised input path onto the SLC.','NAC extenders are booster power supplies for notification circuits.'],ref:'Lesson 4.3'},
{id:'q4-5',type:'tf',q:'True or False: Alarm verification may be applied to manual pull stations to reduce nuisance alarms.',opts:['True','False'],a:1,why:['Delaying a human\'s deliberate alarm defeats the device\'s purpose.','Correct — alarm verification is a smoke-detector feature only; manual stations must alarm without delay features of that kind.'],ref:'Lesson 4.1'},
{id:'q4-6',type:'trouble',q:'An addressable panel shows "NO ANSWER — Device 3-112." The most probable cause is:',opts:['The device is in alarm','An open, removed, failed, or mis-addressed device at that point','Low battery voltage at the panel','A ground fault on primary power'],a:1,why:['An alarm would report as an alarm — the panel is saying the device stopped answering polls.','Correct — no-answer means polling silence: device removed, dead, disconnected, or address conflict. Physical investigation at that point comes next.','Panel power problems generate their own distinct troubles.','Ground faults annunciate as ground faults, not point no-answers.'],ref:'Lesson 4.3'},
];

/* ---------------- TOPIC 5 : NOTIFICATION APPLIANCES ---------------- */
const t5=mkTopic('t5','Notification Appliances','Making sure every occupant hears it, sees it, and understands it — audibility, visibility, and NAC engineering');

t5.lessons.push({
id:'l1',title:'Audible & Visible Notification',minutes:20,
objectives:['Apply public and private mode audibility requirements','Explain the 15 dB rule and sleeping-area numbers','Select strobe candela and explain synchronization','State when voice/intelligibility requirements apply'],
simple:`<p>Detection without notification is a diary entry. Notification design answers: <strong>will every occupant — over machine noise, behind doors, hearing-impaired, asleep — receive the message?</strong></p>
<p><strong>Sound:</strong> loudness is measured in dBA, and the scale is logarithmic — +10 dB feels roughly twice as loud. The code's core move is relative, not absolute: the signal must beat the room's ambient noise by a margin. A quiet office needs modest signal; your fan plant, at full ventilation roar, needs serious sound pressure — or a different strategy entirely (that is what strobes and voice messaging are partly for).</p>
<p><strong>Light:</strong> strobes serve occupants who cannot hear the signal — measured in candela (cd), listed and selected by room size and mounting. Multiple strobes in view must flash <strong>in synchronization</strong>: unsynchronized flashing at combined higher rates poses a photosensitive-seizure risk and reads as visual chaos.</p>
<p><strong>The temporal code:</strong> fire evacuation signals use the standardized <strong>Temporal-3 pattern</strong> (three pulses, pause, repeat) so a fire alarm sounds like a fire alarm everywhere on earth. CO alarms use Temporal-4. Uniformity is the message.</p>`,
technical:`<ul>
<li><strong>Public mode</strong> (general occupants): signal at least <strong>15 dBA above average ambient</strong>, or 5 dBA above the maximum sound lasting ≥60 s, whichever is greater, measured 5 ft above floor.</li>
<li><strong>Sleeping areas:</strong> at least <strong>75 dBA at the pillow</strong> — and low-frequency (520 Hz) signal requirements exist for commercial sleeping spaces because low tones wake sleepers (and impaired sleepers) far more reliably.</li>
<li><strong>Private mode</strong> (staff-response facilities, e.g., hospitals): 10 dBA above average ambient — quieter, because trained staff respond rather than the public evacuating.</li>
<li><strong>Ceiling on sound:</strong> maximum <strong>110 dBA</strong> at minimum hearing distance — beyond that is hearing damage, not notification.</li>
<li><strong>Strobes:</strong> wall-mounted 80–96 in above floor; candela per the room-size tables (bigger room → higher cd or more appliances); corridor and sleeping-room rules differ; synchronization required where multiple strobes are visible together.</li>
<li><strong>Voice systems (EVACS):</strong> where messages direct behavior (high-rises, transit, phased evacuation), <strong>intelligibility</strong> — being understood, not merely heard — becomes the acceptance criterion, measured in designated acoustically distinguishable spaces (ADS). Speaker layout, tap settings, and acoustics drive it.</li>
</ul>`,
field:{
construction:'Ambient noise is a design assumption until the building runs — then it is a fact. Acceptance measurements in mechanical spaces regularly expose optimistic assumptions; the fix (higher taps, more appliances, different tech) is cheapest before closeout.',
commissioning:'Sound level surveys with a calibrated meter are commissioning deliverables: ambient reading, alarm reading, margin math, room by room, documented. For voice systems add intelligibility measurements — a system can be loud and unintelligible in a reverberant space.',
amtrak:'Tunnels and plant rooms are the hard case: extreme ambients (fans at speed), long reverberant geometry, hearing protection in use. Strategies stack — visible signals, voice where intelligibility is achievable, and operational procedures — and every measured margin belongs in your records.',
fire:'Temporal-3 discipline matters during integrated tests: distinctive evacuation signal for alarm, distinct supervisory/trouble sounds at panels — occupants and operators are trained by consistency; testing verifies it.'},
terms:[['dBA','A-weighted decibels — sound pressure weighted to human hearing; logarithmic scale'],['Public/private mode','General-occupant vs trained-staff notification, with different margin requirements (15 vs 10 dBA over ambient)'],['Temporal-3','The standardized three-pulse fire evacuation pattern (T-4 is carbon monoxide)'],['Candela (cd)','Luminous intensity unit for strobe ratings/selection'],['Synchronization','Multiple visible strobes flashing together — required to avoid composite high flash rates'],['Intelligibility','Voice systems: the message must be understood — measured, not assumed'],['520 Hz low frequency','Signal requirement for commercial sleeping areas — proven to wake sleepers']],
memory:['"15 over average, 5 over the loudest minute, 75 at the pillow, 110 never exceed."','Strobe wall band: 80–96 in — "eight-oh to eight-feet."'],
examTips:['Expect a numbers question from the audibility set and know which mode it references — public vs private changes the margin.','Strobe questions hinge on room size → candela tables and on synchronization triggers; know the concepts and where the tables live (NFPA 72 Ch. 18).'],
checks:[{q:'A mechanical room has an average ambient of 87 dBA. Public mode audible notification must produce at least:',opts:['90 dBA','102 dBA','97 dBA','110 dBA'],a:1,why:['That is only +3 — inaudible over machinery.','Correct — 87 + 15 = 102 dBA (and note how close that runs to the 110 dBA ceiling: this is why loud spaces push design toward visible/voice strategies).','+10 is the PRIVATE mode margin.','110 is the maximum permitted at minimum hearing distance, not the requirement here.']}],
fieldNotes:'Borrow the sound meter during your next notification test and take three readings yourself: ambient, alarm, margin. Doing the arithmetic in the room makes the code numbers permanent.',
summary:['Audibility is relative: +15 dBA public / +10 private / 75 at pillow / 110 max','Strobes: candela by room size, 80–96 in mounting, synchronized in shared view','Temporal-3 = fire, everywhere; 520 Hz for sleeping areas','Voice systems are judged on intelligibility, measured in real spaces']
});

t5.lessons.push({
id:'l2',title:'NAC Design & Voltage Drop',minutes:20,
objectives:['Total appliance currents and check circuit capacity','Compute end-of-line voltage drop and pass/fail against listed ranges','Explain why the calculation uses lowest battery voltage','Describe NAC extenders and sync across sources'],
simple:`<p>A notification appliance circuit is a 24 V DC power distribution problem wearing a fire alarm badge. Every horn and strobe draws current; every foot of wire steals voltage (Topic 2 physics). The design must guarantee the <strong>last appliance on the worst day</strong> — batteries depleted, every appliance screaming — still receives at least its minimum listed voltage. Not typical day: worst day. That is the entire logic of the voltage drop calculation, and it is free points on the exam once the method is automatic.</p>`,
technical:`<p><strong>The method (lump-sum version):</strong></p>
<ol>
<li><strong>Total the alarm current:</strong> sum every appliance's listed alarm draw (data sheets; strobes by their selected candela tap — higher cd = more current).</li>
<li><strong>Start from worst-case source voltage:</strong> not 24.0 V nominal but the <strong>low end of battery discharge — 20.4 V</strong> (85% of 24) is the standard basis.</li>
<li><strong>Compute loop resistance:</strong> wire resistance per 1,000 ft (from tables, by AWG) × circuit length × 2 (out and back).</li>
<li><strong>Drop = I × R;</strong> end-of-line voltage = source − drop.</li>
<li><strong>Pass/fail:</strong> EOL voltage must sit inside the appliances' listed operating range — the standard regulated 24 V appliance window is <strong>16–33 V</strong>.</li>
</ol>
<p><strong>Worked example:</strong> 8 appliances at 0.090 A = 0.72 A total. Circuit: 250 ft of 14 AWG (≈2.5 Ω/1000 ft per conductor). Loop R = 250 × 2 × 2.5/1000 = 1.25 Ω. Drop = 0.72 × 1.25 = 0.9 V. EOL voltage = 20.4 − 0.9 = 19.5 V ≥ 16 V → <strong>passes</strong>. (Point-to-point calculation — dropping current as appliances tap off — is more accurate and less conservative; lump-sum treats all load at the end and always errs safe.)</p>
<p><strong>Design levers when a circuit fails:</strong> heavier gauge, shorter runs, split the circuit, or add an <strong>NAC extender</strong> (booster power supply) — a remote listed supply triggered by the panel, with its own primary/secondary power and battery calculation. <strong>Synchronization must survive the split:</strong> strobes fed from panel and extenders still must flash together, via compatible sync protocols — a detail acceptance testing specifically watches.</p>`,
field:{
construction:'The install-side failure mode: candela taps set higher than designed (helpful electrician, "more is better") silently adds current the calc never carried. Tap verification against the drawings is a real inspection line item.',
commissioning:'Meter the proof: with the system on secondary power and NACs active, measure EOL voltage at the farthest appliance. The calculation predicted it; the meter confirms it; your record documents it. That triangle is commissioning in one sentence.',
amtrak:'Long runs in big infrastructure eat voltage — expect heavier gauges, distributed extenders, and careful sync engineering across power sources in the plant buildings and stations. The physics is identical to the 8-horn example; only the scale changes.',
fire:'NAC extender batteries are easy to orphan in maintenance programs because they hide in electrical rooms. Commissioning should ensure every booster appears in the ITM asset list with its own battery dates.'},
terms:[['NAC','Notification appliance circuit — supervised output circuit powering horns/strobes/speakers'],['Voltage drop','I × R loss along circuit conductors; the design constraint on NAC length/load'],['20.4 V basis','Worst-case source voltage for calculations — battery near end of discharge (85% of 24 V)'],['16–33 V window','Standard listed operating range for regulated 24 V appliances — EOL voltage must stay inside it'],['Lump-sum vs point-to-point','Conservative all-load-at-end calculation vs exact per-segment calculation'],['NAC extender','Listed booster power supply extending notification capacity, with its own power and batteries'],['Candela tap','Field-selectable strobe intensity setting — determines its current draw']],
memory:['The mantra: "Last device, worst day, still in range."','20.4 in, 16 out: start the calc at 20.4 V, finish above 16 V.'],
examTips:['Forgetting the ×2 loop factor (out AND back) is the classic wrong answer generated on purpose — it will be among the options.','If a question offers 24.0 V as the calculation basis, it is testing whether you know to use worst-case battery voltage instead.'],
checks:[{q:'A NAC carries 1.0 A through 300 ft of wire at 2.0 Ω per 1,000 ft per conductor. Starting from 20.4 V, the end-of-line voltage is:',opts:['19.2 V','18.0 V','19.8 V','16.0 V'],a:0,why:['Correct — loop R = 300×2×2.0/1000 = 1.2 Ω; drop = 1.0×1.2 = 1.2 V; 20.4 − 1.2 = 19.2 V. Passes the 16 V floor.','18.0 V would need a 2.4 V drop — that doubles the resistance again; check for a ×2 applied twice.','19.8 V forgets the return conductor (×2) — the planted trap.','16.0 V is the pass/fail floor, not the computed result.']}],
fieldNotes:'Find one NAC calc sheet in your project submittals and re-run it yourself with the data sheet currents. If you can reproduce the engineer\'s number, you own this topic; if you find a discrepancy, you have a finding.',
summary:['NAC design = guarantee the last appliance its listed voltage on worst-case battery','Method: total current → 20.4 V basis → loop R (×2!) → I×R → compare to 16 V floor','Fixes: gauge, length, splits, NAC extenders — with synchronization preserved','Field verification: measured EOL voltage on secondary power closes the loop']
});

{id:'q5-1',type:'mc',q:'The standard audible evacuation signal pattern for fire alarms is:',opts:['Continuous steady tone','Temporal-3','Temporal-4','March time'],a:1,why:['Steady tones are legacy and non-distinctive.','Correct — three pulses, pause, repeat: the universal fire evacuation signature.','Temporal-4 is carbon monoxide.','March time is a legacy coding pattern, no longer the standard evacuation signal.'],ref:'Lesson 5.1'},
{id:'q5-2',type:'calc',q:'An office corridor has an average ambient of 55 dBA. Minimum public-mode signal level required:',opts:['70 dBA','60 dBA','75 dBA','65 dBA'],a:0,why:['Correct — 55 + 15 = 70 dBA.','+5 applies only against the maximum sound lasting 60 s, and only if greater than average+15.','75 dBA is the sleeping-area pillow requirement.','+10 is the private mode margin.'],ref:'Lesson 5.1'},

{id:'q5-5',type:'scenario',q:'During acceptance testing on secondary power, the farthest strobe on a NAC measures 15.2 V. The correct disposition is:',opts:['Pass — it flashed during the test','Fail — below the 16 V listed minimum; the circuit must be corrected','Pass — voltage only matters on primary power','Fail — strobes require 24 V at all times'],a:1,why:['Flashing today is not the criterion — operating within listed range on worst-case power is.','Correct — below the 16–33 V listed window means no guaranteed operation at end of battery discharge: redesign (gauge, split, extender) and retest.','Backwards — secondary/worst-case power is exactly when the guarantee matters most.','24 V is nominal, not the minimum; the listed window is 16–33 V.'],ref:'Lesson 5.2'},
];

const t6=mkTopic('t6','Power Supplies & Batteries','Primary power rules, secondary standby duty, and the battery calculation that appears on every exam');

t6.lessons.push({
id:'l1',title:'Primary & Secondary Power',minutes:17,
objectives:['State the requirements for primary (AC) power connections','Explain the 24-hour standby + alarm duty for secondary power','Describe power transfer behavior and what commissioning verifies','Identify power-related trouble conditions'],
simple:`<p>A fire alarm system that dies with the lights is worse than useless — fires cause power failures, and power failures accompany fires. So the code demands <strong>two independent, reliable power sources</strong>: primary (the building's AC service) and secondary (batteries, or batteries plus generator), with automatic, seamless transfer. The system must ride through the blackout and still have the strength to sound the alarm at the end of it.</p>`,
technical:`<ul>
<li><strong>Primary power:</strong> a <strong>dedicated branch circuit</strong> — serving nothing else — mechanically protected, with its disconnecting means <strong>identified (marked "FIRE ALARM"), colored red where required by spec/edition, and access restricted/lockable</strong> so a helpful hand cannot de-energize the system by mistake. No ordinary switches ahead of it.</li>
<li><strong>Secondary duty (the numbers that matter):</strong> upon primary failure the system must run <strong>24 hours in standby</strong> and then still deliver <strong>5 minutes of full alarm</strong> load. For emergency voice/alarm communication systems: 24 hours standby then <strong>15 minutes at maximum connected load</strong>. (Supervising-station and household variants exist; learn the 24+5 and 24+15 pairs cold.)</li>
<li><strong>Transfer:</strong> automatic, with no loss of function; loss of primary power annunciates as a trouble signal (with a permitted delay so momentary dips do not nuisance-report). Batteries float-charge on primary power via a supervised charger; charger failure and low battery are distinct troubles.</li>
<li><strong>Generator-backed designs</strong> can reduce battery duration where permitted — the combination still must meet the duty; commissioning then includes the transfer choreography between utility, generator, and batteries.</li>
</ul>`,
field:{
construction:'The dedicated-circuit rule is violated by accident constantly during construction — temporary loads tapped from the "convenient" fire alarm circuit. Breaker labeling, red identification, and lock devices are the visible fingerprints inspectors check first.',
commissioning:'The power SAT trio: (1) kill primary → clean transfer, trouble annunciates, system fully functional on batteries; (2) restore → recharge supervised; (3) measured battery voltages before/during/after. On generator sites, add the full utility→generator→battery sequence with timings.',
amtrak:'Critical infrastructure layers power: utility feeds, standby generation, UPS systems, and panel batteries. Commissioning maps which layer carries the fire alarm through which failure — and proves the annunciation chain reports every layer\'s failure to somewhere staffed.',
fire:'Battery date codes and terminal condition are 10-second inspections with outsized value: swollen cases, corrosion, or 5-year-old cells in a 4-year replacement program are findings you can spot on any walkdown.'},
terms:[['Primary power','The main AC supply — dedicated branch circuit, identified, protected, restricted access'],['Secondary power','Standby source (batteries ± generator) carrying the system through primary failure'],['24 + 5 rule','Secondary duty: 24 h standby then 5 min full alarm (24 + 15 for voice systems)'],['Float charging','Charger maintains batteries at full capacity during normal operation, supervised for failure'],['Transfer','Automatic assumption of load by secondary power with no loss of function, annunciated as trouble']],
memory:['"Dedicated, marked, locked" — the three primary-circuit adjectives.','Duty pairs: "24-and-5 to stay alive; voice needs 15."'],
examTips:['The 24 h + 5 min (and voice 24 + 15) figures are near-certain exam material.','Loss of AC power = TROUBLE signal (delay permitted). If an option calls it supervisory, it is wrong.'],
checks:[{q:'Following a primary power failure, a (non-voice) fire alarm system must be capable of:',opts:['24 hours of alarm operation','24 hours standby, then 5 minutes of alarm','5 hours standby, then 24 minutes of alarm','Immediate shutdown with trouble signal'],a:1,why:['24 hours of full alarm would need enormous batteries — the duty is standby-then-alarm.','Correct — ride through a day-long outage, then still sound a full evacuation.','Reversed numbers — a trap option.','Shutdown is the exact outcome the secondary supply exists to prevent.']}],
fieldNotes:'Find the fire alarm breaker in one electrical room: is it labeled, red-identified, and locked? Is anything else on the circuit? A two-minute audit — and one of the most common real-world findings there is.',
summary:['Two independent sources, automatic transfer, everything annunciated','Primary: dedicated, identified, protected, access-restricted circuit','Secondary duty: 24 h + 5 min (voice: 24 h + 15 min)','Commissioning proves the transfer, the duty, and the reporting']
});

t6.lessons.push({
id:'l2',title:'Battery Calculations',minutes:20,
objectives:['Compute standby and alarm ampere-hour demand','Apply the 20% derating (×1.2) safety factor','Select a standard battery size from the result','Check an existing calc sheet for errors'],
simple:`<p>Battery sizing is bookkeeping: <strong>how many ampere-hours does the worst-case duty consume?</strong> An ampere-hour is one amp flowing for one hour. The system spends them in two modes — quietly (standby current × 24 hours) and loudly (alarm current × 5 minutes) — and the battery must cover both, plus a safety margin for aging.</p>
<p>That is the whole recipe:</p>
<ol><li>Standby demand = total standby current × 24 h</li>
<li>Alarm demand = total alarm current × 0.0833 h (5 minutes as a fraction of an hour; use 0.25 h for voice systems' 15 minutes)</li>
<li>Add them, then <strong>multiply by 1.2</strong> — the 20% derating that covers battery aging and temperature</li>
<li>Round UP to the next standard battery size (7, 12, 18, 26, 33, 55 Ah…)</li></ol>`,
technical:`<p><strong>Worked example — commit this pattern to muscle memory:</strong></p>
<p>Panel + devices standby current: 0.350 A. Alarm current (panel + all NACs + modules): 4.2 A. Non-voice system.</p>
<ul>
<li>Standby: 0.350 × 24 = <strong>8.40 Ah</strong></li>
<li>Alarm: 4.2 × 0.0833 = <strong>0.35 Ah</strong></li>
<li>Subtotal: 8.75 Ah</li>
<li>Derated: 8.75 × 1.2 = <strong>10.5 Ah</strong> → next standard size: <strong>12 Ah batteries</strong> (two 12 V in series for 24 V)</li>
</ul>
<p><strong>Read the structure:</strong> standby dominates — 24 hours of quiet trickle outweighs 5 minutes of full roar. That is why adding devices with standby draw (addressable detectors, modules) moves battery sizes more than adding horns, and why voice systems (0.25 h at max load) shift the balance. Two 12 V batteries in series make the 24 V set: <strong>series adds voltage, capacity stays the battery's Ah rating</strong> — a favorite conceptual trap.</p>
<p><strong>Field verification (NFPA 72 Ch. 14):</strong> calculations age badly — every tenant fit-out adds devices. Periodic testing includes charger checks and load voltage tests; replacement typically runs on a ~4–5 year cycle per manufacturer data regardless of apparent health, because sealed lead-acid capacity fades invisibly.</p>`,
field:{
construction:'Change orders that add devices rarely revisit the battery calc — five years of small additions can silently consume the 20% margin. Owner-side commissioning should demand an updated calc with every system modification.',
commissioning:'Your SAT verifies reality against the sheet: measured standby current vs calculated, measured alarm current vs calculated, and the installed Ah vs required. A measured standby current above calculation is a finding even if the batteries "seem fine."',
amtrak:'Multiply this lesson by every power supply in the system: FACPs, NAC extenders, amplifier cabinets — each has its own calc, its own batteries, its own dates. An asset list with battery data per cabinet is commissioning gold for the maintenance organization inheriting the system.',
fire:'When a panel drops to "low battery" during a functional test on secondary power, you are watching a failed calc, dead cells, or a charger fault — the three suspects, in the order the meter will usually find them.'},
terms:[['Ampere-hour (Ah)','Capacity unit: one amp for one hour; the currency of battery sizing'],['Standby current','System draw in normal supervision — multiplied by 24 h'],['Alarm current','Full-activation draw — multiplied by 0.0833 h (5 min) or 0.25 h (15 min, voice)'],['Derating factor (×1.2)','The 20% margin covering aging and temperature effects'],['Series connection','Two 12 V batteries → 24 V; voltage adds, Ah rating stays the same'],['Load voltage test','Periodic test of battery terminal voltage under load — capacity fade detector']],
memory:['The formula as a sentence: "Standby day plus alarm five, times one-point-two to stay alive."','0.0833 = five minutes in hours. Voice? 0.25. Two numbers, memorized, forever.'],
examTips:['This calculation appears on essentially every NICET Level I exam form in some guise — practice until the sequence is automatic.','Distractor patterns: forgetting ×1.2, using 5 (minutes) instead of 0.0833 (hours), and doubling Ah for series batteries. All three will be answer options.'],
checks:[{q:'Standby current 0.5 A, alarm current 3.0 A, non-voice system. Minimum battery capacity after derating:',opts:['14.7 Ah','12.25 Ah','15.0 Ah','29.4 Ah'],a:0,why:['Correct — (0.5×24)+(3.0×0.0833) = 12+0.25 = 12.25; ×1.2 = 14.7 Ah → select 18 Ah standard size.','12.25 Ah is the subtotal BEFORE the ×1.2 derating — the planted trap.','15.0 Ah rounds the wrong intermediate value — follow the sequence exactly.','29.4 Ah doubles the result — series batteries do not double Ah.']}],
fieldNotes:'Pull one battery calc sheet from your project and audit it: are the per-device standby/alarm currents from current data sheets? Is every module counted? Was it revised after the last change order? Bring findings to the team — this audit skill is exactly what Level II expects.',
summary:['Demand = (standby × 24) + (alarm × 0.0833) — then ×1.2, then round up to standard size','Standby dominates; voice systems use 0.25 h alarm duty','Series pairs give 24 V without adding Ah','Calcs must be re-verified after changes and proven by measurement']
});

{id:'q6-1',type:'mc',q:'The disconnecting means for a fire alarm system\'s primary power circuit must be:',opts:['Accessible to all building occupants','Identified and access-restricted (e.g., marked, red, lockable)','On the lighting panel with general loads','Unmarked for security reasons'],a:1,why:['Public access invites accidental or malicious de-energization.','Correct — dedicated circuit, identified as fire alarm, protected against casual switching: the system must not be killable by mistake.','Sharing a circuit with general loads is exactly what the dedicated-circuit rule prohibits.','Unmarked circuits get switched off by well-meaning people — identification is the requirement.'],ref:'Lesson 6.1'},

{id:'q6-3',type:'calc',q:'A system draws 0.8 A standby and 5.0 A in alarm (non-voice). Required capacity including derating is approximately:',opts:['23.5 Ah','19.6 Ah','24.0 Ah','28.2 Ah'],a:0,why:['Correct — (0.8×24)+(5.0×0.0833) = 19.2+0.42 = 19.62; ×1.2 ≈ 23.5 Ah → 26 Ah standard size.','19.6 Ah omits the ×1.2 derating.','24.0 Ah is a rounded guess, not the computed value.','28.2 Ah applies 1.2 twice or inflates alarm duty — follow the sequence.'],ref:'Lesson 6.2'},

{id:'q6-5',type:'scenario',q:'During SAT, measured standby current is 0.62 A but the approved battery calculation used 0.45 A. Batteries installed match the calc. You should:',opts:['Accept — the batteries physically fit the cabinet','Flag it: demand recalculation and likely larger batteries, since real duty exceeds design','Reduce the alarm current to compensate','Ignore it if the panel shows no trouble'],a:1,why:['Cabinet fit is not a performance criterion.','Correct — the 24-hour standby demand is now 0.62×24 = 14.9 Ah against a design of 10.8 Ah before derating; the installed batteries cannot meet the code duty. Measurement beats paperwork.','Alarm current is a fact of the system, not a knob.','No-trouble today says nothing about hour 23 of a real outage — that is what the calculation protects.'],ref:'Lesson 6.2'},

/* ---------------- TOPIC 7 : DRAWINGS & DOCUMENTATION ---------------- */
const t7=mkTopic('t7','Drawings & Documentation','Reading the paper system: symbols, drawing types, and the documents that make a system legally real');

t7.lessons.push({
id:'l1',title:'Reading Fire Alarm Drawings & Symbols',minutes:19,
objectives:['Identify the standard drawing set: floor plans, risers, details, matrices','Read common NFPA 170 fire alarm symbols','Trace a circuit from panel to farthest device on paper','Spot drawing/field conflicts like an inspector'],
simple:`<p>A fire alarm system exists twice: once in conduit and steel, once on paper. The paper version is what gets reviewed, approved, bid, and enforced — so reading it fluently is a superpower. The standard set:</p>
<ul>
<li><strong>Floor plans</strong> — devices placed on architecture, each with a symbol, and usually an address and circuit tag. The "where."</li>
<li><strong>Riser diagram</strong> — the whole system in one schematic elevation: panels, circuits, device counts per floor/area, power supplies, interconnections. The "how it hangs together." One page that answers most questions.</li>
<li><strong>Details</strong> — mounting heights, typical wiring diagrams, panel layouts, back-box specifics.</li>
<li><strong>Matrix of operation (sequence of operations)</strong> — the input/output logic table: rows of causes, columns of effects. The panel program in table form — and the backbone of your SAT scripts.</li>
</ul>
<p>Symbols follow NFPA 170 conventions with project-specific legends. Never trust memory over the legend — but know the classics on sight: smoke detector (circled S or photo symbol), heat (circled H), pull station (F in a box at a door), horn/strobe (speaker/lightning variants), FACP (rectangle labeled FACP), waterflow (WF), tamper (TS).</p>`,
technical:`<ul>
<li><strong>Drawing hierarchy in a dispute:</strong> specs and contract documents outrank drawings; large-scale details outrank small-scale plans; and addenda/bulletins outrank everything earlier. Knowing the pecking order settles field arguments fast.</li>
<li><strong>Shop drawings vs design drawings:</strong> the engineer's design drawings show intent; the contractor's <strong>shop drawings</strong> (submittals) show exactly what will be installed — device models, candela taps, circuit routing, calculations. Approval of shop drawings is a controlled process; installation must match the APPROVED set, revision by revision.</li>
<li><strong>As-builts / record drawings:</strong> the final truth — field changes red-lined and incorporated. NFPA 72 requires record drawings at closeout; ITM and future modifications depend on their accuracy.</li>
<li><strong>Reading a circuit on paper:</strong> start at the panel schedule (circuit list, breaker, gauge), follow the riser to the area, then the floor plan device-to-device to the EOL. Check: device count matches the riser; addresses sequential and unique; EOL symbol present at the electrically last device; circuit class as specified.</li>
</ul>`,
field:{
construction:'RFIs and change orders live on drawings — a commissioning specialist who can pull the right sheet and point at the governing detail carries disproportionate weight in coordination meetings.',
commissioning:'Pre-functional checklists are drawing-verification exercises: is the field the approved revision? Every device present, at the shown location, at the detailed height? Documentation review before testing catches what functional tests cannot see.',
amtrak:'On a multi-year megaproject, revision control is the battlefield: bulletins, conformed sets, and field changes stack up. The discipline of "what revision am I looking at, and is it the approved one?" is daily bread on the ERT — and exactly the habit NICET expects.',
fire:'The matrix of operation for tunnel systems is the single most important sheet you touch: it encodes which LHD zone drives which fans, dampers, and messages. Your SAT is that sheet, executed row by row with signatures.'},
terms:[['Riser diagram','One-page schematic elevation of the entire system — panels, circuits, counts, interconnections'],['Matrix of operation','Table mapping every input (cause) to every output (effect); also called sequence of operations'],['Shop drawings','Contractor\'s detailed installation submittals — the approved set governs installation'],['Record (as-built) drawings','Closeout drawings incorporating all field changes — required by NFPA 72'],['NFPA 170','Standard for fire safety and emergency symbols'],['Legend','The project\'s symbol dictionary — always check it before assuming']],
memory:['Drawing set roles: "Plans = where, Riser = how, Details = exactly, Matrix = when-then."','Paper hierarchy: "Specs beat drawings, details beat plans, newest beats oldest."'],
